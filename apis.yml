- aid: apify:apify-actors-actor-runs-api
  name: Apify Actors/Actor runs API
  description: >-
    The API endpoints in this section allow you to manage your Apify Actors runs.


    Some API endpoints return run objects. If a run object includes usage costs in dollars, note that
    these values are calculated based on your effective unit pricing at the time of the query. As a result,
    the dollar amounts should be treated as informational only and not as exact figures.


    For completed runs, aggregated fields such as `stats` or dollar usage totals are eventually consistent
    and update within a few seconds. For values that must match finalized totals, wait about 10 seconds
    after the run completed, then fetch the run again.


    For more information about platform usage and resource calculations, see the [Usage and Resources
    documentation](https://docs.apify.com/platform/actors/running/usage-and-resources#usage).
  humanURL: https://apify.com
  baseURL: https://api.apify.com/v2
  tags:
  - Actors/Actor runs
  properties:
  - type: OpenAPI
    url: openapi/apify-actors-actor-runs-api-openapi.yml
- aid: apify:apify-actors-actor-versions-api
  name: Apify Actors/Actor versions API
  description: >-
    The API endpoints in this section allow you to manage your Apify Actors versions.


    - The version object contains the source code of a specific version of an Actor.

    - The `sourceType` property indicates where the source code is hosted, and based

    on its value the Version object has the following additional property:


    | **Value** | **Description**  |

    |---|---|

    | `"SOURCE_FILES"`   | Source code is comprised of multiple files specified in the `sourceFiles` array.
    Each item of the array is an object with the following fields:<br/> - `name`: File path and name<br/>
    - `format`: Format of the content, can be either `"TEXT"` or `"BASE64"`<br/> - `content`: File content<br/><br/>Source
    files can be shown and edited in the Apify Console's Web IDE. |

    | `"GIT_REPO"` | Source code is cloned from a Git repository, whose URL is specified in the `gitRepoUrl`
    field. |

    | `"TARBALL"` | Source code is downloaded using a tarball or Zip file from a URL specified in the
    `tarballUrl` field.  |

    |`"GITHUB_GIST"`| Source code is taken from a GitHub Gist, whose URL is specified in the `gitHubGistUrl`
    field. |


    For more information about source code and Actor versions, check out [Source code](https://docs.apify.com/platform/actors/development/actor-definition/source-code)

    in Actors documentation.
  humanURL: https://apify.com
  baseURL: https://api.apify.com/v2
  tags:
  - Actors/Actor versions
  properties:
  - type: OpenAPI
    url: openapi/apify-actors-actor-versions-api-openapi.yml
