tags:
- name: Tools/Encoding
  x-displayName: Sign and verify objects
  description: The API endpoints described in this section provide utility tools for encoding and decoding data.
paths:
  /v2/tools/encode-and-sign:
    post:
      tags:
      - Tools/Encoding
      summary: Encode and sign object
      description: 'Encodes and signs any JSON object. The encoded value includes a signature

        tied to the authenticated user''s ID, which can later be verified using the

        decode-and-verify endpoint.


        **Important**: The request must specify the `Content-Type: application/json`

        HTTP header.'
      operationId: tools_encode_and_sign_post
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
            example:
              key: value
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncodeAndSignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
  /v2/tools/decode-and-verify:
    post:
      tags:
      - Tools/Encoding
      summary: Decode and verify object
      description: 'Decodes and verifies an encoded value previously created by the

        encode-and-sign endpoint. Returns the original decoded object along with

        information about the user who encoded it and whether that user is verified.


        **Important**: The request must specify the `Content-Type: application/json`

        HTTP header.'
      operationId: tools_decode_and_verify_post
      security: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecodeAndVerifyRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecodeAndVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
components:
  responses:
    Unauthorized:
      description: Unauthorized - authentication required or invalid token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: invalid-token
              message: Authentication token is not valid.
    Forbidden:
      description: Forbidden - insufficient permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: insufficient-permissions
              message: You do not have permission to perform this action.
    UnsupportedMediaType:
      description: Unsupported media type - the Content-Encoding of the request is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: unsupported-content-encoding
              message: Content-Encoding "bla" is not supported.
    MethodNotAllowed:
      description: Method not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: method-not-allowed
              message: 'This API end-point can only be accessed using the following HTTP methods: OPTIONS,GET'
    PayloadTooLarge:
      description: Payload too large - the request body exceeds the size limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: request-too-large
              message: 'The POST payload is too large (limit: 9437184 bytes, actual length: 10485760 bytes).'
    BadRequest:
      description: Bad request - invalid input parameters or request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: invalid-input
              message: 'Invalid input: The request body contains invalid data.'
    TooManyRequests:
      description: Too many requests - rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: rate-limit-exceeded
              message: You have exceeded the rate limit. Please try again later.
  schemas:
    EncodeAndSignResult:
      title: EncodeAndSignResult
      type: object
      required:
      - encoded
      properties:
        encoded:
          type: string
          examples:
          - eyJwYXlsb2FkIjoiLi4uIiwic2lnbmF0dXJlIjoiLi4uIn0=
    ErrorDetail:
      title: ErrorDetail
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ErrorType'
        message:
          type: string
          description: Human-readable error message describing what went wrong.
    DecodeAndVerifyResult:
      title: DecodeAndVerifyResult
      type: object
      required:
      - decoded
      - encodedByUserId
      - isVerifiedUser
      properties:
        decoded:
          description: The original object that was encoded.
        encodedByUserId:
          type:
          - string
          - 'null'
          examples:
          - wRwJZtadYvn4mBZmm
        isVerifiedUser:
          type: boolean
          examples:
          - false
    DecodeAndVerifyResponse:
      title: DecodeAndVerifyResponse
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/DecodeAndVerifyResult'
    ErrorResponse:
      title: ErrorResponse
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    EncodeAndSignResponse:
      title: EncodeAndSignResponse
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/EncodeAndSignResult'
    DecodeAndVerifyRequest:
      title: DecodeAndVerifyRequest
      type: object
      required:
      - encoded
      properties:
        encoded:
          type: string
          examples:
          - eyJwYXlsb2FkIjoiLi4uIiwic2lnbmF0dXJlIjoiLi4uIn0=
