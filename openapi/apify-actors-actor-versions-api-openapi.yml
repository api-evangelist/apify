    WritableVersionSourceType:
      title: WritableVersionSourceType
      description: The version source types accepted in request bodies. Same as `VersionSourceType`, without `SOURCE_CODE`.
      enum:
      - SOURCE_FILES
      - GIT_REPO
      - TARBALL
      - GITHUB_GIST
      type: string
    ListOfEnvVars:
      title: ListOfEnvVars
      type: object
      required:
      - total
      - items
      properties:
        total:
          type: integer
          examples:
          - 5
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
          description: ''
    UpdateVersionRequest:
      title: UpdateVersionRequest
      type: object
      properties:
        versionNumber:
          type: string
          pattern: ^([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])$
          examples:
          - '1.6'
          description: The version number of the Actor. Two numbers separated by a dot, that represent the `MAJOR.MINOR` part of the semantic versioning.
        sourceType:
          $ref: '#/components/schemas/WritableVersionSourceType'
          description: Where the source code of the version lives.
        envVars:
          type: array
          items:
            $ref: '#/components/schemas/EnvVarRequest'
          description: Environment variables for the version.
        applyEnvVarsToBuild:
          type:
          - boolean
          - 'null'
          examples:
          - false
          description: Whether to inject the environment variables at build time.
        buildTag:
          type:
          - string
          - 'null'
          examples:
          - latest
          description: The tag name to apply to a successful build of this version. Can be `null` when the version has no build tag.
        sourceFiles:
          $ref: '#/components/schemas/VersionSourceFiles'
          description: Applies when the `sourceType` is `SOURCE_FILES`. Represents the Actor's file structure as an array of files and folders.
        gitRepoUrl:
          type: string
          description: URL of the Git repository to clone the source code from. Applies when the `sourceType` is `GIT_REPO`.
        tarballUrl:
          type: string
          description: URL of the tarball to download the source code from. Applies when the `sourceType` is `TARBALL`.
        gitHubGistUrl:
          type: string
          description: URL of the GitHub Gist to clone the source code from. Applies when the `sourceType` is `GITHUB_GIST`.
    ErrorDetail:
      title: ErrorDetail
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ErrorType'
        message:
          type: string
          description: Human-readable error message describing what went wrong.
    EnvVarResponse:
      title: EnvVarResponse
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EnvVar'
    SourceCodeFileFormat:
      type: string
      enum:
      - BASE64
      - TEXT
      examples:
      - TEXT
  responses:
    UnsupportedMediaType:
      description: Unsupported media type - the Content-Encoding of the request is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: unsupported-content-encoding
              message: Content-Encoding "bla" is not supported.
    MethodNotAllowed:
      description: Method not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: method-not-allowed
              message: 'This API end-point can only be accessed using the following HTTP methods: OPTIONS,GET'
    PayloadTooLarge:
      description: Payload too large - the request body exceeds the size limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: request-too-large
              message: 'The POST payload is too large (limit: 9437184 bytes, actual length: 10485760 bytes).'
    Forbidden:
      description: Forbidden - insufficient permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: insufficient-permissions
              message: You do not have permission to perform this action.
    BadRequest:
      description: Bad request - invalid input parameters or request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: invalid-input
              message: 'Invalid input: The request body contains invalid data.'
    NotFound:
      description: Not found - the requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: record-not-found
              message: The requested resource was not found.
    Unauthorized:
      description: Unauthorized - authentication required or invalid token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: invalid-token
              message: Authentication token is not valid.
    TooManyRequests:
      description: Too many requests - rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: rate-limit-exceeded
              message: You have exceeded the rate limit. Please try again later.
  securitySchemes:
    httpBearer:
      type: http
      scheme: bearer
      description: 'Bearer token provided in the `Authorization` header (e.g., `Authorization: Bearer your_token`—recommended). [More info](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Authorization).


        Use your API token to authenticate requests. You can find it on the [Integrations page](https://console.apify.com/account#/integrations) in Apify Console. This method is more secure than query parameters, as headers are not logged in browser history or server logs.


        :::danger Security


        Do not share your API token (or account password) with untrusted parties.


        :::


        _When is authentication required?_

        - _Required_ for private Actors, tasks, or resources (e.g., builds of private Actors).

        - _Required_ when using named formats for IDs (e.g., `username~store-name` for stores or `username~queue-name` for queues).

        - _Optional_ for public Actors or resources (e.g., builds of public Actors can be queried without a token).


        For more information, see our [integrations documentation](https://docs.apify.com/platform/integrations).'
    apiKey:
      type: apiKey
      name: token
      in: query
      description: 'API token provided as a query parameter (e.g., `?token=your_token`—less secure).


        Use your API token to authenticate requests. You can find it on the [Integrations page](https://console.apify.com/account#/integrations) in Apify Console.


        :::danger Security


        Do not share your API token (or account password) with untrusted parties.


        :::


        _When is authentication required?_

        - _Required_ for private Actors, tasks, or resources (e.g., builds of private Actors).

        - _Required_ when using named formats for IDs (e.g., `username~store-name` for stores or `username~queue-name` for queues).

        - _Optional_ for public Actors or resources (e.g., builds of public Actors can be queried without a token).


        For more information, see our [integrations documentation](https://docs.apify.com/platform/integrations).'
