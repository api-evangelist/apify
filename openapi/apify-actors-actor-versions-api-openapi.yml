  description: 'The API endpoints in this section allow you to manage your Apify Actors versions.


    - The version object contains the source code of a specific version of an Actor.

    - The `sourceType` property indicates where the source code is hosted, and based

    on its value the Version object has the following additional property:


    | **Value** | **Description** |

    |---|---|

    | `"SOURCE_FILES"` | Source code is comprised of multiple files specified in the `sourceFiles` array. Each item of the array is an object with the following fields:

    - `name`: File path and name

    - `format`: Format of the content, can be either `"TEXT"` or `"BASE64"`

    - `content`: File content


    Source files can be shown and edited in the Apify Console''s Web IDE. |

    | `"GIT_REPO"` | Source code is cloned from a Git repository, whose URL is specified in the `gitRepoUrl` field. |

    | `"TARBALL"` | Source code is downloaded using a tarball or Zip file from a URL specified in the `tarballUrl` field. |

    |`"GITHUB_GIST"`| Source code is taken from a GitHub Gist, whose URL is specified in the `gitHubGistUrl` field. |


    For more information about source code and Actor versions, check out Source code

    in Actors documentation.'
paths:
  /v2/actors/{actorId}/versions:
    get:
      tags:
      - Actors/Actor versions
      summary: Get list of versions
      description: 'Gets the list of versions of a specific Actor. The response is a JSON object

        with the list of Version objects, where each

        contains basic information about a single version.'
      operationId: actor_versions_get
      parameters:
      - $ref: '#/components/parameters/actorId'
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfVersionsResponse'
              example:
                data:
                  total: 5
                  items:
                  - versionNumber: '0.1'
                    envVars: null
                    sourceType: SOURCE_FILES
                    applyEnvVarsToBuild: false
                    buildTag: latest
                    sourceFiles: []
                  - versionNumber: '0.2'
                    sourceType: GIT_REPO
                    envVars: null
                    applyEnvVarsToBuild: false
                    buildTag: latest
                    gitRepoUrl: https://github.com/jane35/my-actor
                  - versionNumber: '0.3'
                    sourceType: TARBALL
                    envVars: null
                    applyEnvVarsToBuild: false
                    buildTag: latest
                    tarballUrl: https://github.com/jane35/my-actor/archive/master.zip
                  - versionNumber: '0.4'
                    sourceType: GITHUB_GIST
                    envVars: null
                    applyEnvVarsToBuild: false
                    buildTag: latest
                    gitHubGistUrl: https://gist.github.com/jane35/e51feb784yu89
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/actors/version-collection/get-list-of-versions
      - https://docs.apify.com/api/v2#/reference/actors/get-list-of-versions
      - https://docs.apify.com/api/v2#tag/ActorsVersion-collection/operation/act_versions_get
      x-py-parent: ActorVersionCollectionClientAsync
      x-py-name: list
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/ActorVersionCollectionClientAsync#list
    post:
      tags:
      - Actors/Actor versions
      summary: Create version
      description: 'Creates a version of an Actor using values specified in a Version

        object passed as JSON in the POST

        payload.


        The request must specify `versionNumber` and `sourceType` parameters (as

        strings) in the JSON payload and a `Content-Type: application/json` HTTP

        header.


        Each `sourceType` requires its own additional properties to be passed to the

        JSON payload object. These are outlined in the Version

        object table below and in more detail in

        the Apify

        documentation.


        For example, if an Actor''s source code is stored in a GitHub

        repository,

        you will set the `sourceType` to `GIT_REPO` and pass the repository''s URL in

        the `gitRepoUrl` property.


        ```

        {

        "versionNumber": "0.1",

        "sourceType": "GIT_REPO",

        "gitRepoUrl": "https://github.com/my-github-account/actor-repo"

        }

        ```


        The response is the Version object as

        returned by the Get version endpoint.'
      operationId: actor_versions_post
      parameters:
      - $ref: '#/components/parameters/actorId'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVersionRequest'
            example:
              versionNumber: '0.1'
              sourceType: GIT_REPO
              gitRepoUrl: https://github.com/my-github-account/actor-repo
        required: true
      responses:
        '201':
          description: ''
          headers:
            Location:
              content:
                text/plain:
                  schema:
                    type: string
                  example: https://api.apify.com/v2/actors/zdc3Pyhyz3m8vjDeM/versions/0.0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
