tags:
- name: Users/Usage
  x-displayName: Manage usage and limits
  x-parent-tag-name: Users
  description: 'The API endpoints described in this section return your account''s usage for the

    current monthly cycle and let you view and update your account limits.


    For details, see the Limits.'
paths:
  /v2/users/me/usage/monthly:
    get:
      tags:
      - Users/Usage
      summary: Get monthly usage
      description: 'Returns a complete summary of your usage for the current monthly usage cycle,

        an overall sum, as well as a daily breakdown of usage. It is the same

        information you will see on your account''s Billing > Historical usage page. The information

        includes your use of Actors, compute, data transfer, and storage.


        Using the `date` parameter will show your usage in the monthly usage cycle that

        includes that date.'
      operationId: users_me_usage_monthly_get
      parameters:
      - name: date
        in: query
        description: Date in the YYYY-MM-DD format.
        style: form
        explode: true
        schema:
          type: string
          example: '2020-06-14'
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyUsageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/users/monthly-usage/get-monthly-usage
      - https://docs.apify.com/api/v2#/reference/users/get-monthly-usage
      - https://docs.apify.com/api/v2#tag/UsersMonthly-usage/operation/users_me_usage_monthly_get
  /v2/users/me/limits:
    get:
      tags:
      - Users/Usage
      summary: Get limits
      description: 'Returns a complete summary of your account''s limits. It is the same

        information you will see on your account''s Limits page. The returned data

        includes the current usage cycle, a summary of your limits, and your current usage.'
      operationId: users_me_limits_get
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLimitsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/users/account-and-usage-limits/get-limits
      - https://docs.apify.com/api/v2#/reference/users/get-limits
      - https://docs.apify.com/api/v2#tag/UsersAccount-and-usage-limits/operation/users_me_limits_get
    put:
      tags:
      - Users/Usage
      summary: Update limits
      description: 'Updates the account''s limits manageable on your account''s Limits page.

        Specifically the: `maxMonthlyUsageUsd` and `dataRetentionDays` limits (see request body schema for more details).'
      operationId: users_me_limits_put
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLimitsRequest'
      responses:
        '201':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/users/account-and-usage-limits/update-limits
      - https://docs.apify.com/api/v2#/reference/users/update-limits
      - https://docs.apify.com/api/v2#tag/UsersAccount-and-usage-limits/operation/users_me_limits_put
components:
  schemas:
    MonthlyServiceUsage:
      title: MonthlyServiceUsage
      type: object
      additionalProperties:
        $ref: '#/components/schemas/UsageItem'
      description: A map of usage item names (e.g., ACTOR_COMPUTE_UNITS) to their usage details.
    PriceTier:
      title: PriceTier
      required:
      - quantityAbove
      - discountPercent
      - tierQuantity
      - unitPriceUsd
      - priceUsd
      type: object
      properties:
        quantityAbove:
          type: number
          examples:
          - 0
        discountPercent:
          type: number
          examples:
          - 100
        tierQuantity:
          type: number
          examples:
          - 0.39
        unitPriceUsd:
          type: number
          examples:
          - 0
        priceUsd:
          type: number
          examples:
          - 0
    DailyServiceUsage:
      title: DailyServiceUsage
      required:
      - date
      - serviceUsage
      - totalUsageCreditsUsd
      type: object
      properties:
        date:
          type: string
          format: date-time
          examples:
          - '2022-10-02T00:00:00.000Z'
        serviceUsage:
          $ref: '#/components/schemas/ServiceUsage'
        totalUsageCreditsUsd:
          type: number
          examples:
          - 0.0474385791970591
    ErrorResponse:
      title: ErrorResponse
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ServiceUsage:
      title: ServiceUsage
      type: object
      additionalProperties:
        $ref: '#/components/schemas/UsageItem'
      description: A map of service usage item names to their usage details.
      example:
        ACTOR_COMPUTE_UNITS:
          quantity: 60
          baseAmountUsd: 0.00030000000000000003
          baseUnitPriceUsd: 5.0e-06
          amountAfterVolumeDiscountUsd: 0.00030000000000000003
          priceTiers: []
    UsageCycle:
      title: UsageCycle
      required:
      - startAt
      - endAt
      type: object
      properties:
        startAt:
          type: string
          format: date-time
          examples:
          - '2022-10-02T00:00:00.000Z'
        endAt:
          type: string
          format: date-time
          examples:
          - '2022-11-01T23:59:59.999Z'
    Limits:
      title: Limits
      required:
      - maxMonthlyUsageUsd
      - maxMonthlyActorComputeUnits
      - maxMonthlyExternalDataTransferGbytes
      - maxMonthlyProxySerps
      - maxMonthlyResidentialProxyGbytes
      - maxActorMemoryGbytes
      - maxActorCount
      - maxActorTaskCount
      - maxConcurrentActorJobs
      - maxTeamAccountSeatCount
      - dataRetentionDays
      type: object
      properties:
        maxMonthlyUsageUsd:
          type: number
          examples:
          - 300
        maxMonthlyActorComputeUnits:
          type: number
          examples:
          - 1000
        maxMonthlyExternalDataTransferGbytes:
          type: number
          examples:
          - 7
        maxMonthlyProxySerps:
          type: integer
          examples:
          - 50
        maxMonthlyResidentialProxyGbytes:
          type: number
          examples:
          - 0.5
        maxActorMemoryGbytes:
          type: number
          examples:
          - 16
        maxActorCount:
          type: integer
          examples:
          - 100
        maxActorTaskCount:
          type: integer
          examples:
          - 1000
        maxConcurrentActorJobs:
          type: integer
          examples:
          - 256
        maxTeamAccountSeatCount:
          type: integer
          examples:
          - 9
        dataRetentionDays:
          type: integer
          examples:
          - 90
        maxScheduleCount:
          type: integer
          examples:
          - 100
    AccountLimitsResponse:
      title: AccountLimitsResponse
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AccountLimits'
    UpdateLimitsRequest:
      title: UpdateLimitsRequest
      type: object
      properties:
        maxMonthlyUsageUsd:
          type: number
          examples:
          - 300
          description: 'If your platform usage in the billing period exceeds the prepaid usage, you will be charged extra. Setting this property you can update your hard limit on monthly platform usage to prevent accidental overage or to limit the extra charges.

            '
        dataRetentionDays:
          type: integer
          examples:
          - 90
          description: 'Apify securely stores your ten most recent Actor runs indefinitely, ensuring they are always accessible. Unnamed storages and other Actor runs are automatically deleted after the retention period. If you''re subscribed, you can change it to keep data for longer or to limit your usage. [Lear more](https://docs.apify.com/storage#data-retention).

            '
    UsageItem:
      title: UsageItem
      required:
      - quantity
      - baseAmountUsd
      type: object
      properties:
        quantity:
          type: number
          examples:
          - 2.784475
        baseAmountUsd:
          type: number
          examples:
          - 0.69611875
        baseUnitPriceUsd:
          type: number
          examples:
          - 0.25
        amountAfterVolumeDiscountUsd:
          type: number
          examples:
          - 0.69611875
        priceTiers:
          type: array
          items:
            $ref: '#/components/schemas/PriceTier'
          description: ''
    ErrorType:
      title: ErrorType
      type: string
      description: Machine-processable error type identifier.
      enum:
      - 3d-secure-auth-failed
      - access-right-already-exists
      - action-not-found
