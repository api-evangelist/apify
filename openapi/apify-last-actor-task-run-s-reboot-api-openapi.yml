    RunUsageUsd:
      title: RunUsageUsd
      description: Resource usage costs in USD. All values are monetary amounts in US dollars.
      type: object
      properties:
        ACTOR_COMPUTE_UNITS:
          type:
          - number
          - 'null'
          examples:
          - 0.0003
        DATASET_READS:
          type:
          - number
          - 'null'
          examples:
          - 0.0001
        DATASET_WRITES:
          type:
          - number
          - 'null'
          examples:
          - 0.0001
        KEY_VALUE_STORE_READS:
          type:
          - number
          - 'null'
          examples:
          - 0.0001
        KEY_VALUE_STORE_WRITES:
          type:
          - number
          - 'null'
          examples:
          - 5.0e-05
        KEY_VALUE_STORE_LISTS:
          type:
          - number
          - 'null'
          examples:
          - 0.0001
        REQUEST_QUEUE_READS:
          type:
          - number
          - 'null'
          examples:
          - 0.0001
        REQUEST_QUEUE_WRITES:
          type:
          - number
          - 'null'
          examples:
          - 0.0001
        DATA_TRANSFER_INTERNAL_GBYTES:
          type:
          - number
          - 'null'
          examples:
          - 0.001
        DATA_TRANSFER_EXTERNAL_GBYTES:
          type:
          - number
          - 'null'
          examples:
          - 0.003
        PROXY_RESIDENTIAL_TRANSFER_GBYTES:
          type:
          - number
          - 'null'
          examples:
          - 0.034
        PROXY_SERPS:
          type:
          - number
          - 'null'
          examples:
          - 0.003
    ErrorDetail:
      title: ErrorDetail
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ErrorType'
        message:
          type: string
          description: Human-readable error message describing what went wrong.
    RunResponse:
      title: RunResponse
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Run'
    RunMeta:
      title: RunMeta
      required:
      - origin
      type: object
      properties:
        origin:
          $ref: '#/components/schemas/RunOrigin'
        clientIp:
          type:
          - string
          - 'null'
          description: IP address of the client that started the run.
        userAgent:
          type:
          - string
          - 'null'
          description: User agent of the client that started the run.
        scheduleId:
          type:
          - string
          - 'null'
          description: ID of the schedule that triggered the run.
        scheduledAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Time when the run was scheduled.
  parameters:
    status-2:
      name: status
      in: query
      description: Filter for the run status.
      style: form
      explode: true
      schema:
        type: string
        example: SUCCEEDED
    origin:
      name: origin
      in: query
      description: Filter for the run origin, i.e. the means by which the run was started.
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/RunOrigin'
    actorTaskId:
      name: actorTaskId
      in: path
      description: Task ID or a tilde-separated owner's username and task's name.
      required: true
      style: simple
      schema:
        type: string
        example: janedoe~my-task
  responses:
    MethodNotAllowed:
      description: Method not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: method-not-allowed
              message: 'This API end-point can only be accessed using the following HTTP methods: OPTIONS,GET'
    Forbidden:
      description: Forbidden - insufficient permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: insufficient-permissions
              message: You do not have permission to perform this action.
    BadRequest:
      description: Bad request - invalid input parameters or request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: invalid-input
              message: 'Invalid input: The request body contains invalid data.'
    NotFound:
      description: Not found - the requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: record-not-found
              message: The requested resource was not found.
    Unauthorized:
      description: Unauthorized - authentication required or invalid token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: invalid-token
              message: Authentication token is not valid.
    TooManyRequests:
      description: Too many requests - rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: rate-limit-exceeded
              message: You have exceeded the rate limit. Please try again later.
  securitySchemes:
    httpBearer:
      type: http
      scheme: bearer
      description: 'Bearer token provided in the `Authorization` header (e.g., `Authorization: Bearer your_token`—recommended). [More info](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Authorization).


        Use your API token to authenticate requests. You can find it on the [Integrations page](https://console.apify.com/account#/integrations) in Apify Console. This method is more secure than query parameters, as headers are not logged in browser history or server logs.


        :::danger Security


        Do not share your API token (or account password) with untrusted parties.


        :::


        _When is authentication required?_

        - _Required_ for private Actors, tasks, or resources (e.g., builds of private Actors).

        - _Required_ when using named formats for IDs (e.g., `username~store-name` for stores or `username~queue-name` for queues).

        - _Optional_ for public Actors or resources (e.g., builds of public Actors can be queried without a token).


        For more information, see our [integrations documentation](https://docs.apify.com/platform/integrations).'
    apiKey:
      type: apiKey
      name: token
      in: query
      description: 'API token provided as a query parameter (e.g., `?token=your_token`—less secure).


        Use your API token to authenticate requests. You can find it on the [Integrations page](https://console.apify.com/account#/integrations) in Apify Console.


        :::danger Security


        Do not share your API token (or account password) with untrusted parties.


        :::


        _When is authentication required?_

        - _Required_ for private Actors, tasks, or resources (e.g., builds of private Actors).

        - _Required_ when using named formats for IDs (e.g., `username~store-name` for stores or `username~queue-name` for queues).

        - _Optional_ for public Actors or resources (e.g., builds of public Actors can be queried without a token).


        For more information, see our [integrations documentation](https://docs.apify.com/platform/integrations).'
