openapi: 3.2.0
info:
  title: Apify Last Actor task run's reboot API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: 'The Apify API (version 2) provides programmatic access to the Apify

    platform. The API is organized

    around RESTful

    HTTP endpoints. You can download the complete OpenAPI schema of Apify API in the YAML or JSON formats. The source code is also available on GitHub. All requests and responses (including errors) are encoded in

    JSON format with UTF-8 encoding,

    with a few exceptions that are explicitly described in the reference. To access the API, we recommend using one of our API clients:


    Stable API clients:

    - For Node.js, we recommend the `apify-client` NPM

    package. - For Python, we recommend the `apify-client` PyPI

    package. Experimental API clients:

    - For Java, we recommend the `apify-client` Maven central component. - For Rust, we recommend the `apify-client` crate. - For .NET, we recommend the `apify-client` Nuget package. - For PHP, we recommend the `apify-client` Packagist package. - For Go, we recommend the `apify-client` package. The clients'' functions correspond to the API endpoints and have the same

    parameters. This simplifies development of apps that depend on the Apify

    platform. :::note Important Request Details


    - `Content-Type` header: For requests with a JSON body, you must include the `Content-Type: application/json` header. - Method override: You can override the HTTP method using the `method` query parameter. This is useful for clients that can only send `GET` requests. For example, to call a `POST` endpoint, append `?method=POST` to the URL of your `GET` request. :::


    ## Authentication


    **You can find your API token on the

    Integrations page in the

    Apify Console.**


    To use your token in a request, either:


    - Add the token to your request''s `Authorization` header as `Bearer `. E.g., `Authorization: Bearer xxxxxxx`. More info. (Recommended). - Add it as the `token` parameter to your request URL. (Less secure). Using your token in the request header is more secure than using it as a URL

    parameter because URLs are often stored

    in browser history and server logs. This creates a chance for someone

    unauthorized to access your API token. **Never share your API token or password with untrusted parties!**


    For more information, see our

    integrations documentation. ### Agentic payments


    AI agents can authenticate and pay for Actor runs without an Apify account

    using agentic payments. Instead of an API token, the request carries a

    payment credential that both authorizes and pays for the call. Apify supports

    the x402 protocol

    (`PAYMENT-SIGNATURE` header) and

    Skyfire

    (`skyfire-pay-id` header). ## Basic usage


    To run an Actor, send a POST request to the Run

    Actor endpoint using either the

    Actor ID code (e.g. `vKg4IjxZbEYTYeW8T`) or its name (e.g. `janedoe~my-actor`):


    `https://api.apify.com/v2/actors/[actor_id]/runs`


    If the Actor is not runnable anonymously, you will receive a 401 or 403

    response code. This means you need to add your secret API

    token to the request''s

    `Authorization` header (recommended) or as a

    URL query parameter `?token=[your_token]` (less secure). Optionally, you can include the query parameters described in the Run

    Actor section to customize your

    run. If you''re using Node.js, the best way to run an Actor is using the

    `Apify.call()` method from the Apify

    SDK. It

    runs the Actor using the account you are currently logged into (determined

    by the secret API token). The result is an Actor run

    object and its output (if

    any). A typical workflow is as follows:


    1. Run an Actor or task using the Run

    Actor or Run

    task API endpoints. 2. Monitor the Actor run by periodically polling its progress using the Get

    run API

    endpoint. 3. Fetch the results from the Get

    items API endpoint using the

    `defaultDatasetId`, which you receive in the Run request response. Additional data may be stored in a key-value store. You can fetch them from

    the Get record API endpoint

    using the `defaultKeyValueStoreId` and the store''s `key`. **Note**: Instead of periodic polling, you can also run your

    Actor or

    task

    synchronously.'
  contact: {}
  version: v2-2026-10-08T073338Z
servers:
- url: https://api.apify.com
  variables: {}
security:
- httpBearer: []
- apiKey: []
tags:
- name: Last Actor task run's reboot
  x-displayName: Last Actor task run's reboot
  description: 'The API endpoint described in this section is a convenience endpoint that reboots the Actor task''s last run.


    Same as of functionality described in: Reboot run'
paths:
  /v2/actor-tasks/{actorTaskId}/runs/last/reboot:
    post:
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Last Actor task run's reboot
      summary: Reboot Actor task's last run
      description: 'Reboots the last run of the specified Actor task and returns an object that

        contains all the details about the rebooted run.


        This endpoint is a shortcut for Reboot run

        on the Actor task''s last run. Only runs with status `RUNNING` can be rebooted. The run''s

        container will be restarted, so any data not persisted in the key-value store, dataset,

        or request queue will be lost.'
      operationId: actorTask_runs_last_reboot_post
      parameters:
      - $ref: '#/components/parameters/actorTaskId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
components:
  schemas:
    TieredPricingPerEvent:
      title: TieredPricingPerEvent
      description: 'Tiered price-per-event pricing for a single charge event, keyed by subscription tier (e.g. `FREE`, `BRONZE`,

        `SILVER`, `GOLD`, `PLATINUM`, `DIAMOND`). The actual price applied is resolved from the user''s tier.

        '
      type: object
      additionalProperties:
        $ref: '#/components/schemas/TieredPricingPerEventEntry'
    TieredPricingPerEventEntry:
      title: TieredPricingPerEventEntry
      description: A single tier's price-per-event entry.
      type: object
      required:
      - tieredEventPriceUsd
      properties:
        tieredEventPriceUsd:
          type: number
          description: Price per event in USD for this tier.
    RunMetamorphEvent:
      title: RunMetamorphEvent
      description: Information about a metamorph event that occurred during the run.
      type: object
      required:
      - createdAt
      - actorId
      - buildId
      properties:
        createdAt:
          type: string
          format: date-time
          description: Time when the metamorph occurred.
          examples:
          - '2019-11-30T07:39:24.202Z'
        actorId:
          type: string
          description: ID of the Actor that the run was metamorphed to.
          examples:
          - nspoEjklmnsF2oosD
        buildId:
          type: string
          description: ID of the build used for the metamorphed Actor.
          examples:
          - ME6oKecqy5kXDS4KQ
        inputKey:
          type:
          - string
          - 'null'
          description: Key of the input record in the key-value store.
          examples:
          - INPUT-METAMORPH-1
    ErrorResponse:
      title: ErrorResponse
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    PricePerDatasetItemActorPricingInfo:
      title: PricePerDatasetItemActorPricingInfo
      allOf:
      - $ref: '#/components/schemas/CommonActorPricingInfo'
      - type: object
        required:
        - pricingModel
        - unitName
        properties:
          pricingModel:
            type: string
            const: PRICE_PER_DATASET_ITEM
          unitName:
            type: string
            description: Name of the unit that is being charged
          pricePerUnitUsd:
            type: number
            description: 'Price per unit in USD. Mutually exclusive with `tieredPricing` - exactly one of the two is present

              on a pricing record.

              '
          tieredPricing:
            $ref: '#/components/schemas/TieredPricingPerDatasetItem'
    RunOrigin:
      title: RunOrigin
      type: string
      enum:
      - DEVELOPMENT
      - WEB
      - API
      - SCHEDULER
      - TEST
      - WEBHOOK
      - ACTOR
      - CLI
      - CI
      - STANDBY
      - MCP
    ActorChargeEvent:
      title: ActorChargeEvent
      description: 'Definition of a single chargeable event for a pay-per-event Actor. Each event is either flat-priced

        (`eventPriceUsd` is set) or tier-priced (`eventTieredPricingUsd` is set); the two are mutually exclusive.

        '
      type: object
      required:
      - eventTitle
      - eventDescription
      properties:
        eventTitle:
          type: string
          description: Human-readable title shown to users in the billing UI.
        eventDescription:
          type: string
          description: Human-readable description of what triggers this event.
        eventPriceUsd:
          type: number
          description: 'Flat price per event in USD. Present only for non-tiered events. Mutually exclusive with `eventTieredPricingUsd`.

            '
        eventTieredPricingUsd:
          $ref: '#/components/schemas/TieredPricingPerEvent'
        isPrimaryEvent:
          type: boolean
          description: Whether this event is the Actor's primary chargeable event.
        isOneTimeEvent:
          type: boolean
          description: Whether this event can only be charged once per Actor run.
    TieredPricingPerDatasetItem:
      title: TieredPricingPerDatasetItem
      description: 'Tiered price-per-dataset-item pricing, keyed by subscription tier (e.g. `FREE`, `BRONZE`, `SILVER`, `GOLD`,

        `PLATINUM`, `DIAMOND`). The actual price applied to a run is resolved from the user''s tier.

        '
      type: object
      additionalProperties:
        $ref: '#/components/schemas/TieredPricingPerDatasetItemEntry'
    ActorRunPricingInfo:
      title: ActorRunPricingInfo
      discriminator:
        propertyName: pricingModel
        mapping:
          PAY_PER_EVENT: '#/components/schemas/PayPerEventActorPricingInfo'
          PRICE_PER_DATASET_ITEM: '#/components/schemas/PricePerDatasetItemActorPricingInfo'
          FLAT_PRICE_PER_MONTH: '#/components/schemas/FlatPricePerMonthActorPricingInfo'
          FREE: '#/components/schemas/FreeActorPricingInfo'
      oneOf:
      - $ref: '#/components/schemas/PayPerEventActorPricingInfo'
      - $ref: '#/components/schemas/PricePerDatasetItemActorPricingInfo'
      - $ref: '#/components/schemas/FlatPricePerMonthActorPricingInfo'
      - $ref: '#/components/schemas/FreeActorPricingInfo'
    FreeActorPricingInfo:
      title: FreeActorPricingInfo
      allOf:
      - $ref: '#/components/schemas/CommonActorPricingInfo'
      - type: object
        required:
        - pricingModel
        properties:
          pricingModel:
            type: string
            const: FREE
    Run:
      title: Run
      description: Represents an Actor run and its associated data.
      required:
      - id
      - actId
      - userId
      - startedAt
      - status
      - meta
      - stats
      - options
      - buildId
      - defaultKeyValueStoreId
      - defaultDatasetId
      - defaultRequestQueueId
      type: object
      properties:
        id:
          type: string
          examples:
          - HG7ML7M8z78YcAPEB
          description: Unique identifier of the Actor run.
        actId:
          type: string
          examples:
          - HDSasDasz78YcAPEB
          description: ID of the Actor that was run.
        userId:
          type: string
          examples:
          - 7sT5jcggjjA9fNcxF
          description: ID of the user who started the run.
        actorTaskId:
          type:
          - string
          - 'null'
          examples:
          - KJHSKHausidyaJKHs
          description: ID of the Actor task, if the run was started from a task.
        startedAt:
          type: string
          format: date-time
          examples:
          - '2019-11-30T07:34:24.202Z'
          description: Time when the Actor run started.
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
          examples:
          - '2019-12-12T09:30:12.202Z'
          description: Time when the Actor run finished.
        status:
          description: Current status of the Actor run.
          $ref: '#/components/schemas/ActorJobStatus'
        statusMessage:
          type:
          - string
          - 'null'
          examples:
          - Actor is running
          description: Detailed message about the run status.
        isStatusMessageTerminal:
          type:
          - boolean
          - 'null'
          examples:
          - false
          description: Whether the status message is terminal (final).
        meta:
          description: Metadata about the Actor run.
          $ref: '#/components/schemas/RunMeta'
        pricingInfo:
          description: Pricing information for the Actor.
          $ref: '#/components/schemas/ActorRunPricingInfo'
        stats:
          description: Statistics of the Actor run.
          $ref: '#/components/schemas/RunStats'
        chargedEventCounts:
          description: A map of charged event types to their counts. The keys are event type identifiers defined by the Actor's pricing model (pay-per-event), and the values are the number of times each event was charged during this run.
          type: object
          additionalProperties:
            type: integer
          example:
            actor-start: 1
            page-crawled: 150
            data-extracted: 75
        options:
          description: Configuration options for the Actor run.
          $ref: '#/components/schemas/RunOptions'
        buildId:
          type: string
          examples:
          - 7sT5jcggjjA9fNcxF
          description: ID of the Actor build used for this run.
        exitCode:
          type:
          - integer
          - 'null'
          examples:
          - 0
          description: Exit code of the Actor run process.
        generalAccess:
          description: General access level for the Actor run.
          anyOf:
          - $ref: '#/components/schemas/GeneralAccess'
          - type: 'null'
        defaultKeyValueStoreId:
          type: string
          examples:
          - eJNzqsbPiopwJcgGQ
          description: ID of the default key-value store for this run.
        defaultDatasetId:
          type: string
          examples:
          - wmKPijuyDnPZAPRMk
          description: ID of the default dataset for this run.
        defaultRequestQueueId:
          type: string
          examples:
          - FL35cSF7jrxr3BY39
          description: ID of the default request queue for this run.
        storageIds:
          type: object
          description: A map of aliased storage IDs associated with this run, grouped by storage type.
          properties:
            datasets:
              type: object
              description: Aliased dataset IDs for this run.
              properties:
                default:
                  type: string
                  description: ID of the default dataset for this run.
                  example: wmKPijuyDnPZAPRMk
              additionalProperties:
                type: string
            keyValueStores:
              type: object
              description: Aliased key-value store IDs for this run.
              properties:
                default:
                  type: string
                  description: ID of the default key-value store for this run.
                  example: eJNzqsbPiopwJcgGQ
              additionalProperties:
                type: string
            requestQueues:
              type: object
              description: Aliased request queue IDs for this run.
              properties:
                default:
                  type: string
                  description: ID of the default request queue for this run.
                  example: FL35cSF7jrxr3BY39
              additionalProperties:
                type: string
        buildNumber:
          type:
          - string
          - 'null'
          pattern: ^([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])(\.[1-9][0-9]{0,4})$
          examples:
          - 0.0.36
          description: Build number of the Actor build used for this run.
        containerUrl:
          type: string
          format: uri
          examples:
          - https://g8kd8kbc5ge8.runs.apify.net
          description: URL of the container running the Actor.
        isContainerServerReady:
          type:
          - boolean
          - 'null'
          examples:
          - true
          description: Whether the container's HTTP server is ready to accept requests.
        gitBranchName:
          type:
          - string
          - 'null'
          examples:
          - master
          description: Name of the git branch used for the Actor build.
        usage:
          description: Resource usage statistics for the run.
          anyOf:
          - $ref: '#/components/schemas/RunUsage'
          - type: 'null'
        usageTotalUsd:
          type:
          - number
          - 'null'
          examples:
          - 0.2654
          description: 'Total cost in USD for this run. Represents what you actually pay. For run owners: includes platform usage (compute units) and/or event costs depending on the Actor''s pricing model. For run non-owners: only available for Pay-Per-Event Actors (event costs only). Requires authentication token to access.'
        usageUsd:
          description: Platform usage costs breakdown in USD. Only present if you own the run AND are paying for platform usage (Pay-Per-Usage, Rental, or Pay-Per-Event with usage costs like standby Actors). Not available for standard Pay-Per-Event Actors. Requires authentication token to access.
          anyOf:
          - $ref: '#/components/schemas/RunUsageUsd'
          - type: 'null'
        metamorphs:
          description: List of metamorph events that occurred during the run.
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/RunMetamorphEvent'
          - type: 'null'
        platformUsageBillingModel:
          type: string
          description: Indicates which party covers platform usage costs for this run.
          examples:
          - USER
    RunOptions:
      title: RunOptions
      required:
      - build
      - timeoutSecs
      - memoryMbytes
      - diskMbytes
      type: object
      properties:
        build:
          type: string
          examples:
          - latest
        timeoutSecs:
          type: integer
          minimum: 0
          examples:
          - 300
        memoryMbytes:
          type: integer
          minimum: 128
          maximum: 32768
          examples:
          - 1024
        diskMbytes:
          type: integer
          minimum: 0
          examples:
          - 2048
        maxItems:
          type:
          - integer
          - 'null'
          minimum: 0
          examples:
          - 1000
        maxTotalChargeUsd:
          type:
          - number
          - 'null'
          minimum: 0
          examples:
          - 5
    TieredPricingPerDatasetItemEntry:
      title: TieredPricingPerDatasetItemEntry
      description: A single tier's price-per-dataset-item entry.
      type: object
      required:
      - tieredPricePerUnitUsd
      properties:
        tieredPricePerUnitUsd:
          type: number
          description: Price per unit in USD for this tier.
    FlatPricePerMonthActorPricingInfo:
      title: FlatPricePerMonthActorPricingInfo
      allOf:
      - $ref: '#/components/schemas/CommonActorPricingInfo'
      - type: object
        required:
        - pricingModel
        - pricePerUnitUsd
        - trialMinutes
        properties:
          pricingModel:
            type: string
            const: FLAT_PRICE_PER_MONTH
          trialMinutes:
            type: integer
            description: For how long this Actor can be used for free in trial period
          pricePerUnitUsd:
            type: number
            description: Monthly flat price in USD
    PayPerEventActorPricingInfo:
      title: PayPerEventActorPricingInfo
      allOf:
      - $ref: '#/components/schemas/CommonActorPricingInfo'
      - type: object
        required:
        - pricingModel
        - pricingPerEvent
        properties:
          pricingModel:
            type: string
            const: PAY_PER_EVENT
          pricingPerEvent:
            type: object
            properties:
              actorChargeEvents:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/ActorChargeEvent'
          minimalMaxTotalChargeUsd:
            type:
            - number
            - 'null'
    RunUsage:
      title: RunUsage
      type: object
      properties:
        ACTOR_COMPUTE_UNITS:
          type:
          - number
          - 'null'
          examples:
          - 3
        DATASET_READS:
          type:
          - integer
          - 'null'
          examples:
          - 4
        DATASET_WRITES:
          type:
          - integer
          - 'null'
          examples:
          - 4
        KEY_VALUE_STORE_READS:
          type:
          - integer
          - 'null'
          examples:
          - 5
        KEY_VALUE_STORE_WRITES:
          type:
          - integer
          - 'null'
          examples:
          - 3
        KEY_VALUE_STORE_LISTS:
          type:
          - integer
          - 'null'
          examples:
          - 5
        REQUEST_QUEUE_READS:
          type:
          - integer
          - 'null'
          examples:
          - 2
        REQUEST_QUEUE_WRITES:
          type:
          - integer
          - 'null'
          examples:
          - 1
        DATA_TRANSFER_INTERNAL_GBYTES:
          type:
          - number
          - 'null'
          examples:
          - 1
        DATA_TRANSFER_EXTERNAL_GBYTES:
          type:
          - number
          - 'null'
          examples:
          - 3
        PROXY_RESIDENTIAL_TRANSFER_GBYTES:
          type:
          - number
          - 'null'
          examples:
          - 34
        PROXY_SERPS:
          type:
          - integer
          - 'null'
          examples:
          - 3
    ActorJobStatus:
      title: ActorJobStatus
      type: string
      enum:
      - READY
      - RUNNING
      - SUCCEEDED
      - FAILED
      - TIMING-OUT
      - TIMED-OUT
      - ABORTING
      - ABORTED
      description: Status of an Actor job (run or build).
    GeneralAccess:
      title: GeneralAccess
      type: string
      enum:
      - ANYONE_WITH_ID_CAN_READ
      - ANYONE_WITH_NAME_CAN_READ
      - FOLLOW_USER_SETTING
      - RESTRICTED
      examples:
      - RESTRICTED
      description: Defines the general access level for the resource.
    CommonActorPricingInfo:
      title: CommonActorPricingInfo
      type: object
      required:
      - apifyMarginPercentage
      - createdAt
      - startedAt
      properties:
        apifyMarginPercentage:
          type: number
          examples:
          - 0.2
          description: 'Apify''s share of the revenue generated under this pricing info record, as a fraction between 0 and 1. Set by the Apify platform.

            '
        createdAt:
          type: string
          format: date-time
          description: When this pricing info record has been created
        startedAt:
          type: string
          format: date-time
          description: Since when is this pricing info record effective for a given Actor
        notifiedAboutFutureChangeAt:
          type:
          - string
          - 'null'
          format: date-time
          x-internal: true
        notifiedAboutChangeAt:
          type:
          - string
          - 'null'
          format: date-time
          x-internal: true
        reasonForChange:
          type:
          - string
          - 'null'
          x-internal: true
        isPriceChangeNotificationSuppressed:
          type: boolean
          x-internal: true
        forceContainsSignificantPriceChange:
          type: boolean
          x-internal: true
    RunStats:
      title: RunStats
      type: object
      properties:
        inputBodyLen:
          type:
          - integer
          - 'null'
          minimum: 0
          examples:
          - 240
        migrationCount:
          type: integer
          minimum: 0
          examples:
          - 0
        rebootCount:
          type: integer
          minimum: 0
          examples:
          - 0
        restartCount:
          type: integer
          minimum: 0
          examples:
          - 0
        resurrectCount:
          type: integer
          minimum: 0
          examples:
          - 2
        memAvgBytes:
          type: number
          examples:
          - 267874071.9
        memMaxBytes:
          type: integer
          minimum: 0
          examples:
          - 404713472
        memCurrentBytes:
          type: integer
          minimum: 0
          examples:
          - 0
        cpuAvgUsage:
          type: number
          examples:
          - 33.7532101107538
        cpuMaxUsage:
          type: number
          examples:
          - 169.650735534941
        cpuCurrentUsage:
          type: number
          examples:
          - 0
        netRxBytes:
          type: integer
          minimum: 0
          examples:
          - 103508042
        netTxBytes:
          type: integer
          minimum: 0
          examples:
          - 4854600
        durationMillis:
          type: integer
          minimum: 0
          examples:
          - 248472
        runTimeSecs:
          type: number
          minimum: 0
          examples:
          - 248.472
        metamorph:
          type: integer
          minimum: 0
          examples:
          - 0
        computeUnits:
          type: number
          minimum: 0
          examples:
          - 0.13804
    ErrorType:
      title: ErrorType
      type: string
      description: Machine-processable error type identifier.
      enum:
      - 3d-secure-auth-failed
      - access-right-already-exists
      - action-not-found
      - actor-already-rented
      - actor-can-not-be-rented
      - actor-disabled
      - actor-is-not-rented
      - actor-memory-limit-exceeded
      - actor-name-exists-new-owner
      - actor-name-not-unique
      - actor-not-found
      - actor-not-github-actor
      - actor-not-public
      - actor-permission-level-not-supported-for-agentic-payments
      - actor-review-already-exists
      - actor-run-failed
      - actor-standby-not-supported-for-agentic-payments
      - actor-task-name-not-unique
      - agentic-payment-info-retrieval-error
