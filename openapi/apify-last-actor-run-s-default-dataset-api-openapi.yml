openapi: 3.2.0
info:
  title: Apify Last Actor run's default dataset API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: 'The Apify API (version 2) provides programmatic access to the Apify

    platform. The API is organized

    around RESTful

    HTTP endpoints. You can download the complete OpenAPI schema of Apify API in the YAML or JSON formats. The source code is also available on GitHub. All requests and responses (including errors) are encoded in

    JSON format with UTF-8 encoding,

    with a few exceptions that are explicitly described in the reference. To access the API, we recommend using one of our API clients:


    Stable API clients:

    - For Node.js, we recommend the `apify-client` NPM

    package. - For Python, we recommend the `apify-client` PyPI

    package. Experimental API clients:

    - For Java, we recommend the `apify-client` Maven central component. - For Rust, we recommend the `apify-client` crate. - For .NET, we recommend the `apify-client` Nuget package. - For PHP, we recommend the `apify-client` Packagist package. - For Go, we recommend the `apify-client` package. The clients'' functions correspond to the API endpoints and have the same

    parameters. This simplifies development of apps that depend on the Apify

    platform. :::note Important Request Details


    - `Content-Type` header: For requests with a JSON body, you must include the `Content-Type: application/json` header. - Method override: You can override the HTTP method using the `method` query parameter. This is useful for clients that can only send `GET` requests. For example, to call a `POST` endpoint, append `?method=POST` to the URL of your `GET` request. :::


    ## Authentication


    **You can find your API token on the

    Integrations page in the

    Apify Console.**


    To use your token in a request, either:


    - Add the token to your request''s `Authorization` header as `Bearer `. E.g., `Authorization: Bearer xxxxxxx`. More info. (Recommended). - Add it as the `token` parameter to your request URL. (Less secure). Using your token in the request header is more secure than using it as a URL

    parameter because URLs are often stored

    in browser history and server logs. This creates a chance for someone

    unauthorized to access your API token. **Never share your API token or password with untrusted parties!**


    For more information, see our

    integrations documentation. ### Agentic payments


    AI agents can authenticate and pay for Actor runs without an Apify account

    using agentic payments. Instead of an API token, the request carries a

    payment credential that both authorizes and pays for the call. Apify supports

    the x402 protocol

    (`PAYMENT-SIGNATURE` header) and

    Skyfire

    (`skyfire-pay-id` header). ## Basic usage


    To run an Actor, send a POST request to the Run

    Actor endpoint using either the

    Actor ID code (e.g. `vKg4IjxZbEYTYeW8T`) or its name (e.g. `janedoe~my-actor`):


    `https://api.apify.com/v2/actors/[actor_id]/runs`


    If the Actor is not runnable anonymously, you will receive a 401 or 403

    response code. This means you need to add your secret API

    token to the request''s

    `Authorization` header (recommended) or as a

    URL query parameter `?token=[your_token]` (less secure). Optionally, you can include the query parameters described in the Run

    Actor section to customize your

    run. If you''re using Node.js, the best way to run an Actor is using the

    `Apify.call()` method from the Apify

    SDK. It

    runs the Actor using the account you are currently logged into (determined

    by the secret API token). The result is an Actor run

    object and its output (if

    any). A typical workflow is as follows:


    1. Run an Actor or task using the Run

    Actor or Run

    task API endpoints. 2. Monitor the Actor run by periodically polling its progress using the Get

    run API

    endpoint. 3. Fetch the results from the Get

    items API endpoint using the

    `defaultDatasetId`, which you receive in the Run request response. Additional data may be stored in a key-value store. You can fetch them from

    the Get record API endpoint

    using the `defaultKeyValueStoreId` and the store''s `key`. **Note**: Instead of periodic polling, you can also run your

    Actor or

    task

    synchronously.'
  contact: {}
  version: v2-2026-10-08T073338Z
servers:
- url: https://api.apify.com
  variables: {}
security:
- httpBearer: []
- apiKey: []
tags:
- name: Last Actor run's default dataset
  x-displayName: Last Actor run's default dataset
  description: 'The API endpoints described in this section are convenience endpoints that provide access to Actor''s last run''s default dataset without the need to resolve the dataset ID first.


    Subset of functionality described in: Datasets'
paths:
  /v2/actors/{actorId}/runs/last/dataset:
    get:
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Last Actor run's default dataset
      parameters:
      - $ref: '#/components/parameters/actorId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
      summary: Get last run's default dataset
      description: 'Returns the default dataset associated with the last Actor run.


        This endpoint is a shortcut for getting the last run''s `defaultDatasetId` and then using the

        Get dataset endpoint.'
      operationId: actor_runs_last_dataset_get
    put:
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatasetRequest'
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Last Actor run's default dataset
      parameters:
      - $ref: '#/components/parameters/actorId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
      summary: Update last run's default dataset
      description: 'Updates the default dataset associated with the last Actor run.


        This endpoint is a shortcut for getting the last run''s `defaultDatasetId` and then using the

        Update dataset endpoint.'
      operationId: actor_runs_last_dataset_put
    delete:
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Last Actor run's default dataset
      parameters:
      - $ref: '#/components/parameters/actorId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
      summary: Delete last run's default dataset
      description: 'Deletes the default dataset associated with the last Actor run.


        This endpoint is a shortcut for getting the last run''s `defaultDatasetId` and then using the

        Delete dataset endpoint.'
      operationId: actor_runs_last_dataset_delete
  /v2/actors/{actorId}/runs/last/dataset/items:
    get:
      responses:
        '200':
          description: ''
          headers:
            X-Apify-Pagination-Offset:
              description: The offset of the first item in the current page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '0'
            X-Apify-Pagination-Limit:
              description: The maximum number of items returned per page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '100'
            X-Apify-Pagination-Count:
              description: The number of items returned in the current page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '100'
            X-Apify-Pagination-Total:
              description: The total number of items available.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '10204'
            X-Apify-Pagination-Desc:
              description: Whether the items are sorted in descending order.
              content:
                text/plain:
                  schema:
                    type: string
                  example: 'false'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                example:
                - foo: bar
                - foo2: bar2
            application/jsonl:
              schema:
                type: string
              example: '{"foo":"bar"}\n{"foo2":"bar2"}\n'
            text/csv:
              schema:
                type: string
              example: foo,bar\nfoo2,bar2\n
            text/html:
              schema:
                type: string
              example: <table><tr><th>foo</th><th>bar</th></tr><tr><td>foo</td><td>bar</td></tr><tr><td>foo2</td><td>bar2</td></tr></table>
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
            application/rss+xml:
              schema:
                type: string
              example: <rss><channel><item><foo>bar</foo></item><item><foo2>bar2</foo2></item></channel></rss>
            application/xml:
              schema:
                type: string
              example: <items><item><foo>bar</foo></item><item><foo2>bar2</foo2></item></items>
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Last Actor run's default dataset
      summary: Get last run's dataset items
      description: 'Returns data stored in the default dataset of the last Actor run in the desired format.


        This endpoint is a shortcut that resolves the last run''s `defaultDatasetId` and proxies to the

        Get dataset items endpoint.'
      operationId: actor_runs_last_dataset_items_get
      parameters:
      - $ref: '#/components/parameters/actorId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/clean'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit-2'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/outputFields'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/unwind'
      - $ref: '#/components/parameters/flatten'
      - $ref: '#/components/parameters/descDataset'
      - $ref: '#/components/parameters/attachment'
      - $ref: '#/components/parameters/delimiter'
      - $ref: '#/components/parameters/bom'
      - $ref: '#/components/parameters/xmlRoot'
      - $ref: '#/components/parameters/xmlRow'
      - $ref: '#/components/parameters/skipHeaderRow'
      - $ref: '#/components/parameters/skipHidden'
      - $ref: '#/components/parameters/skipEmpty'
      - $ref: '#/components/parameters/simplified'
      - $ref: '#/components/parameters/view'
      - $ref: '#/components/parameters/skipFailedPages'
      - $ref: '#/components/parameters/feedTitle'
      - $ref: '#/components/parameters/feedDescription'
      - $ref: '#/components/parameters/signature'
    post:
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/PutItemsRequest'
              - type: array
                items:
                  $ref: '#/components/schemas/PutItemsRequest'
              description: ''
        required: true
      responses:
        '201':
          description: ''
          headers:
            Location:
              content:
                text/plain:
                  schema:
                    type: string
                  example: https://api.apify.com/v2/datasets/WkzbQMuFYuamGv3YF/items
          content:
            application/json:
              schema:
                type: object
                example: {}
        '400':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PutItemsErrorResponse'
                - $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Last Actor run's default dataset
      summary: Store items in last run's dataset
      description: 'Appends an item or an array of items to the end of the last Actor run''s default dataset.


        This endpoint is a shortcut that resolves the last run''s `defaultDatasetId` and proxies to the

        Store items endpoint.


        To save bandwidth and speed up your upload, you can send the request payload compressed and set the `Content-Encoding` header accordingly.


        Below is a list of supported `Content-Encoding` types.


        * Brotli: `Content-Encoding: br`

        * Gzip: `Content-Encoding: gzip`

        * Deflate: `Content-Encoding: deflate`'
      operationId: actor_runs_last_dataset_items_post
      parameters:
      - $ref: '#/components/parameters/actorId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
      - $ref: '#/components/parameters/Content-Encoding'
  /v2/actors/{actorId}/runs/last/dataset/statistics:
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetStatisticsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - Last Actor run's default dataset
      summary: Get last run's dataset statistics
      description: 'Returns statistics for the last Actor run''s default dataset.


        This endpoint is a shortcut that resolves the last run''s `defaultDatasetId` and proxies to the

        Get dataset statistics endpoint.'
      operationId: actor_runs_last_dataset_statistics_get
      parameters:
      - $ref: '#/components/parameters/actorId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
components:
  parameters:
    actorId:
      name: actorId
      in: path
      description: Actor ID or the username of the Actor owner and the Actor name, separated by a tilde (`~`).
      required: true
      style: simple
      schema:
        type: string
        example: compass~google-maps-extractor
    status-2:
      name: status
      in: query
      description: Filter for the run status.
      style: form
      explode: true
      schema:
        type: string
        example: SUCCEEDED
    bom:
      name: bom
      in: query
      description: 'All text responses are encoded in UTF-8 encoding. By default, the

        `format=csv` files are prefixed with the UTF-8 Byte Order Mark (BOM), while `json`, `jsonl`, `xml`, `html` and `rss` files are not.


        If you want to override this default behavior, specify `bom=1` query parameter to include the BOM or `bom=0` to skip it.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: false
    xmlRow:
      name: xmlRow
      in: query
      description: 'Overrides default element name that wraps each page or page function result object in `xml` output. By default the element name is `item`.

        '
      style: form
      explode: true
      schema:
        type: string
        example: item
    origin:
      name: origin
      in: query
      description: Filter for the run origin, i.e. the means by which the run was started.
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/RunOrigin'
    attachment:
      name: attachment
      in: query
      description: 'If `true` or `1` then the response will define the `Content-Disposition:

        attachment` header, forcing a web browser to download the file rather

        than to display it. By default this header is not present.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: true
    skipHeaderRow:
      name: skipHeaderRow
      in: query
      description: If `true` or `1` then header row in the `csv` format is skipped.
      style: form
      explode: true
      schema:
        type: boolean
        example: true
    skipEmpty:
      name: skipEmpty
      in: query
      description: 'If `true` or `1` then empty items are skipped from the output.


        Note that if used, the results might contain less items than the limit value.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: false
    format:
      name: format
      in: query
      description: 'Format of the results, possible values are: `json`, `jsonl`, `csv`, `html`, `xlsx`, `xml` and `rss`. The default value is `json`.

        '
      style: form
      explode: true
      schema:
        type: string
        example: json
    omit:
      name: omit
      in: query
      description: A comma-separated list of fields which should be omitted from the items.
      style: form
      explode: true
      schema:
        type: string
        example: myValue,myOtherValue
    clean:
      name: clean
      in: query
      description: 'If `true` or `1` then the API endpoint returns only non-empty items and skips hidden fields (i.e. fields starting with the # character).

        The `clean` parameter is just a shortcut for `skipHidden=true` and `skipEmpty=true` parameters.

        Note that since some objects might be skipped from the output, that the result might contain less items than the `limit` value.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: false
    view:
      name: view
      in: query
      description: 'Defines the view configuration for dataset items based on the schema definition.

        This parameter determines how the data will be filtered and presented.

        For complete specification details, see the [dataset schema documentation](/storage/dataset-schema).

        '
      schema:
        type: string
        example: overview
    feedTitle:
      name: feedTitle
      in: query
      description: 'Overrides the auto-generated RSS channel `<title>` element.

        Only used when `format=rss`. If not provided, the title defaults to `Dataset <label>`.

        '
      style: form
      explode: true
      schema:
        type: string
        example: Latest posts from r/pasta
    skipHidden:
      name: skipHidden
      in: query
      description: 'If `true` or `1` then hidden fields are skipped from the output, i.e. fields starting with the `#` character.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: false
    outputFields:
      name: outputFields
      in: query
      description: 'A comma-separated list of output field names that positionally rename the fields specified in the `fields` parameter.

        For example, `?fields=headline,url&outputFields=title,link` renames `headline` to `title` and `url` to `link` in the output.

        The number of names in `outputFields` must match the number of names in `fields`.

        Requires the `fields` parameter to be specified as well.

        '
      style: form
      explode: true
      schema:
        type: string
        example: title,link
    fields:
      name: fields
      in: query
      description: 'A comma-separated list of fields which should be picked from the items, only these fields will remain in the resulting record objects.

        Note that the fields in the outputted items are sorted the same way as they are specified in the `fields` query parameter.

        You can use this feature to effectively fix the output format.

        '
      style: form
      explode: true
      schema:
        type: string
        example: myValue,myOtherValue
    descDataset:
      name: desc
      in: query
      description: 'By default, results are returned in the same order as they were stored.

        To reverse the order, set this parameter to `true` or `1`.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: true
    xmlRoot:
      name: xmlRoot
      in: query
      description: 'Overrides default root element name of `xml` output. By default the root element is `items`.

        '
      style: form
      explode: true
      schema:
        type: string
        example: items
    flatten:
      name: flatten
      in: query
      description: 'A comma-separated list of fields which should transform nested objects into flat structures.


        For example, with `flatten="foo"` the object `{"foo":{"bar": "hello"}}` is turned into `{"foo.bar": "hello"}`.


        The original object with properties is replaced with the flattened object.

        '
      style: form
      explode: true
      schema:
        type: string
        example: myValue
    offset:
      name: offset
      in: query
      description: 'Number of items that should be skipped at the start. The default value is `0`.

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 0
    skipFailedPages:
      name: skipFailedPages
      in: query
      description: 'If `true` or `1` then, the all the items with errorInfo property will be skipped from the output.


        This feature is here to emulate functionality of API version 1 used for the legacy Apify Crawler product and it''s not recommended to use it in new integrations.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: false
    simplified:
      name: simplified
      in: query
      description: 'If `true` or `1` then, the endpoint applies the `fields=url,pageFunctionResult,errorInfo`

        and `unwind=pageFunctionResult` query parameters. This feature is used to emulate simplified results provided by the

        legacy Apify Crawler product and it''s not recommended to use it in new integrations.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: false
    signature:
      name: signature
      in: query
      description: Signature used for the access.
      required: false
      style: form
      schema:
        type: string
        example: 2wTI46Bg8qWQrV7tavlPI
    unwind:
      name: unwind
      in: query
      description: 'A comma-separated list of fields which should be unwound, in order which they should be processed. Each field should be either an array or an object.

        If the field is an array then every element of the array will become a separate record and merged with parent object.

        If the unwound field is an object then it is merged with the parent object.

        If the unwound field is missing or its value is neither an array nor an object and therefore cannot be merged with a parent object then the item gets preserved as it is.

        Note that the unwound items ignore the `desc` parameter.

        '
      style: form
      explode: true
      schema:
        type: string
        example: myValue,myOtherValue
    limit-2:
      name: limit
      in: query
      description: Maximum number of items to return. By default there is no limit.
      style: form
      explode: true
      schema:
        type: number
        format: double
    feedDescription:
      name: feedDescription
      in: query
      description: 'Overrides the auto-generated RSS channel `<description>` element.

        Only used when `format=rss`. If not provided, the description defaults to `Items in dataset with id "<datasetId>".`

        '
      style: form
      explode: true
      schema:
        type: string
        example: Scraped forum posts
    Content-Encoding:
      name: Content-Encoding
      in: header
      description: Compression encoding of the request body.
      required: false
      style: simple
      schema:
        enum:
        - br
        - gzip
        - deflate
        - identity
        type: string
    delimiter:
      name: delimiter
      in: query
      description: 'A delimiter character for CSV files, only used if `format=csv`. You

        might need to URL-encode the character (e.g. use `%09` for tab or `%3B`

        for semicolon). The default delimiter is a simple comma (`,`).

        '
      style: form
      explode: true
      schema:
        type: string
        example: ;
  schemas:
    DatasetSchemaValidationErrorData:
      title: DatasetSchemaValidationErrorData
      required:
      - invalidItems
      type: object
      properties:
        invalidItems:
          type: array
          description: A list of invalid items in the received array of items.
          items:
            $ref: '#/components/schemas/InvalidDatasetItem'
    UpdateDatasetRequest:
      title: UpdateDatasetRequest
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        generalAccess:
          $ref: '#/components/schemas/GeneralAccess'
      example:
        name: new-dataset-name
