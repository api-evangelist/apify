- name: Actors/Actor runs
  x-displayName: Actor runs
  x-parent-tag-name: Actors
  x-legacy-doc-urls:
  - '#/reference/actors/run-collection'
  - '#tag/ActorsRun-collection'
  - '#tag/ActorsResurrect-run'
  - '#tag/ActorsMetamorph-run'
  - '#tag/ActorsAbort-run'
  - '#/reference/actors/run-object'
