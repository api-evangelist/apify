openapi: 3.2.0
info:
  title: Apify Schedules API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: 'The Apify API (version 2) provides programmatic access to the Apify

    platform. The API is organized

    around RESTful

    HTTP endpoints. You can download the complete OpenAPI schema of Apify API in the YAML or JSON formats. The source code is also available on GitHub. All requests and responses (including errors) are encoded in

    JSON format with UTF-8 encoding,

    with a few exceptions that are explicitly described in the reference. To access the API, we recommend using one of our API clients:


    Stable API clients:

    - For Node.js, we recommend the `apify-client` NPM

    package. - For Python, we recommend the `apify-client` PyPI

    package. Experimental API clients:

    - For Java, we recommend the `apify-client` Maven central component. - For Rust, we recommend the `apify-client` crate. - For .NET, we recommend the `apify-client` Nuget package. - For PHP, we recommend the `apify-client` Packagist package. - For Go, we recommend the `apify-client` package. The clients'' functions correspond to the API endpoints and have the same

    parameters. This simplifies development of apps that depend on the Apify

    platform. :::note Important Request Details


    - `Content-Type` header: For requests with a JSON body, you must include the `Content-Type: application/json` header. - Method override: You can override the HTTP method using the `method` query parameter. This is useful for clients that can only send `GET` requests. For example, to call a `POST` endpoint, append `?method=POST` to the URL of your `GET` request. :::


    ## Authentication


    **You can find your API token on the

    Integrations page in the

    Apify Console.**


    To use your token in a request, either:


    - Add the token to your request''s `Authorization` header as `Bearer `. E.g., `Authorization: Bearer xxxxxxx`. More info. (Recommended). - Add it as the `token` parameter to your request URL. (Less secure). Using your token in the request header is more secure than using it as a URL

    parameter because URLs are often stored

    in browser history and server logs. This creates a chance for someone

    unauthorized to access your API token. **Never share your API token or password with untrusted parties!**


    For more information, see our

    integrations documentation. ### Agentic payments


    AI agents can authenticate and pay for Actor runs without an Apify account

    using agentic payments. Instead of an API token, the request carries a

    payment credential that both authorizes and pays for the call. Apify supports

    the x402 protocol

    (`PAYMENT-SIGNATURE` header) and

    Skyfire

    (`skyfire-pay-id` header). ## Basic usage


    To run an Actor, send a POST request to the Run

    Actor endpoint using either the

    Actor ID code (e.g. `vKg4IjxZbEYTYeW8T`) or its name (e.g. `janedoe~my-actor`):


    `https://api.apify.com/v2/actors/[actor_id]/runs`


    If the Actor is not runnable anonymously, you will receive a 401 or 403

    response code. This means you need to add your secret API

    token to the request''s

    `Authorization` header (recommended) or as a

    URL query parameter `?token=[your_token]` (less secure). Optionally, you can include the query parameters described in the Run

    Actor section to customize your

    run. If you''re using Node.js, the best way to run an Actor is using the

    `Apify.call()` method from the Apify

    SDK. It

    runs the Actor using the account you are currently logged into (determined

    by the secret API token). The result is an Actor run

    object and its output (if

    any). A typical workflow is as follows:


    1. Run an Actor or task using the Run

    Actor or Run

    task API endpoints. 2. Monitor the Actor run by periodically polling its progress using the Get

    run API

    endpoint. 3. Fetch the results from the Get

    items API endpoint using the

    `defaultDatasetId`, which you receive in the Run request response. Additional data may be stored in a key-value store. You can fetch them from

    the Get record API endpoint

    using the `defaultKeyValueStoreId` and the store''s `key`. **Note**: Instead of periodic polling, you can also run your

    Actor or

    task

    synchronously.'
  contact: {}
  version: v2-2026-10-08T073338Z
servers:
- url: https://api.apify.com
  variables: {}
security:
- httpBearer: []
- apiKey: []
tags:
- name: Schedules
  x-displayName: Manage schedules
  x-legacy-doc-urls:
  - '#/reference/schedules'
  - '#tag/Schedules'
  - '#/reference/schedules/schedules-collection'
  - '#tag/SchedulesSchedules-collection'
  - '#/reference/schedules/schedule-object'
  - '#tag/SchedulesSchedule-object'
  - '#/reference/schedules/schedule-log'
  - '#tag/SchedulesSchedule-log'
  description: 'This section describes API endpoints for managing schedules.


    Schedules are used to automatically start your Actors at certain times. Each schedule

    can be associated with a number of Actors and Actor tasks. It is also possible

    to override the settings of each Actor (task) similarly to when invoking the Actor

    (task) using the API.

    For more information, see Schedules documentation.


    Each schedule is assigned actions for it to perform. Actions can be of two types

    - `RUN_ACTOR` and `RUN_ACTOR_TASK`.


    For details, see the documentation of the Get schedule endpoint.'
  x-trait: 'true'
paths:
  /v2/schedules:
    get:
      tags:
      - Schedules
      summary: Get list of schedules
      description: 'Gets the list of schedules that the user created.


        The endpoint supports pagination using the `limit` and `offset` parameters.

        It will not return more than 1000 records.


        By default, the records are sorted by the `createdAt` field in ascending

        order. To sort the records in descending order, use the `desc=1` parameter.'
      operationId: schedules_get
      parameters:
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/descCreatedAt'
      responses:
        '200':
          description: ''
          headers:
            X-Apify-Pagination-Offset:
              description: The offset of the first item in the current page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '0'
            X-Apify-Pagination-Limit:
              description: The maximum number of items returned per page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '100'
            X-Apify-Pagination-Count:
              description: The number of items returned in the current page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '100'
            X-Apify-Pagination-Total:
              description: The total number of items available.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '10204'
            X-Apify-Pagination-Desc:
              description: Whether the items are sorted in descending order.
              content:
                text/plain:
                  schema:
                    type: string
                  example: 'false'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfSchedulesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/schedules/schedules-collection/get-list-of-schedules
      - https://docs.apify.com/api/v2#/reference/schedules/get-list-of-schedules
      - https://docs.apify.com/api/v2#tag/SchedulesSchedules-collection/operation/schedules_get
      x-js-parent: ScheduleCollectionClient
      x-js-name: list
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/ScheduleCollectionClient#list
      x-py-parent: ScheduleCollectionClientAsync
      x-py-name: list
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/ScheduleCollectionClientAsync#list
    post:
      tags:
      - Schedules
      summary: Create schedule
      description: 'Creates a new schedule with settings provided by the schedule object passed

        as JSON in the payload. The response is the created schedule object.


        The request needs to specify the `Content-Type: application/json` HTTP header!


        When providing your API authentication token, we recommend using the

        request''s `Authorization` header, rather than the URL. (More

        info).'
      operationId: schedules_post
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateScheduleRequest'
        required: true
      responses:
        '201':
          description: ''
          headers:
            Location:
              content:
                text/plain:
                  schema:
                    type: string
                  example: https://api.apify.com/v2/schedules/asdLZtadYvn4mBZmm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/schedules/schedules-collection/create-schedule
      - https://docs.apify.com/api/v2#/reference/schedules/create-schedule
      - https://docs.apify.com/api/v2#tag/SchedulesSchedules-collection/operation/schedules_post
      x-js-parent: ScheduleCollectionClient
      x-js-name: create
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/ScheduleCollectionClient#create
      x-py-parent: ScheduleCollectionClientAsync
      x-py-name: create
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/ScheduleCollectionClientAsync#create
  /v2/schedules/{scheduleId}:
    get:
      tags:
      - Schedules
      summary: Get schedule
      description: Gets the schedule object with all details.
      operationId: schedule_get
      parameters:
      - $ref: '#/components/parameters/scheduleId'
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/schedules/schedule-object/get-schedule
      - https://docs.apify.com/api/v2#/reference/schedules/get-schedule
      - https://docs.apify.com/api/v2#tag/SchedulesSchedule-object/operation/schedule_get
      x-js-parent: ScheduleClient
      x-js-name: get
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/ScheduleClient#get
      x-py-parent: ScheduleClientAsync
      x-py-name: get
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/ScheduleClientAsync#get
    put:
      tags:
      - Schedules
      summary: Update schedule
      description: 'Updates a schedule using values specified by a schedule object passed as

        JSON in the POST payload. If the object does not define a specific property,

        its value will not be updated.


        The response is the full schedule object as returned by the

        Get schedule endpoint.


        **The request needs to specify the `Content-Type: application/json` HTTP

        header!**


        When providing your API authentication token, we recommend using the

        request''s `Authorization` header, rather than the URL. (More

        info).'
      operationId: schedule_put
      parameters:
      - $ref: '#/components/parameters/scheduleId'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateScheduleRequest'
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/schedules/schedule-object/update-schedule
      - https://docs.apify.com/api/v2#/reference/schedules/update-schedule
      - https://docs.apify.com/api/v2#tag/SchedulesSchedule-object/operation/schedule_put
      x-js-parent: ScheduleClient
      x-js-name: update
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/ScheduleClient#update
      x-py-parent: ScheduleClientAsync
      x-py-name: update
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/ScheduleClientAsync#update
    delete:
      tags:
      - Schedules
      summary: Delete schedule
      description: Deletes a schedule.
      operationId: schedule_delete
      parameters:
      - $ref: '#/components/parameters/scheduleId'
      responses:
        '204':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                example: {}
              example: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/schedules/schedule-object/delete-schedule
      - https://docs.apify.com/api/v2#/reference/schedules/delete-schedule
      - https://docs.apify.com/api/v2#tag/SchedulesSchedule-object/operation/schedule_delete
      x-js-parent: ScheduleClient
      x-js-name: delete
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/ScheduleClient#delete
  /v2/schedules/{scheduleId}/log:
    get:
      tags:
      - Schedules
      summary: Get schedule log
      description: 'Gets the schedule log as a JSON array containing information about up to a

        1000 invocations of the schedule.'
      operationId: schedule_log_get
      parameters:
      - $ref: '#/components/parameters/scheduleId'
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleLogResponse'
              example:
                data:
                - message: Schedule invoked
                  level: INFO
                  createdAt: '2019-03-26T12:28:00.370Z'
                - message: 'Cannot start Actor task \"iEvfA6pm6DWjRTGxS\": Provided input must be object, got \"string\" instead.'
                  level: ERROR
                  createdAt: '2019-03-26T12:30:00.325Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/schedules/schedule-log/get-schedule-log
      - https://docs.apify.com/api/v2#/reference/schedules/get-schedule-log
      - https://docs.apify.com/api/v2#tag/SchedulesSchedule-log/operation/schedule_log_get
      x-js-parent: ScheduleClient
      x-js-name: getLog
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/ScheduleClient#getLog
      x-py-parent: ScheduleClientAsync
      x-py-name: get_log
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/ScheduleClientAsync#get_log
components:
  schemas:
    ScheduleLogEntry:
      title: ScheduleLogEntry
      required:
      - message
      - level
      - createdAt
      type: object
      properties:
        message:
          type: string
          examples:
          - Schedule invoked
        level:
          type: string
          examples:
          - INFO
        createdAt:
          type: string
          format: date-time
          examples:
          - '2019-03-26T12:28:00.370Z'
    ScheduleAction:
      title: ScheduleAction
      oneOf:
      - $ref: '#/components/schemas/ScheduleActionRunActor'
      - $ref: '#/components/schemas/ScheduleActionRunActorTask'
      discriminator:
        propertyName: type
        mapping:
          RUN_ACTOR: '#/components/schemas/ScheduleActionRunActor'
          RUN_ACTOR_TASK: '#/components/schemas/ScheduleActionRunActorTask'
    ScheduleActionRunInput:
      title: ScheduleActionRunInput
      type: object
      properties:
        body:
          type:
          - string
          - 'null'
          examples:
          - '{\n   "foo": "actor"\n}'
        contentType:
          type:
          - string
          - 'null'
          examples:
          - application/json; charset=utf-8
    ErrorResponse:
      title: ErrorResponse
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ScheduleCreateActionRunActorTask:
      title: ScheduleCreateActionRunActorTask
      required:
      - type
      - actorTaskId
      type: object
      properties:
        type:
          const: RUN_ACTOR_TASK
        actorTaskId:
          type: string
          examples:
          - jF8GGEvbEg4Au3NLA
        input:
          anyOf:
          - type: object
          - type: 'null'
    CreateOrUpdateScheduleRequest:
      title: CreateOrUpdateScheduleRequest
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          examples:
          - my-schedule
        isEnabled:
          type:
          - boolean
          - 'null'
          examples:
          - true
        isExclusive:
          type:
          - boolean
          - 'null'
          examples:
          - true
        cronExpression:
          type:
          - string
          - 'null'
          examples:
          - '* * * * *'
        timezone:
          type:
          - string
          - 'null'
          examples:
          - UTC
        description:
          type:
          - string
          - 'null'
          examples:
          - Schedule of actor ...
        title:
          type:
          - string
          - 'null'
        notifications:
          $ref: '#/components/schemas/ScheduleNotifications'
        actions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ScheduleCreateAction'
          description: ''
    ScheduleActionRunActorTask:
      title: ScheduleActionRunActorTask
      required:
      - id
      - type
      - actorTaskId
      type: object
      properties:
        id:
          type: string
          examples:
          - c6KfSgoQzFhMk3etc
        type:
          const: RUN_ACTOR_TASK
        actorTaskId:
          type: string
          examples:
          - jF8GGEvbEg4Au3NLA
        input:
          anyOf:
          - type: object
          - type: 'null'
    ScheduleCreateAction:
      title: ScheduleCreateAction
      oneOf:
      - $ref: '#/components/schemas/ScheduleCreateActionRunActor'
      - $ref: '#/components/schemas/ScheduleCreateActionRunActorTask'
      discriminator:
        propertyName: type
        mapping:
          RUN_ACTOR: '#/components/schemas/ScheduleCreateActionRunActor'
          RUN_ACTOR_TASK: '#/components/schemas/ScheduleCreateActionRunActorTask'
    Schedule:
      title: Schedule
      allOf:
      - $ref: '#/components/schemas/ScheduleBase'
      - type: object
        required:
        - actions
        properties:
          description:
            type:
            - string
            - 'null'
            examples:
            - Schedule of actor ...
          title:
            type:
            - string
            - 'null'
          notifications:
            $ref: '#/components/schemas/ScheduleNotifications'
          actions:
            type: array
            items:
              $ref: '#/components/schemas/ScheduleAction'
            description: ''
    TaskOptions:
      title: TaskOptions
      type: object
      properties:
        build:
          type:
          - string
          - 'null'
          examples:
          - latest
        timeoutSecs:
          type:
          - integer
          - 'null'
          examples:
          - 300
        memoryMbytes:
          type:
          - integer
          - 'null'
          examples:
          - 1024
        maxItems:
          type:
          - integer
          - 'null'
          examples:
          - 1000
        maxTotalChargeUsd:
          type:
          - number
          - 'null'
          examples:
          - 5
        restartOnError:
          type:
          - boolean
          - 'null'
          examples:
          - false
    ListOfSchedulesResponse:
      title: ListOfSchedulesResponse
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ListOfSchedules'
    ScheduleCreateActionRunActor:
      title: ScheduleCreateActionRunActor
      required:
      - type
      - actorId
      type: object
      properties:
        type:
          const: RUN_ACTOR
        actorId:
          type: string
          examples:
          - jF8GGEvbEg4Au3NLA
        runInput:
          anyOf:
          - $ref: '#/components/schemas/ScheduleActionRunInput'
          - type: 'null'
        runOptions:
          anyOf:
          - $ref: '#/components/schemas/TaskOptions'
          - type: 'null'
    PaginationResponse:
      title: PaginationResponse
      description: Common pagination fields for list responses.
      required:
      - total
      - offset
      - limit
      - desc
      - count
      type: object
      properties:
        total:
          type: integer
          description: The total number of items available across all pages.
          minimum: 0
          examples:
          - 1
        offset:
          type: integer
          description: The starting position for this page of results.
          minimum: 0
          examples:
          - 0
        limit:
          type: integer
          description: The maximum number of items returned per page.
          minimum: 1
          examples:
          - 1000
        desc:
          type: boolean
          description: Whether the results are sorted in descending order.
          examples:
          - false
        count:
          type: integer
          description: The number of items returned in this response.
          minimum: 0
          examples:
          - 1
    ScheduleResponse:
      title: ScheduleResponse
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Schedule'
    ErrorType:
      title: ErrorType
      type: string
      description: Machine-processable error type identifier.
      enum:
      - 3d-secure-auth-failed
      - access-right-already-exists
      - action-not-found
      - actor-already-rented
      - actor-can-not-be-rented
      - actor-disabled
      - actor-is-not-rented
      - actor-memory-limit-exceeded
      - actor-name-exists-new-owner
      - actor-name-not-unique
      - actor-not-found
      - actor-not-github-actor
      - actor-not-public
      - actor-permission-level-not-supported-for-agentic-payments
      - actor-review-already-exists
      - actor-run-failed
      - actor-standby-not-supported-for-agentic-payments
      - actor-task-name-not-unique
      - agentic-payment-info-retrieval-error
      - agentic-payment-information-missing
      - agentic-payment-insufficient-amount
      - agentic-payment-provider-internal-error
      - agentic-payment-provider-unauthorized
      - airtable-webhook-deprecated
      - already-subscribed-to-paid-actor
      - apify-plan-required-to-use-paid-actor
      - apify-signup-not-allowed
      - auth-method-not-supported
      - authorization-server-not-found
      - auto-issue-date-invalid
      - background-check-required
      - billing-system-error
      - black-friday-plan-expired
      - braintree-error
      - braintree-not-linked
      - braintree-operation-timed-out
      - braintree-unsupported-currency
      - build-not-found
      - build-outdated
      - cannot-add-apify-events-to-ppe-actor
      - cannot-add-multiple-pricing-infos
