    ScheduleListItemActionRunActor:
      title: ScheduleListItemActionRunActor
      required:
      - id
      - type
      - actorId
      type: object
      properties:
        id:
          type: string
          examples:
          - ZReCs7hkdieq8ZUki
        type:
          const: RUN_ACTOR
        actorId:
          type: string
          examples:
          - HKhKmiCMrDgu9eXeE
    ScheduleListItem:
      title: ScheduleListItem
      allOf:
      - $ref: '#/components/schemas/ScheduleBase'
      - type: object
        required:
        - actions
        properties:
          actions:
            type: array
            items:
              $ref: '#/components/schemas/ScheduleListItemAction'
            description: ''
    ScheduleNotifications:
      title: ScheduleNotifications
      type: object
      description: Notification settings for this schedule.
      properties:
        email:
          type: boolean
          examples:
          - true
    ScheduleBase:
      title: ScheduleBase
      required:
      - id
      - userId
      - name
      - cronExpression
      - timezone
      - isEnabled
      - isExclusive
      - createdAt
      - modifiedAt
      type: object
      properties:
        id:
          type: string
          examples:
          - asdLZtadYvn4mBZmm
        userId:
          type: string
          examples:
          - wRsJZtadYvn4mBZmm
        name:
          type: string
          examples:
          - my-schedule
        cronExpression:
          type: string
          examples:
          - '* * * * *'
        timezone:
          type: string
          examples:
          - UTC
        isEnabled:
          type: boolean
          examples:
          - true
        isExclusive:
          type: boolean
          examples:
          - true
        createdAt:
          type: string
          format: date-time
          examples:
          - '2019-12-12T07:34:14.202Z'
        modifiedAt:
          type: string
          format: date-time
          examples:
          - '2019-12-20T06:33:11.202Z'
        nextRunAt:
          type:
          - string
          - 'null'
          format: date-time
          examples:
          - '2019-04-12T07:34:10.202Z'
        lastRunAt:
          type:
          - string
          - 'null'
          format: date-time
          examples:
          - '2019-04-12T07:33:10.202Z'
    ScheduleActionRunActor:
      title: ScheduleActionRunActor
      required:
      - id
      - type
      - actorId
      type: object
      properties:
        id:
          type: string
          examples:
          - c6KfSgoQzFhMk3etc
        type:
          const: RUN_ACTOR
        actorId:
          type: string
          examples:
          - jF8GGEvbEg4Au3NLA
        runInput:
          anyOf:
          - $ref: '#/components/schemas/ScheduleActionRunInput'
          - type: 'null'
        runOptions:
          anyOf:
          - $ref: '#/components/schemas/TaskOptions'
          - type: 'null'
    ErrorDetail:
      title: ErrorDetail
