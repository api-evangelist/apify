      deprecated: false
      security:
      - httpBearer: []
      - apiKey: []
    servers:
    - url: https://api.apify.com
      variables: {}
  /acts:
    get:
      operationId: listActors
      summary: Apify List Actors
      description: Returns a list of Actors owned by the authenticated user.
      tags:
      - Actors
      parameters:
      - name: my
        in: query
        description: If true, return only Actors owned by the user.
        schema:
          type: boolean
      - name: limit
        in: query
        description: Maximum number of results to return.
        schema:
          type: integer
          default: 10
      - name: offset
        in: query
        description: Number of results to skip.
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: List of Actors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorList'
              examples:
                ListActors200Example:
                  summary: Default listActors 200 response
                  x-microcks-default: true
                  value:
                    data:
                      items:
                      - id: mTD6bTz2HCjSQHeBn
                        name: web-scraper
                        username: apify
                        title: Web Scraper
                      - id: k99HkWZyhsTeHR4Ly
                        name: cheerio-scraper
                        username: apify
                        title: Cheerio Scraper
                      total: 2
                      offset: 0
                      limit: 10
        '401':
          $ref: '#/components/responses/Unauthorized_2'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - bearerAuth: []
    servers:
    - url: https://api.apify.com/v2
      description: Apify Production API
  /acts/{actorId}:
    get:
      operationId: getActor
      summary: Apify Get Actor
      description: Returns details of a specific Actor.
      tags:
      - Actors
      parameters:
      - name: actorId
        in: path
        required: true
        description: Actor ID or username~actorName.
        schema:
          type: string
      responses:
        '200':
          description: Actor details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorDetail'
              examples:
                GetActor200Example:
                  summary: Default getActor 200 response
                  x-microcks-default: true
                  value:
                    data:
                      id: mTD6bTz2HCjSQHeBn
                      name: web-scraper
                      username: apify
                      title: Web Scraper
                      description: Crawls websites and extracts data using JavaScript.
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '404':
          $ref: '#/components/responses/NotFound_2'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - bearerAuth: []
    servers:
    - url: https://api.apify.com/v2
      description: Apify Production API
  /acts/{actorId}/runs:
    post:
      operationId: runActor
      summary: Apify Run Actor
      description: Runs a specific Actor and returns its run details. The Actor is started asynchronously by default. Use waitForFinish parameter for synchronous execution.
      tags:
      - Actors
      parameters:
      - name: actorId
        in: path
        required: true
        description: Actor ID or username~actorName.
        schema:
          type: string
      - name: waitForFinish
        in: query
        description: Wait for run to finish (max 300 seconds). Returns run details when complete.
        schema:
          type: integer
      - name: memory
        in: query
        description: Memory limit in MB (128-32768).
        schema:
          type: integer
      - name: build
        in: query
        description: Tag or number of the Actor build to run.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Actor input as JSON object.
            examples:
              RunActorRequestExample:
                summary: Default runActor request
                x-microcks-default: true
                value:
                  startUrls:
                  - url: https://example.com
                  maxRequestsPerCrawl: 100
      responses:
        '201':
          description: Actor run started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
              examples:
                RunActor201Example:
                  summary: Default runActor 201 response
                  x-microcks-default: true
                  value:
                    data:
                      id: HG7ML7M8z78YcAPEB
                      actId: mTD6bTz2HCjSQHeBn
                      status: RUNNING
                      startedAt: '2026-04-19T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '404':
          $ref: '#/components/responses/NotFound_2'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - bearerAuth: []
    servers:
    - url: https://api.apify.com/v2
      description: Apify Production API
components:
  parameters:
    actorId:
      name: actorId
      in: path
      description: Actor ID or the username of the Actor owner and the Actor name, separated by a tilde (`~`).
      required: true
      style: simple
      schema:
        type: string
        example: compass~google-maps-extractor
    descCreatedAt:
      name: desc
      in: query
      description: 'If `true` or `1` then the objects are sorted by the `createdAt` field in

        descending order. By default, they are sorted in ascending order.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: true
    limit:
      name: limit
      in: query
      description: 'Maximum number of items to return. The default value as well as the maximum is `1000`.

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 1000
    offset:
      name: offset
      in: query
      description: 'Number of items that should be skipped at the start. The default value is `0`.

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 0
  schemas:
    EnvVarRequest:
      title: EnvVarRequest
      required:
      - name
      - value
      type: object
      properties:
        name:
          type: string
          examples:
          - MY_ENV_VAR
          description: The name of the environment variable. Can't contain `=`.
        value:
          type: string
          examples:
          - my-value
          description: The value of the environment variable.
        isSecret:
          type:
          - boolean
          - 'null'
          examples:
          - false
          description: Whether the environment variable is encrypted. Secret values aren't returned by the API.
    TieredPricingPerEvent:
      title: TieredPricingPerEvent
      description: 'Tiered price-per-event pricing for a single charge event, keyed by subscription tier (e.g. `FREE`, `BRONZE`,

        `SILVER`, `GOLD`, `PLATINUM`, `DIAMOND`). The actual price applied is resolved from the user''s tier.

        '
      type: object
      additionalProperties:
        $ref: '#/components/schemas/TieredPricingPerEventEntry'
    TieredPricingPerEventEntry:
      title: TieredPricingPerEventEntry
      description: A single tier's price-per-event entry.
      type: object
      required:
      - tieredEventPriceUsd
      properties:
        tieredEventPriceUsd:
          type: number
          description: Price per event in USD for this tier.
    ActorStandby:
      title: ActorStandby
      type: object
      properties:
        isEnabled:
          type:
          - boolean
          - 'null'
          description: Whether standby mode is enabled for the Actor.
        desiredRequestsPerActorRun:
          type:
          - integer
          - 'null'
          description: Target number of concurrent HTTP requests a single run is configured to handle.
        maxRequestsPerActorRun:
          type:
          - integer
          - 'null'
          description: Maximum number of concurrent HTTP requests that can be routed to a single run.
        idleTimeoutSecs:
          type:
          - integer
          - 'null'
          description: In seconds, how long a run can stay idle without incoming requests before it's terminated.
        build:
          type:
          - string
          - 'null'
          description: Which build to run in standby mode. Either a build tag or a version number.
        memoryMbytes:
          type:
          - integer
          - 'null'
          description: In MB, the amount of memory allocated to the run.
        disableStandbyFieldsOverride:
          type:
          - boolean
          - 'null'
          description: If `true`, prevents the standby mode configuration from being overridden elsewhere.
        shouldPassActorInput:
          type:
          - boolean
          - 'null'
          description: Whether to pass the Actor's input to the standby run. If `false`, the standby runs start with no input.
    UpdatedBuildProperty:
      title: UpdatedBuildProperty
      type:
      - object
      - 'null'
      description: The name of the build tag.
      required:
      - buildId
      properties:
        buildId:
          type: string
          description: The ID of the build to assign to the tag.
    ErrorResponse:
      title: ErrorResponse
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    PricePerDatasetItemActorPricingInfo:
      title: PricePerDatasetItemActorPricingInfo
      allOf:
      - $ref: '#/components/schemas/CommonActorPricingInfo'
      - type: object
        required:
        - pricingModel
        - unitName
        properties:
          pricingModel:
            type: string
            const: PRICE_PER_DATASET_ITEM
          unitName:
            type: string
            description: Name of the unit that is being charged
          pricePerUnitUsd:
            type: number
            description: 'Price per unit in USD. Mutually exclusive with `tieredPricing` - exactly one of the two is present

              on a pricing record.

              '
          tieredPricing:
            $ref: '#/components/schemas/TieredPricingPerDatasetItem'
    VersionSourceFiles:
      title: VersionSourceFiles
      type: array
      items:
        anyOf:
        - $ref: '#/components/schemas/SourceCodeFile'
        - $ref: '#/components/schemas/SourceCodeFolder'
    EnvVar:
      title: EnvVar
      required:
      - name
      type: object
      properties:
        name:
          type: string
          examples:
          - MY_ENV_VAR
          description: The name of the environment variable.
        value:
          type: string
          examples:
          - my-value
          description: The value of the environment variable. If `isSecret` is `true`, this value isn't returned by the API.
        isSecret:
          type:
          - boolean
          - 'null'
          examples:
          - false
          description: Whether the environment variable is encrypted. Secret values aren't returned by the API.
    VersionSourceType:
      title: VersionSourceType
      enum:
      - SOURCE_FILES
      - GIT_REPO
      - TARBALL
      - GITHUB_GIST
      - SOURCE_CODE
      type: string
    SourceCodeFolder:
      title: SourceCodeFolder
      description: 'Represents a folder in the Actor''s source code structure. Distinguished from

        SourceCodeFile by the presence of the `folder` property set to `true`.

        '
      type: object
      required:
      - name
      - folder
      properties:
        name:
          type: string
          description: The path of the folder relative to the Actor's root directory.
          examples:
          - src/utils
        folder:
          type: boolean
          description: Whether it's a folder. Distinguishes folders from files.
          examples:
          - true
    SourceCodeFile:
      title: SourceCodeFile
      type: object
      description: Represents a single file in the Actor's source code.
      required:
      - name
      properties:
        format:
          $ref: '#/components/schemas/SourceCodeFileFormat'
          description: Format of the file's content, `TEXT` for plain text and `BASE64` for encoded content.
        content:
          type: string
          examples:
          - console.log('This is the main.js file');
          description: The contents of the file. Interpreted based on the value of `format`.
        name:
          type: string
          examples:
          - src/main.js
          description: The path of the file relative to the Actor's root directory.
    ActorChargeEvent:
      title: ActorChargeEvent
      description: 'Definition of a single chargeable event for a pay-per-event Actor. Each event is either flat-priced

        (`eventPriceUsd` is set) or tier-priced (`eventTieredPricingUsd` is set); the two are mutually exclusive.

        '
      type: object
      required:
      - eventTitle
      - eventDescription
      properties:
        eventTitle:
          type: string
          description: Human-readable title shown to users in the billing UI.
        eventDescription:
          type: string
          description: Human-readable description of what triggers this event.
        eventPriceUsd:
          type: number
          description: 'Flat price per event in USD. Present only for non-tiered events. Mutually exclusive with `eventTieredPricingUsd`.

            '
        eventTieredPricingUsd:
          $ref: '#/components/schemas/TieredPricingPerEvent'
        isPrimaryEvent:
          type: boolean
          description: Whether this event is the Actor's primary chargeable event.
        isOneTimeEvent:
          type: boolean
          description: Whether this event can only be charged once per Actor run.
    TieredPricingPerDatasetItem:
      title: TieredPricingPerDatasetItem
      description: 'Tiered price-per-dataset-item pricing, keyed by subscription tier (e.g. `FREE`, `BRONZE`, `SILVER`, `GOLD`,

        `PLATINUM`, `DIAMOND`). The actual price applied to a run is resolved from the user''s tier.

        '
      type: object
      additionalProperties:
        $ref: '#/components/schemas/TieredPricingPerDatasetItemEntry'
    ExampleRunInput:
      title: ExampleRunInput
      type: object
      properties:
        body:
          type: string
          example: '{ "helloWorld": 123 }'
          description: Sample input, serialized as a string.
        contentType:
          type: string
          examples:
          - application/json; charset=utf-8
          description: MIME type of `body`.
    CreateVersionRequest:
      title: CreateVersionRequest
      required:
      - versionNumber
      - sourceType
      type: object
      properties:
        versionNumber:
          type: string
          pattern: ^([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])$
          examples:
          - '1.6'
          description: The version number of the Actor. Two numbers separated by a dot, that represent the `MAJOR.MINOR` part of the semantic versioning.
        sourceType:
          $ref: '#/components/schemas/WritableVersionSourceType'
          description: Where the source code of the version lives.
        envVars:
          type: array
          items:
            $ref: '#/components/schemas/EnvVarRequest'
          description: Environment variables for the version.
        applyEnvVarsToBuild:
          type:
          - boolean
          - 'null'
          examples:
          - false
          description: Whether to inject the environment variables at build time.
        buildTag:
          type:
          - string
          - 'null'
          examples:
          - latest
          description: The tag name to apply to a successful build of this version. Can be `null` when the version has no build tag.
        sourceFiles:
          $ref: '#/components/schemas/VersionSourceFiles'
          description: Applies when the `sourceType` is `SOURCE_FILES`. Represents the Actor's file structure as an array of files and folders.
        gitRepoUrl:
          type: string
          description: URL of the Git repository to clone the source code from. Applies when the `sourceType` is `GIT_REPO`.
        tarballUrl:
          type: string
          description: URL of the tarball to download the source code from. Applies when the `sourceType` is `TARBALL`.
        gitHubGistUrl:
          type: string
          description: URL of the GitHub Gist to clone the source code from. Applies when the `sourceType` is `GITHUB_GIST`.
    ActorRunPricingInfo:
      title: ActorRunPricingInfo
      discriminator:
        propertyName: pricingModel
        mapping:
          PAY_PER_EVENT: '#/components/schemas/PayPerEventActorPricingInfo'
          PRICE_PER_DATASET_ITEM: '#/components/schemas/PricePerDatasetItemActorPricingInfo'
          FLAT_PRICE_PER_MONTH: '#/components/schemas/FlatPricePerMonthActorPricingInfo'
          FREE: '#/components/schemas/FreeActorPricingInfo'
      oneOf:
      - $ref: '#/components/schemas/PayPerEventActorPricingInfo'
      - $ref: '#/components/schemas/PricePerDatasetItemActorPricingInfo'
      - $ref: '#/components/schemas/FlatPricePerMonthActorPricingInfo'
      - $ref: '#/components/schemas/FreeActorPricingInfo'
    ActorPermissionLevel:
      type: string
      description: 'Determines the permission level that the Actor requires to run. For details, see [Actor permissions](https://docs.apify.com/platform/actors/development/permissions).

        '
      enum:
      - LIMITED_PERMISSIONS
      - FULL_PERMISSIONS
      examples:
      - LIMITED_PERMISSIONS
    ActorResponse:
      title: ActorResponse
      description: Response containing Actor data.
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ActorResource'
    FreeActorPricingInfo:
      title: FreeActorPricingInfo
      allOf:
      - $ref: '#/components/schemas/CommonActorPricingInfo'
      - type: object
        required:
        - pricingModel
        properties:
          pricingModel:
            type: string
            const: FREE
    ActorNotice:
      title: ActorNotice
      type:
      - string
      - 'null'
      description: A warning displayed on the Actor's page in Apify Store and Console. Can be set by the Actor's developer or automatically by Apify's quality checks.
      enum:
      - NONE
      - RESIDENTIAL_PROXY_REQUIRED
      - UNDER_MAINTENANCE
      - null
      examples:
      - UNDER_MAINTENANCE
    UpdateActorRequest:
      title: UpdateActorRequest
      type: object
      properties:
        name:
          type: string
          examples:
          - instagram-scraper
          description: The identifier of the Actor. Use lowercase letters, numbers, and hyphens. Spaces or special characters aren't allowed. Must be unique across your account.
        description:
          type:
          - string
          - 'null'
          examples:
          - This scraper extracts posts and comments from Instagram.
          description: Short description of the Actor, displayed in Apify Store and Console.
        isPublic:
          type: boolean
          examples:
          - false
          description: Whether the Actor is available to users in Apify Store. If `false`, the Actor is private and only visible to you.
        actorPermissionLevel:
          $ref: '#/components/schemas/ActorPermissionLevel'
        seoTitle:
          type:
          - string
          - 'null'
          examples:
          - Free Instagram scraper
          description: Name of the Actor to display by search engines such as Google. Can be different from the Actor's name displayed in Apify Store and Console. Recommended length is 40-50 characters.
        seoDescription:
          type:
          - string
          - 'null'
          examples:
          - The best scraper for Instagram
          description: Description of the Actor to display by search engines such as Google. Recommended length is 140-156 characters.
        title:
          type:
          - string
          - 'null'
          examples:
          - Instagram scraper
          description: Human-readable name of the Actor, displayed in Apify Store and Console. Can contain spaces and capital letters. Recommended length is 40-50 characters. You can change this title without affecting the Actor's URL or SEO.
        restartOnError:
          type: boolean
          examples:
          - false
          deprecated: true
        versions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateVersionRequest'
          description: 'An array of `Version` objects. Each object represents a specific version of the Actor''s source code: its location, builds, and environment configuration.'
        pricingInfos:
          type: array
          items:
            $ref: '#/components/schemas/ActorRunPricingInfo'
        categories:
          type:
          - array
          - 'null'
          examples:
          - - SOCIAL_MEDIA
          items:
            type: string
          description: A list of categories that best define the Actor. Reflected in Apify Store's search and filtering options.
        defaultRunOptions:
          anyOf:
          - $ref: '#/components/schemas/DefaultRunOptions'
          - type: 'null'
          description: The default settings applied to an Actor run. Can be overridden by the user.
        taggedBuilds:
          type:
          - object
          - 'null'
          description: A dictionary that maps tag names to specific builds. For details, see [Update build tags](#update-build-tags).
          additionalProperties:
            $ref: '#/components/schemas/UpdatedBuildProperty'
          example:
            latest:
              buildId: z2EryhbfhgSyqj6Hn
            beta: null
        actorStandby:
          anyOf:
          - $ref: '#/components/schemas/ActorStandby'
          - type: 'null'
          description: The configuration of the Actor's standby mode. For details, see [Standby mode](https://docs.apify.com/platform/actors/development/programming-interface/standby).
        exampleRunInput:
          anyOf:
          - $ref: '#/components/schemas/ExampleRunInput'
          - type: 'null'
          description: Sample input payload that demonstrates what a typical run input for an Actor looks like. Used when no explicit input for a run is provided.
        isDeprecated:
          type:
          - boolean
          - 'null'
          description: Whether the Actor is deprecated.
    TieredPricingPerDatasetItemEntry:
      title: TieredPricingPerDatasetItemEntry
      description: A single tier's price-per-dataset-item entry.
      type: object
      required:
      - tieredPricePerUnitUsd
      properties:
        tieredPricePerUnitUsd:
          type: number
          description: Price per unit in USD for this tier.
    ListOfActors:
      title: ListOfActors
      allOf:
      - $ref: '#/components/schemas/PaginationResponse'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ActorListItem'
    FlatPricePerMonthActorPricingInfo:
      title: FlatPricePerMonthActorPricingInfo
      allOf:
      - $ref: '#/components/schemas/CommonActorPricingInfo'
      - type: object
        required:
        - pricingModel
        - pricePerUnitUsd
        - trialMinutes
        properties:
          pricingModel:
            type: string
            const: FLAT_PRICE_PER_MONTH
          trialMinutes:
            type: integer
            description: For how long this Actor can be used for free in trial period
          pricePerUnitUsd:
            type: number
            description: Monthly flat price in USD
    PayPerEventActorPricingInfo:
      title: PayPerEventActorPricingInfo
      allOf:
      - $ref: '#/components/schemas/CommonActorPricingInfo'
      - type: object
        required:
        - pricingModel
        - pricingPerEvent
        properties:
          pricingModel:
            type: string
            const: PAY_PER_EVENT
          pricingPerEvent:
            type: object
            properties:
              actorChargeEvents:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/ActorChargeEvent'
          minimalMaxTotalChargeUsd:
            type:
            - number
            - 'null'
    ListOfActorsResponse:
      title: ListOfActorsResponse
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ListOfActors'
    PaginationResponse:
      title: PaginationResponse
      description: Common pagination fields for list responses.
      required:
      - total
      - offset
      - limit
      - desc
      - count
      type: object
      properties:
        total:
          type: integer
          description: The total number of items available across all pages.
          minimum: 0
          examples:
          - 1
        offset:
          type: integer
          description: The starting position for this page of results.
          minimum: 0
          examples:
          - 0
        limit:
          type: integer
          description: The maximum number of items returned per page.
          minimum: 1
          examples:
          - 1000
        desc:
          type: boolean
          description: Whether the results are sorted in descending order.
          examples:
          - false
        count:
          type: integer
          description: The number of items returned in this response.
          minimum: 0
          examples:
          - 1
    TaggedBuilds:
      title: TaggedBuilds
      description: A dictionary mapping build tag names (e.g., "latest", "beta") to their build information.
      type: object
      additionalProperties:
        anyOf:
        - $ref: '#/components/schemas/TaggedBuildInfo'
        - type: 'null'
      example:
        latest:
          buildId: z2EryhbfhgSyqj6Hn
          buildNumber: 0.0.2
          finishedAt: '2019-06-10T11:15:49.286Z'
        beta:
          buildId: abc123def456
          buildNumber: 1.0.5
          finishedAt: '2019-07-15T14:30:00.000Z'
    TaggedBuildInfo:
      title: TaggedBuildInfo
      description: Information about a tagged build.
      type: object
      properties:
        buildId:
          type: string
          description: The ID of the build associated with this tag.
          examples:
          - z2EryhbfhgSyqj6Hn
        buildNumber:
          type:
          - string
          - 'null'
          pattern: ^([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])(\.[1-9][0-9]{0,4})$
          description: The build number/version string. Can be `null` for legacy builds that lack a valid build number.
          examples:
          - 0.0.2
        buildNumberInt:
          type: integer
          description: The build number encoded as a single integer.
          examples:
          - 42
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The timestamp when the build finished.
          examples:
          - '2019-06-10T11:15:49.286Z'
    ActorResource:
      title: ActorResource
      required:
      - id
      - userId
      - name
      - username
      - isPublic
      - createdAt
      - modifiedAt
      - stats
      - versions
      - defaultRunOptions
      type: object
      properties:
        id:
          type: string
          examples:
          - zdc3Pyhyz3m8vjDeM
          description: The ID of the Actor.
        userId:
          type: string
          examples:
          - wRsJZtadYvn4mBZmm
          description: The ID of the user who owns the Actor.
        name:
          type: string
          examples:
          - google-search-extractor
          description: The name of the Actor.
        username:
          type: string
          examples:
          - compass
          description: The username of the Actor owner.
        description:
          type:
          - string
          - 'null'
          examples:
          - Extract data from hundreds of places fast.
          description: Short description of the Actor, displayed in Apify Store and Console.
        restartOnError:
          type: boolean
          examples:
          - false
          deprecated: true
        isPublic:
          type: boolean
          examples:
          - false
          description: Whether the Actor is available to users in Apify Store.
        actorPermissionLevel:
          $ref: '#/components/schemas/ActorPermissionLevel'
        createdAt:
          type: string
          format: date-time
          examples:
          - '2019-07-08T11:27:57.401Z'
          description: The date and time the Actor was created. Follows the ISO 8601 format.
        modifiedAt:
          type: string
          format: date-time
          examples:
          - '2019-07-08T14:01:05.546Z'
          description: The date and time the Actor was last modified. Follows the ISO 8601 format.
        stats:
          $ref: '#/components/schemas/ActorStats'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/Version'
          description: 'An array of `Version` objects. Each object represents a specific version of the Actor''s source code: its location, builds, and environment configuration.'
        pricingInfos:
          type: array
          items:
            $ref: '#/components/schemas/ActorRunPricingInfo'
        defaultRunOptions:
          $ref: '#/components/schemas/DefaultRunOptions'
        exampleRunInput:
          anyOf:
          - $ref: '#/components/schemas/ExampleRunInput'
          - type: 'null'
        isDeprecated:
          type:
          - boolean
          - 'null'
          examples:
          - false
          description: Whether the Actor is deprecated.
        deploymentKey:
          type: string
          examples:
          - ssh-rsa AAAA ...
          description: The Actor's public SSH key, used as a deployment key for private Git repositories.
        title:
          type:
          - string
          - 'null'
          examples:
          - Google Search Extractor
          description: Human-readable name of the Actor, displayed in Apify Store and Console.
        taggedBuilds:
          anyOf:
          - $ref: '#/components/schemas/TaggedBuilds'
          - type: 'null'
        actorStandby:
          anyOf:
          - $ref: '#/components/schemas/ActorStandby'
          - type: 'null'
        readmeSummary:
          type: string
          description: An AI-generated Markdown summary of the Actor's README, optimized for search and AI agents. Contains an overview and a list of use cases. Generated only for public Actors.
        seoTitle:
          type:
          - string
          - 'null'
          examples:
          - Web Scraper
          description: Name of the Actor to display by search engines such as Google. Can be different from the Actor's name displayed in Apify Store and Console.
        seoDescription:
          type:
          - string
          - 'null'
          examples:
          - Crawls websites using Chrome and extracts data from pages using JavaScript.
          description: Description of the Actor to display by search engines such as Google.
        pictureUrl:
          type:
          - string
          - 'null'
          examples:
          - https://apify-image-uploads-prod.s3.amazonaws.com/.../actor-picture.png
          description: URL of the Actor's icon, displayed on the Actor's page in Apify Store and Console.
        standbyUrl:
          type:
          - string
          - 'null'
          examples:
          - https://jane35--my-actor.apify.actor
          description: 'URL for sending requests to the Actor in Standby mode.

            `null` if the Standby mode isn''t enabled.

            '
        notice:
          $ref: '#/components/schemas/ActorNotice'
        categories:
          type: array
          items:
            type: string
          examples:
          - - DEVELOPER_TOOLS
            - OPEN_SOURCE
          description: A list of categories that best define the Actor. Reflected in Apify Store's search and filtering options.
        isCritical:
          type: boolean
          examples:
          - false
          description: Whether the Actor is maintained by Apify.
        isGeneric:
          type: boolean
          examples:
          - false
          description: Whether the Actor is intended for developers. Set by Apify.
        isSourceCodeHidden:
          type: boolean
          default: true
          examples:
          - true
          description: Whether the Actor's source files are hidden on its detail page.
        hasNoDataset:
          type: boolean
          examples:
          - false
          description: Whether the Actor stores results in a dataset. Set by Apify.
    ActorStats:
      title: ActorStats
      type: object
      description: Usage statistics and Apify Store metrics for the Actor.
      properties:
        totalBuilds:
          type: integer
          examples:
          - 9
          description: The total number of builds of the Actor.
        totalRuns:
          type: integer
          examples:
          - 16
          description: The total number of runs of the Actor.
        totalUsers:
          type: integer
          examples:
          - 6
          description: The total number of Actor users, including its owner.
        totalUsers7Days:
          type: integer
          examples:
          - 2
          description: The number of active users of the Actor in the last 7 days.
        totalUsers30Days:
          type: integer
          examples:
          - 6
          description: The number of active users of the Actor in the last 30 days.
        totalUsers90Days:
          type: integer
          examples:
          - 6
          description: The number of active users of the Actor in the last 90 days.
        totalMetamorphs:
          type: integer
          examples:
          - 2
          description: The total number of times a run of another Actor was [metamorphed](https://docs.apify.com/platform/actors/development/programming-interface/metamorph) into this Actor.
        lastRunStartedAt:
          type: string
          format: date-time
          examples:
          - '2019-07-08T14:01:05.546Z'
          description: The date and time the most recent run of the Actor started.
        actorReviewCount:
          type: integer
          examples:
          - 69
          description: The number of reviews the Actor has received in Apify Store.
        actorReviewRating:
          type: number
          examples:
          - 4.7
          description: The average rating of the Actor in Apify Store.
        bookmarkCount:
          type: integer
          examples:
          - 1269
          description: The number of users who bookmarked the Actor in Apify Store.
        publicActorRunStats30Days:
          type: object
          description: 'Run status counts from the last 30 days. Only for public Actors.

            Excludes runs started by the Actor''s owner.

            '
          properties:
            ABORTED:
              type: integer
              examples:
              - 2542
              description: The number of runs that were aborted.
            FAILED:
              type: integer
              examples:
              - 1234
              description: The number of runs that failed.
            SUCCEEDED:
              type: integer
              examples:
              - 732805
              description: The number of runs that succeeded.
            TIMED-OUT:
              type: integer
              examples:
              - 12556
              description: The number of runs that timed out.
            TOTAL:
              type: integer
              examples:
              - 749137
              description: The total number of runs.
    Version:
      title: Version
      type: object
      required:
      - versionNumber
      - sourceType
      properties:
        versionNumber:
          type: string
          pattern: ^([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])$
          examples:
          - '0.0'
          description: The version number of the Actor. Two numbers separated by a dot, that represent the `MAJOR.MINOR` part of the semantic versioning.
        sourceType:
          anyOf:
          - $ref: '#/components/schemas/VersionSourceType'
          - type: 'null'
          description: Where the source code of the version lives.
        envVars:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/EnvVar'
          - type: 'null'
          description: Environment variables for the version.
        applyEnvVarsToBuild:
          type:
          - boolean
          - 'null'
          examples:
          - false
          description: Whether to inject the environment variables at build time.
        buildTag:
          type:
          - string
          - 'null'
          examples:
          - latest
          description: The tag name to apply to a successful build of this version. Can be `null` when the version has no build tag.
        sourceFiles:
          $ref: '#/components/schemas/VersionSourceFiles'
          description: Applies when the `sourceType` is `SOURCE_FILES`. Represents the Actor's file structure as an array of files and folders.
        gitRepoUrl:
          type:
          - string
          - 'null'
          description: URL of the Git repository to clone the source code from. Applies when the `sourceType` is `GIT_REPO`.
        tarballUrl:
          type:
          - string
          - 'null'
          description: URL to download the source code from as a tarball or ZIP file. Applies when the `sourceType` is `TARBALL`.
        gitHubGistUrl:
          type:
          - string
          - 'null'
          description: URL of the GitHub Gist to clone the source code from. Applies when the `sourceType` is `GITHUB_GIST`.
    CommonActorPricingInfo:
