                    applyEnvVarsToBuild: false
                    buildTag: latest
                    sourceFiles: []
                  categories: []
                  defaultRunOptions:
                    build: latest
                    timeoutSecs: 3600
                    memoryMbytes: 2048
                    restartOnError: false
              taggedBuildsCreateOrReassignTag:
                summary: Create or reassign a build tag
                value:
                  name: MyActor
                  isPublic: false
                  taggedBuilds:
                    latest:
                      buildId: z2EryhbfhgSyqj6Hn
              taggedBuildsRemoveTag:
                summary: Remove a build tag
                value:
                  name: MyActor
                  isPublic: false
                  taggedBuilds:
                    latest: null
              taggedBuildsMultipleOperations:
                summary: Update multiple build tags at once
                value:
                  name: MyActor
                  isPublic: false
                  taggedBuilds:
                    latest:
                      buildId: z2EryhbfhgSyqj6Hn
                    beta: null
