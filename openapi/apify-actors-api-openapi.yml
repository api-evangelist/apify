openapi: 3.2.0
info:
  title: Apify Actors API
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Actors across 2 of this provider''s published API definitions: apify-openapi.json, apify-api.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.apify.com
  variables: {}
- url: https://api.apify.com/v2
  description: Apify Production API
tags:
- name: Actors
  x-displayName: Actors
  x-legacy-doc-urls:
  - '#/reference/actors'
  - '#tag/Actors'
  - '#/reference/actors/actor-collection'
  - '#tag/ActorsActor-collection'
  - '#/reference/actors/actor-object'
  - '#tag/ActorsActor-object'
  description: 'The API endpoints in this section allow you to manage Apify Actors.


    ## Identify an Actor


    For API endpoints that require the `actorId` parameter, provide one of the following:

    - The Actor ID. It''s part of the Actor''s URL in Apify Console: `https://console.apify.com/actors/`. For example, `reGe1ST3OBgYZSsZJ`.

    - The username of the Actor owner plus the Actor name, separated by a tilde (`~`). For example, `apify~instagram-scraper`.'
paths:
  /v2/actors:
    get:
      tags:
      - Actors
      summary: Get list of Actors
      description: 'Gets the list of all Actors that the user created or used. The response is a

        list of objects, where each object contains a basic information about a single Actor.


        To only get Actors created by the user, add the `my=1` query parameter.


        The endpoint supports pagination using the `limit` and `offset` parameters

        and it will not return more than 1000 records.


        By default, the records are sorted by the `createdAt` field in ascending

        order, therefore you can use pagination to incrementally fetch all Actors while new

        ones are still being created. To sort the records in descending order, use the `desc=1` parameter.


        You can also sort by your last run by using the `sortBy=stats.lastRunStartedAt` query parameter.

        In this case, descending order means the most recently run Actor appears first.'
      operationId: actors_get
      parameters:
      - name: my
        in: query
        description: 'If `true` or `1` then the returned list only contains Actors owned by the user. The default value is `false`.

          '
        style: form
        explode: true
        schema:
          type: boolean
          example: true
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/descCreatedAt'
      - name: sortBy
        in: query
        description: 'Field to sort the records by. The default is `createdAt`. You can also use `stats.lastRunStartedAt` to sort

          by the most recently ran Actors.

          '
        schema:
          type: string
          enum:
          - createdAt
          - stats.lastRunStartedAt
          example: createdAt
      responses:
        '200':
          description: ''
          headers:
            X-Apify-Pagination-Offset:
              description: The offset of the first item in the current page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '0'
            X-Apify-Pagination-Limit:
              description: The maximum number of items returned per page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '100'
            X-Apify-Pagination-Count:
              description: The number of items returned in the current page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '100'
            X-Apify-Pagination-Total:
              description: The total number of items available.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '10204'
            X-Apify-Pagination-Desc:
              description: Whether the items are sorted in descending order.
              content:
                text/plain:
                  schema:
                    type: string
                  example: 'false'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfActorsResponse'
              example:
                data:
                  total: 2
                  count: 2
                  offset: 0
                  limit: 1000
                  desc: false
                  items:
                  - id: br9CKmk457
                    createdAt: '2019-10-29T07:34:24.202Z'
                    modifiedAt: '2019-10-30T07:34:24.202Z'
                    name: MyAct
                    username: janedoe
                  - id: ksiEKo23pz
                    createdAt: '2019-11-30T07:34:24.202Z'
                    modifiedAt: '2019-12-12T07:34:24.202Z'
                    name: MySecondAct
                    username: janedoe
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
