    DefaultRunOptions:
      title: DefaultRunOptions
      type: object
      description: The default settings applied to an Actor run. Can be overridden elsewhere.
      properties:
        build:
          type: string
          examples:
          - latest
          description: Which build to run. Either a build tag or a version number.
        timeoutSecs:
          type: integer
          examples:
          - 3600
          description: Timeout in seconds. 0 if no timeout.
        memoryMbytes:
          type: integer
          examples:
          - 2048
          description: In MB, the amount of memory allocated to the run.
        restartOnError:
          type: boolean
          examples:
          - false
          description: Whether to automatically restart the run if it fails.
        maxItems:
          type:
          - integer
          - 'null'
          description: Maximum number of items the run might produce.
        forcePermissionLevel:
          anyOf:
          - $ref: '#/components/schemas/ActorPermissionLevel'
          - type: 'null'
    CreateActorRequest:
      title: CreateActorRequest
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          examples:
          - instagram-scraper
          description: The identifier of the Actor. Use lowercase letters, numbers, and hyphens. Spaces or special characters aren't allowed. Must be unique across your account.
        description:
          type:
          - string
          - 'null'
          examples:
          - This scraper extracts posts and comments from Instagram.
          description: Short description of the Actor, displayed in Apify Store and Console.
        title:
          type:
          - string
          - 'null'
          examples:
          - Instagram scraper
          description: Human-readable name of the Actor, displayed in Apify Store and Console. Can contain spaces and capital letters. Recommended length is 40-50 characters. You can change this title without affecting the Actor's URL or SEO.
        isPublic:
          type: boolean
          examples:
          - false
          description: Whether the Actor is available to users in Apify Store. A new Actor is always private. To publish it, build it first, then update it with `isPublic` set to `true`.
        actorPermissionLevel:
          $ref: '#/components/schemas/ActorPermissionLevel'
        seoTitle:
          type:
          - string
          - 'null'
          examples:
          - Free Instagram scraper
          description: Name of the Actor to display by search engines such as Google. Can be different from the Actor's name displayed in Apify Store and Console. Recommended length is 40-50 characters.
        seoDescription:
          type:
          - string
          - 'null'
          examples:
          - The best scraper for Instagram
          description: Description of the Actor to display by search engines such as Google. Recommended length is 140-156 characters.
        restartOnError:
          type: boolean
          examples:
          - false
          deprecated: true
        versions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateVersionRequest'
          description: 'An array of `Version` objects. Each object represents a specific version of the Actor''s source code: its location, builds, and environment configuration.'
        categories:
          type:
          - array
          - 'null'
          examples:
          - - SOCIAL_MEDIA
          items:
            type: string
          description: A list of categories that best define the Actor. Reflected in Apify Store's search and filtering options.
        defaultRunOptions:
          $ref: '#/components/schemas/DefaultRunOptions'
        actorStandby:
          anyOf:
          - $ref: '#/components/schemas/ActorStandby'
          - type: 'null'
          description: The configuration of the Actor's standby mode. For details, see [Standby mode](https://docs.apify.com/platform/actors/development/programming-interface/standby).
        exampleRunInput:
          anyOf:
          - $ref: '#/components/schemas/ExampleRunInput'
          - type: 'null'
          description: Sample input payload that demonstrates what a typical run input for an Actor looks like. Used when no explicit input for a run is provided.
        isDeprecated:
          type:
          - boolean
          - 'null'
          description: Whether the Actor is deprecated.
    SourceCodeFileFormat:
      type: string
      enum:
      - BASE64
      - TEXT
      examples:
      - TEXT
    ActorList:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Actor'
            total:
              type: integer
            offset:
              type: integer
            limit:
              type: integer
    Actor:
      type: object
      description: An Apify Actor.
      properties:
        id:
          type: string
          description: Actor ID.
          example: mTD6bTz2HCjSQHeBn
        name:
          type: string
          description: Actor name.
          example: web-scraper
        username:
          type: string
          description: Owner username.
          example: apify
        title:
          type: string
          description: Display title.
          example: Web Scraper
        description:
          type: string
          description: Actor description.
    ActorDetail:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Actor'
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            type:
              type: string
            message:
              type: string
    Run:
      type: object
      description: An Apify Actor run.
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              example: HG7ML7M8z78YcAPEB
            actId:
              type: string
              example: mTD6bTz2HCjSQHeBn
            status:
              type: string
              enum:
              - READY
              - RUNNING
              - SUCCEEDED
              - FAILED
              - ABORTING
              - ABORTED
              - TIMING-OUT
              - TIMED-OUT
              example: RUNNING
            startedAt:
              type: string
              format: date-time
            finishedAt:
              type: string
              format: date-time
            defaultDatasetId:
              type: string
  responses:
    UnsupportedMediaType:
      description: Unsupported media type - the Content-Encoding of the request is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: unsupported-content-encoding
              message: Content-Encoding "bla" is not supported.
    MethodNotAllowed:
      description: Method not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: method-not-allowed
              message: 'This API end-point can only be accessed using the following HTTP methods: OPTIONS,GET'
    PayloadTooLarge:
      description: Payload too large - the request body exceeds the size limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: request-too-large
              message: 'The POST payload is too large (limit: 9437184 bytes, actual length: 10485760 bytes).'
    Forbidden:
      description: Forbidden - insufficient permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: insufficient-permissions
              message: You do not have permission to perform this action.
    BadRequest:
