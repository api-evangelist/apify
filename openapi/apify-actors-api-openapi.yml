    post:
      tags:
      - Actors
      summary: Create Actor
      description: 'Creates an Actor with the settings specified in an `Actor` object passed as

        JSON in the POST payload.


        Returns the created `Actor` object.


        In the HTTP request, set the `Content-Type` header to `application/json`.


        ### Define a source code version


        An Actor must specify at least one version of the source code.

        For details, see Actor versions.


        ### Publish an Actor


        To make your Actor public,

        use the Update Actor endpoint.'
      operationId: actors_post
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActorRequest'
            example:
              name: MyActor
              description: My favourite Actor!
              title: My Actor
              isPublic: false
              seoTitle: My Actor
              seoDescription: My Actor is the best
              versions:
              - versionNumber: '0.0'
                sourceType: SOURCE_FILES
                envVars:
                - name: DOMAIN
                  value: http://example.com
                  isSecret: false
                - name: SECRET_PASSWORD
                  value: MyTopSecretPassword123
                  isSecret: true
                applyEnvVarsToBuild: false
                buildTag: latest
                sourceFiles: []
              categories: []
              defaultRunOptions:
                build: latest
                timeoutSecs: 3600
                memoryMbytes: 2048
                restartOnError: false
        required: true
      responses:
