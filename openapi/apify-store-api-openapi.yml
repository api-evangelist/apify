openapi: 3.2.0
info:
  title: Apify Store API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: 'The Apify API (version 2) provides programmatic access to the Apify

    platform. The API is organized

    around RESTful

    HTTP endpoints. You can download the complete OpenAPI schema of Apify API in the YAML or JSON formats. The source code is also available on GitHub. All requests and responses (including errors) are encoded in

    JSON format with UTF-8 encoding,

    with a few exceptions that are explicitly described in the reference. To access the API, we recommend using one of our API clients:


    Stable API clients:

    - For Node.js, we recommend the `apify-client` NPM

    package. - For Python, we recommend the `apify-client` PyPI

    package. Experimental API clients:

    - For Java, we recommend the `apify-client` Maven central component. - For Rust, we recommend the `apify-client` crate. - For .NET, we recommend the `apify-client` Nuget package. - For PHP, we recommend the `apify-client` Packagist package. - For Go, we recommend the `apify-client` package. The clients'' functions correspond to the API endpoints and have the same

    parameters. This simplifies development of apps that depend on the Apify

    platform. :::note Important Request Details


    - `Content-Type` header: For requests with a JSON body, you must include the `Content-Type: application/json` header. - Method override: You can override the HTTP method using the `method` query parameter. This is useful for clients that can only send `GET` requests. For example, to call a `POST` endpoint, append `?method=POST` to the URL of your `GET` request. :::


    ## Authentication


    **You can find your API token on the

    Integrations page in the

    Apify Console.**


    To use your token in a request, either:


    - Add the token to your request''s `Authorization` header as `Bearer `. E.g., `Authorization: Bearer xxxxxxx`. More info. (Recommended). - Add it as the `token` parameter to your request URL. (Less secure). Using your token in the request header is more secure than using it as a URL

    parameter because URLs are often stored

    in browser history and server logs. This creates a chance for someone

    unauthorized to access your API token. **Never share your API token or password with untrusted parties!**


    For more information, see our

    integrations documentation. ### Agentic payments


    AI agents can authenticate and pay for Actor runs without an Apify account

    using agentic payments. Instead of an API token, the request carries a

    payment credential that both authorizes and pays for the call. Apify supports

    the x402 protocol

    (`PAYMENT-SIGNATURE` header) and

    Skyfire

    (`skyfire-pay-id` header). ## Basic usage


    To run an Actor, send a POST request to the Run

    Actor endpoint using either the

    Actor ID code (e.g. `vKg4IjxZbEYTYeW8T`) or its name (e.g. `janedoe~my-actor`):


    `https://api.apify.com/v2/actors/[actor_id]/runs`


    If the Actor is not runnable anonymously, you will receive a 401 or 403

    response code. This means you need to add your secret API

    token to the request''s

    `Authorization` header (recommended) or as a

    URL query parameter `?token=[your_token]` (less secure). Optionally, you can include the query parameters described in the Run

    Actor section to customize your

    run. If you''re using Node.js, the best way to run an Actor is using the

    `Apify.call()` method from the Apify

    SDK. It

    runs the Actor using the account you are currently logged into (determined

    by the secret API token). The result is an Actor run

    object and its output (if

    any). A typical workflow is as follows:


    1. Run an Actor or task using the Run

    Actor or Run

    task API endpoints. 2. Monitor the Actor run by periodically polling its progress using the Get

    run API

    endpoint. 3. Fetch the results from the Get

    items API endpoint using the

    `defaultDatasetId`, which you receive in the Run request response. Additional data may be stored in a key-value store. You can fetch them from

    the Get record API endpoint

    using the `defaultKeyValueStoreId` and the store''s `key`. **Note**: Instead of periodic polling, you can also run your

    Actor or

    task

    synchronously.'
  contact: {}
  version: v2-2026-10-08T073338Z
servers:
- url: https://api.apify.com
  variables: {}
security:
- httpBearer: []
- apiKey: []
tags:
- name: Store
  x-displayName: Get data from Apify Store
  x-legacy-doc-urls:
  - '#/reference/store'
  - '#tag/Store'
  - '#/reference/store/store-actors-collection'
  - '#tag/StoreStore-Actors-collection'
  description: 'Apify Store is home to thousands of public Actors available

    to the Apify community.

    The API endpoints described in this section are used to retrieve these Actors.


    :::note


    These endpoints do not require the authentication token.


    :::'
  x-trait: true
paths:
  /v2/store:
    get:
      tags:
      - Store
      summary: Get list of Actors in Store
      description: 'Gets the list of public Actors in Apify Store. You can use `search`

        parameter to search Actors by string in title, name, description, username

        and readme.

        If you need detailed info about a specific Actor, use the Get

        Actor endpoint.


        The endpoint supports pagination using the `limit` and `offset` parameters.

        It will not return more than 1,000 records.'
      operationId: store_get
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: search
        in: query
        description: 'String to search by. The search runs on the following fields: `title`,

          `name`, `description`, `username`, `readme`.

          '
        style: form
        explode: true
        schema:
          type: string
          example: web scraper
      - name: sortBy
        in: query
        description: 'Specifies the field by which to sort the results. The supported values

          are `relevance` (default), `popularity`, `newest` and `lastUpdate`.

          '
        style: form
        explode: true
        schema:
          type: string
          example: '''popularity'''
      - name: category
        in: query
        description: Filters the results by the specified category.
        style: form
        explode: true
        schema:
          type: string
          example: '''AI'''
      - name: username
        in: query
        description: Filters the results by the specified username.
        style: form
        explode: true
        schema:
          type: string
          example: '''apify'''
      - name: pricingModel
        in: query
        description: 'Only return Actors with the specified pricing model.

          '
        style: form
        explode: true
        schema:
          type: string
          enum:
          - FREE
          - FLAT_PRICE_PER_MONTH
          - PRICE_PER_DATASET_ITEM
          - PAY_PER_EVENT
          example: FREE
      - name: allowsAgenticUsers
        in: query
        description: 'If true, only return Actors that allow agentic users. If false, only

          return Actors that do not allow agentic users.

          '
        style: form
        explode: true
        schema:
          type: boolean
          example: true
      - name: responseFormat
        in: query
        description: 'Controls the shape of the response. Use `full` (default) for the

          complete response including image URLs and all fields. Use `agent`

          for a reduced field set optimized for LLM consumers, which only

          includes `id`, `title`, `name`, `username`, `description`, `notice`,

          `badge`, `categories`, and minimal `stats`.

          '
        style: form
        explode: true
        schema:
          type: string
          enum:
          - full
          - agent
          default: full
          example: agent
      - name: includeUnrunnableActors
        in: query
        description: 'By default, search results exclude Actors that are not safe to run

          automatically (e.g. Actors from developers who haven''t passed KYC, or

          full-permission Actors without a large user base). Set to `true` to

          bypass this safety filtering and include all Actors in the results.

          '
        style: form
        explode: true
        schema:
          type: boolean
          default: false
          example: true
      responses:
        '200':
          description: ''
          headers:
            X-Apify-Pagination-Offset:
              description: The offset of the first item in the current page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '0'
            X-Apify-Pagination-Limit:
              description: The maximum number of items returned per page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '100'
            X-Apify-Pagination-Count:
              description: The number of items returned in the current page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '100'
            X-Apify-Pagination-Total:
              description: The total number of items available.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '10204'
            X-Apify-Pagination-Desc:
              description: Whether the items are sorted in descending order.
              content:
                text/plain:
                  schema:
                    type: string
                  example: 'false'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfStoreActorsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/store/store-actors-collection/get-list-of-actors-in-store
      - https://docs.apify.com/api/v2#/reference/store/get-list-of-actors-in-store
      - https://docs.apify.com/api/v2#tag/StoreStore-Actors-collection/operation/store_get
components:
  parameters:
    offset:
      name: offset
      in: query
      description: 'Number of items that should be skipped at the start. The default value is `0`.

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 0
    limit:
      name: limit
      in: query
      description: 'Maximum number of items to return. The default value as well as the maximum is `1000`.

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 1000
  schemas:
    StoreActor:
      title: StoreActor
      required:
      - id
      - title
      - name
      - username
      - stats
      type: object
      properties:
        id:
          type: string
          examples:
          - zdc3Pyhyz3m8vjDeM
        title:
          type: string
          examples:
          - My Public Actor
        name:
          type: string
          examples:
          - my-public-actor
        username:
          type: string
          examples:
          - jane35
        userFullName:
          type:
          - string
          - 'null'
          examples:
          - Jane H. Doe
        description:
          type:
          - string
          - 'null'
          examples:
          - My public actor!
        categories:
          type: array
          items:
            type: string
          example:
          - MARKETING
          - LEAD_GENERATION
        notice:
          $ref: '#/components/schemas/ActorNotice'
        pictureUrl:
          type:
          - string
          - 'null'
          examples:
          - https://...
        userPictureUrl:
          type:
          - string
          - 'null'
          format: uri
          examples:
          - https://...
        url:
          type:
          - string
          - 'null'
          format: uri
          examples:
          - https://...
        stats:
          $ref: '#/components/schemas/ActorStats'
        currentPricingInfo:
          $ref: '#/components/schemas/CurrentPricingInfo'
        isWhiteListedForAgenticPayments:
          type:
          - boolean
          - 'null'
          description: Whether the Actor is whitelisted for agentic payment processing.
        actorReviewCount:
          type: integer
          examples:
          - 69
        actorReviewRating:
          type: number
          examples:
          - 4.7
        bookmarkCount:
          type: integer
          examples:
          - 1269
        badge:
          type:
          - string
          - 'null'
          examples:
          - null
        readmeSummary:
          type: string
          description: A brief, LLM-generated readme summary
    PaginationResponse:
      title: PaginationResponse
      description: Common pagination fields for list responses.
      required:
      - total
      - offset
      - limit
      - desc
      - count
      type: object
      properties:
        total:
          type: integer
          description: The total number of items available across all pages.
          minimum: 0
          examples:
          - 1
        offset:
          type: integer
          description: The starting position for this page of results.
          minimum: 0
          examples:
          - 0
        limit:
          type: integer
          description: The maximum number of items returned per page.
          minimum: 1
          examples:
          - 1000
        desc:
          type: boolean
          description: Whether the results are sorted in descending order.
          examples:
          - false
        count:
          type: integer
          description: The number of items returned in this response.
          minimum: 0
          examples:
          - 1
    ListOfStoreActors:
      title: ListOfStoreActors
      allOf:
      - $ref: '#/components/schemas/PaginationResponse'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/StoreActor'
    ErrorDetail:
      title: ErrorDetail
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ErrorType'
        message:
          type: string
          description: Human-readable error message describing what went wrong.
    CurrentPricingInfo:
      title: CurrentPricingInfo
      required:
      - pricingModel
      type: object
      properties:
        pricingModel:
          type: string
          examples:
          - FREE
        apifyMarginPercentage:
          type: number
          examples:
          - 0.2
          description: 'Apify''s share of the revenue generated under this pricing info record, as a fraction between 0 and 1. Set by the Apify platform.

            '
        createdAt:
          type: string
          format: date-time
          examples:
          - '2023-01-01T00:00:00.000Z'
        startedAt:
          type: string
          format: date-time
          examples:
          - '2023-01-01T00:00:00.000Z'
        notifiedAboutChangeAt:
          type:
          - string
          - 'null'
          format: date-time
          examples:
          - null
        notifiedAboutFutureChangeAt:
          type:
          - string
          - 'null'
          format: date-time
          examples:
          - null
        isPriceChangeNotificationSuppressed:
          type: boolean
          examples:
          - false
        forceContainsSignificantPriceChange:
          type: boolean
          examples:
          - false
        isPPEPlatformUsagePaidByUser:
          type: boolean
          examples:
          - false
        reasonForChange:
          type:
          - string
          - 'null'
          examples:
          - null
        trialMinutes:
          type:
          - integer
          - 'null'
          examples:
          - null
        unitName:
          type:
          - string
          - 'null'
          examples:
          - null
        pricePerUnitUsd:
          type:
          - number
          - 'null'
          examples:
          - null
        minimalMaxTotalChargeUsd:
          type:
          - number
          - 'null'
          examples:
          - 0.5
        pricingPerEvent:
          type:
          - object
          - 'null'
          description: Per-event pricing configuration for pay-per-event Actors.
          additionalProperties: true
    ErrorResponse:
      title: ErrorResponse
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ListOfStoreActorsResponse:
      title: ListOfStoreActorsResponse
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ListOfStoreActors'
      example:
        data:
          total: 100
          offset: 0
          limit: 1000
          desc: false
          count: 1
          items:
          - id: zdc3Pyhyz3m8vjDeM
            title: My Public Actor
            name: my-public-actor
            username: jane35
            userFullName: Jane Doe
            description: My public Actor!
            pictureUrl: https://...
            userPictureUrl: https://...
            url: https://...
            stats:
              totalBuilds: 9
              totalRuns: 16
              totalUsers: 6
              totalUsers7Days: 2
              totalUsers30Days: 6
              totalUsers90Days: 6
              totalMetamorphs: 2
              lastRunStartedAt: '2019-07-08T14:01:05.546Z'
            currentPricingInfo:
              pricingModel: FREE
            isWhiteListedForAgenticPayments: true
          - id: zdc3Pyhyz3m8vjDeM
            title: My Public Actor
            name: my-public-actor
            username: jane35
            userFullName: Jane H. Doe
            categories:
            - MARKETING
            - LEAD_GENERATION
            description: My public Actor!
            pictureUrl: https://...
            userPictureUrl: https://...
            url: https://...
            stats:
              totalBuilds: 9
              totalRuns: 16
              totalUsers: 6
              totalUsers7Days: 2
              totalUsers30Days: 6
              totalUsers90Days: 6
              totalMetamorphs: 2
              lastRunStartedAt: '2019-07-08T14:01:05.546Z'
            currentPricingInfo:
              pricingModel: FREE
            isWhiteListedForAgenticPayments: false
    ActorStats:
      title: ActorStats
      type: object
      description: Usage statistics and Apify Store metrics for the Actor.
      properties:
        totalBuilds:
          type: integer
          examples:
          - 9
          description: The total number of builds of the Actor.
        totalRuns:
          type: integer
          examples:
          - 16
          description: The total number of runs of the Actor.
        totalUsers:
          type: integer
          examples:
          - 6
          description: The total number of Actor users, including its owner.
        totalUsers7Days:
          type: integer
          examples:
          - 2
          description: The number of active users of the Actor in the last 7 days.
        totalUsers30Days:
          type: integer
          examples:
          - 6
          description: The number of active users of the Actor in the last 30 days.
        totalUsers90Days:
          type: integer
          examples:
          - 6
          description: The number of active users of the Actor in the last 90 days.
        totalMetamorphs:
          type: integer
          examples:
          - 2
          description: The total number of times a run of another Actor was [metamorphed](https://docs.apify.com/platform/actors/development/programming-interface/metamorph) into this Actor.
        lastRunStartedAt:
          type: string
          format: date-time
          examples:
          - '2019-07-08T14:01:05.546Z'
          description: The date and time the most recent run of the Actor started.
        actorReviewCount:
          type: integer
          examples:
          - 69
          description: The number of reviews the Actor has received in Apify Store.
        actorReviewRating:
          type: number
          examples:
          - 4.7
          description: The average rating of the Actor in Apify Store.
        bookmarkCount:
          type: integer
          examples:
          - 1269
          description: The number of users who bookmarked the Actor in Apify Store.
        publicActorRunStats30Days:
          type: object
          description: 'Run status counts from the last 30 days. Only for public Actors.

            Excludes runs started by the Actor''s owner.

            '
          properties:
            ABORTED:
              type: integer
              examples:
              - 2542
              description: The number of runs that were aborted.
            FAILED:
              type: integer
              examples:
              - 1234
              description: The number of runs that failed.
            SUCCEEDED:
              type: integer
              examples:
              - 732805
              description: The number of runs that succeeded.
            TIMED-OUT:
              type: integer
              examples:
              - 12556
              description: The number of runs that timed out.
            TOTAL:
              type: integer
              examples:
              - 749137
              description: The total number of runs.
    ErrorType:
      title: ErrorType
      type: string
      description: Machine-processable error type identifier.
      enum:
      - 3d-secure-auth-failed
      - access-right-already-exists
      - action-not-found
      - actor-already-rented
      - actor-can-not-be-rented
      - actor-disabled
