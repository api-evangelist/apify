    BuildStats:
      title: BuildStats
      type: object
      properties:
        durationMillis:
          type: integer
          examples:
          - 1000
        runTimeSecs:
          type: number
          examples:
          - 45.718
        computeUnits:
          type: number
          examples:
          - 0.0126994444444444
        imageSizeBytes:
          type:
          - integer
          - 'null'
          examples:
          - 975770223
    ErrorDetail:
      title: ErrorDetail
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ErrorType'
        message:
          type: string
          description: Human-readable error message describing what went wrong.
    BuildMeta:
      title: BuildMeta
      required:
      - origin
      type: object
      properties:
        origin:
          $ref: '#/components/schemas/RunOrigin'
        clientIp:
          type:
          - string
          description: IP address of the client that started the build.
          examples:
          - 172.234.12.34
        userAgent:
          type:
          - string
          description: User agent of the client that started the build.
          examples:
          - Mozilla/5.0 (iPad)
    Build:
      title: Build
      required:
      - id
      - actId
      - userId
      - startedAt
      - status
      - meta
      - buildNumber
      type: object
      properties:
        id:
          type: string
          examples:
          - HG7ML7M8z78YcAPEB
        actId:
          type: string
          examples:
          - janedoe~my-actor
        userId:
          type: string
          examples:
          - klmdEpoiojmdEMlk3
        startedAt:
          type: string
          format: date-time
          examples:
          - '2019-11-30T07:34:24.202Z'
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
          examples:
          - '2019-12-12T09:30:12.202Z'
        status:
          $ref: '#/components/schemas/ActorJobStatus'
        meta:
          $ref: '#/components/schemas/BuildMeta'
        stats:
          anyOf:
          - $ref: '#/components/schemas/BuildStats'
          - type: 'null'
        options:
          anyOf:
          - $ref: '#/components/schemas/BuildOptions'
          - type: 'null'
        usage:
          anyOf:
          - $ref: '#/components/schemas/BuildUsage'
          - type: 'null'
        usageTotalUsd:
          type:
          - number
          - 'null'
          examples:
          - 0.02
          description: Total cost in USD for this build. Requires authentication token to access.
        usageUsd:
          description: Platform usage costs breakdown in USD for this build. Requires authentication token to access.
          anyOf:
          - $ref: '#/components/schemas/BuildUsage'
          - type: 'null'
        inputSchema:
          type:
          - string
          - 'null'
          deprecated: true
          examples:
          - '{\n  "title": "Schema for ... }'
        readme:
          type:
          - string
          - 'null'
          deprecated: true
          examples:
          - '# Magic Actor\nThis Actor is magic.'
        buildNumber:
          type: string
          pattern: ^([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])(\.[1-9][0-9]{0,4})$
          examples:
          - 0.1.1
        imageDigest:
          type:
          - string
          - 'null'
          description: Digest of the built Docker image manifest, without the `sha256:` prefix. Compare digests of two builds to find out whether their image contents differ. `null` if the digest is not available.
          examples:
          - 1b2f1e8c0d5a4c7f9e3b6a2d8c4e0f7a5b9d3c1e6f8a2b4d0c7e9f1a3b5d7c9e
        actVersion:
          title: BuildActVersion
          type: object
          description: Snapshot of the Actor version that this build was created from.
          properties:
            sourceType:
              $ref: '#/components/schemas/VersionSourceType'
            buildTag:
              type: string
              examples:
              - experimental
            versionNumber:
              type: string
              pattern: ^([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])$
              examples:
              - '0.0'
            gitRepoUrl:
              type: string
              description: URL of the git repository, present when sourceType is GIT_REPO.
              examples:
              - https://github.com/apifytech/actor-crawler.git#experimental:web-scraper
            sourceFiles:
              type: array
              description: Inline source files, present when sourceType is SOURCE_FILES.
              items:
                $ref: '#/components/schemas/SourceCodeFile'
        actorDefinition:
          anyOf:
          - $ref: '#/components/schemas/ActorDefinition'
          - type: 'null'
      example:
        id: HG7ML7M8z78YcAPEB
        actId: janedoe~my-actor
        userId: klmdEpoiojmdEMlk3
        startedAt: '2019-11-30T07:34:24.202Z'
        finishedAt: '2019-12-12T09:30:12.202Z'
        status: SUCCEEDED
        meta:
          origin: WEB
          clientIp: 172.234.12.34
          userAgent: Mozilla/5.0 (iPad)
        stats:
          durationMillis: 1000
          runTimeSecs: 45.718
          computeUnits: 0.012699444444444444
        options:
          useCache: false
          betaPackages: false
          memoryMbytes: 1024
          diskMbytes: 2048
        usage:
          ACTOR_COMPUTE_UNITS: 0.08
        usageTotalUsd: 0.02
        usageUsd:
          ACTOR_COMPUTE_UNITS: 0.02
        inputSchema: '{\n  "title": "Schema for ..."}'
        readme: '# Magic Actor\nThis Actor is magic.'
        buildNumber: 0.1.1
        imageDigest: 1b2f1e8c0d5a4c7f9e3b6a2d8c4e0f7a5b9d3c1e6f8a2b4d0c7e9f1a3b5d7c9e
        actorDefinition:
          actorSpecification: 1
          name: example-actor
          version: '1.0'
          buildTag: latest
          environmentVariables:
            DEBUG_MODE: 'false'
          input:
            type: object
            properties:
              prompt:
                type: string
                description: The text prompt to generate completions for.
              maxTokens:
                type: integer
                description: The maximum number of tokens to generate.
            required:
            - prompt
          storages:
            dataset:
              type: object
              $schema: http://json-schema.org/draft-07/schema#
              properties:
                id:
                  type: string
                  description: Unique identifier for the generated text.
                text:
                  type: string
                  description: The generated text output from the model.
              required:
              - id
              - text
          minMemoryMbytes: 512
          maxMemoryMbytes: 2048
          usesStandbyMode: false
    SourceCodeFileFormat:
      type: string
      enum:
      - BASE64
      - TEXT
      examples:
      - TEXT
  parameters:
    buildId:
      name: buildId
      in: path
      description: ID of the build, found in the build's Info tab.
      required: true
      style: simple
      schema:
        type: string
        example: soSkq9ekdmfOslopH
    buildIdWithDefault:
      name: buildId
      in: path
      description: 'ID of the build, found in the build''s Info tab.

        Use the special value `default` to get the OpenAPI schema for the Actor''s default build.

        '
      required: true
      style: simple
      schema:
        type: string
        example: soSkq9ekdmfOslopH
    limit:
      name: limit
      in: query
      description: 'Maximum number of items to return. The default value as well as the maximum is `1000`.

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 1000
    descStartedAt:
      name: desc
      in: query
      description: 'If `true` or `1` then the objects are sorted by the `startedAt` field in

        descending order. By default, they are sorted in ascending order.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: true
    waitForFinishBuild:
      name: waitForFinish
      in: query
      description: 'The maximum number of seconds the server waits for the build to finish.

        By default it is `0`, the maximum value is `60`. <!-- MAX_ACTOR_JOB_ASYNC_WAIT_SECS -->

        If the build finishes in time then the returned build object will have a

        terminal status (e.g. `SUCCEEDED`), otherwise it will have a transitional status (e.g. `RUNNING`).

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 60
    offset:
      name: offset
      in: query
      description: 'Number of items that should be skipped at the start. The default value is `0`.

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 0
    download:
      name: download
      in: query
      description: 'If `true` or `1` then the web browser will download the log file rather than open it in a tab.

        '
      required: false
      style: form
      explode: true
      schema:
        type: boolean
        example: false
    stream:
      name: stream
      in: query
      description: 'If `true` or `1` then the logs will be streamed as long as the run or build is running.

        '
      required: false
      style: form
      explode: true
      schema:
        type: boolean
        example: false
