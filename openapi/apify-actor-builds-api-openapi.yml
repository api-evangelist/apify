openapi: 3.2.0
info:
  title: Apify Actor builds API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: 'The Apify API (version 2) provides programmatic access to the Apify

    platform. The API is organized

    around RESTful

    HTTP endpoints. You can download the complete OpenAPI schema of Apify API in the YAML or JSON formats. The source code is also available on GitHub. All requests and responses (including errors) are encoded in

    JSON format with UTF-8 encoding,

    with a few exceptions that are explicitly described in the reference. To access the API, we recommend using one of our API clients:


    Stable API clients:

    - For Node.js, we recommend the `apify-client` NPM

    package. - For Python, we recommend the `apify-client` PyPI

    package. Experimental API clients:

    - For Java, we recommend the `apify-client` Maven central component. - For Rust, we recommend the `apify-client` crate. - For .NET, we recommend the `apify-client` Nuget package. - For PHP, we recommend the `apify-client` Packagist package. - For Go, we recommend the `apify-client` package. The clients'' functions correspond to the API endpoints and have the same

    parameters. This simplifies development of apps that depend on the Apify

    platform. :::note Important Request Details


    - `Content-Type` header: For requests with a JSON body, you must include the `Content-Type: application/json` header. - Method override: You can override the HTTP method using the `method` query parameter. This is useful for clients that can only send `GET` requests. For example, to call a `POST` endpoint, append `?method=POST` to the URL of your `GET` request. :::


    ## Authentication


    **You can find your API token on the

    Integrations page in the

    Apify Console.**


    To use your token in a request, either:


    - Add the token to your request''s `Authorization` header as `Bearer `. E.g., `Authorization: Bearer xxxxxxx`. More info. (Recommended). - Add it as the `token` parameter to your request URL. (Less secure). Using your token in the request header is more secure than using it as a URL

    parameter because URLs are often stored

    in browser history and server logs. This creates a chance for someone

    unauthorized to access your API token. **Never share your API token or password with untrusted parties!**


    For more information, see our

    integrations documentation. ### Agentic payments


    AI agents can authenticate and pay for Actor runs without an Apify account

    using agentic payments. Instead of an API token, the request carries a

    payment credential that both authorizes and pays for the call. Apify supports

    the x402 protocol

    (`PAYMENT-SIGNATURE` header) and

    Skyfire

    (`skyfire-pay-id` header). ## Basic usage


    To run an Actor, send a POST request to the Run

    Actor endpoint using either the

    Actor ID code (e.g. `vKg4IjxZbEYTYeW8T`) or its name (e.g. `janedoe~my-actor`):


    `https://api.apify.com/v2/actors/[actor_id]/runs`


    If the Actor is not runnable anonymously, you will receive a 401 or 403

    response code. This means you need to add your secret API

    token to the request''s

    `Authorization` header (recommended) or as a

    URL query parameter `?token=[your_token]` (less secure). Optionally, you can include the query parameters described in the Run

    Actor section to customize your

    run. If you''re using Node.js, the best way to run an Actor is using the

    `Apify.call()` method from the Apify

    SDK. It

    runs the Actor using the account you are currently logged into (determined

    by the secret API token). The result is an Actor run

    object and its output (if

    any). A typical workflow is as follows:


    1. Run an Actor or task using the Run

    Actor or Run

    task API endpoints. 2. Monitor the Actor run by periodically polling its progress using the Get

    run API

    endpoint. 3. Fetch the results from the Get

    items API endpoint using the

    `defaultDatasetId`, which you receive in the Run request response. Additional data may be stored in a key-value store. You can fetch them from

    the Get record API endpoint

    using the `defaultKeyValueStoreId` and the store''s `key`. **Note**: Instead of periodic polling, you can also run your

    Actor or

    task

    synchronously.'
  contact: {}
  version: v2-2026-10-08T073338Z
servers:
- url: https://api.apify.com
  variables: {}
security:
- httpBearer: []
- apiKey: []
tags:
- name: Actor builds
  x-displayName: Manage Actor builds
  x-legacy-doc-urls:
  - '#/reference/actor-builds'
  - '#tag/Actor-builds'
  - '#/reference/actor-builds/build-collection'
  - '#tag/Actor-buildsBuild-collection'
  - '#/reference/actor-builds/build-object'
  - '#tag/Actor-buildsBuild-object'
  - '#tag/Actor-buildsDelete-build'
  - '#tag/Actor-buildsAbort-build'
  - '#/reference/actor-builds/build-log'
  - '#tag/Actor-buildsBuild-log'
  description: 'The API endpoints described in this section enable you to manage, and delete Apify Actor builds.


    Note that if any returned build object contains usage in dollars, your effective

    unit pricing at the time of query has been used for computation of this dollar equivalent, and hence it should be

    used only for informative purposes.


    You can learn more about platform usage in the documentation.'
paths:
  /v2/actor-builds:
    get:
      tags:
      - Actor builds
      summary: Get user builds list
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/actor-builds/build-collection/get-user-builds-list
      - https://docs.apify.com/api/v2#/reference/actor-builds/get-user-builds-list
      - https://docs.apify.com/api/v2#tag/Actor-buildsBuild-collection/operation/actorBuilds_get
      description: 'Gets a list of all builds for a user. The response is a JSON array of

        objects, where each object contains basic information about a single build.


        The endpoint supports pagination using the `limit` and `offset` parameters

        and it will not return more than 1000 records.


        By default, the records are sorted by the `startedAt` field in ascending

        order. Therefore, you can use pagination to incrementally fetch all builds while

        new ones are still being started. To sort the records in descending order, use

        the `desc=1` parameter.'
      operationId: actorBuilds_get
      parameters:
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/descStartedAt'
      responses:
        '200':
          description: ''
          headers:
            X-Apify-Pagination-Offset:
              description: The offset of the first item in the current page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '0'
            X-Apify-Pagination-Limit:
              description: The maximum number of items returned per page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '100'
            X-Apify-Pagination-Count:
              description: The number of items returned in the current page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '100'
            X-Apify-Pagination-Total:
              description: The total number of items available.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '10204'
            X-Apify-Pagination-Desc:
              description: Whether the items are sorted in descending order.
              content:
                text/plain:
                  schema:
                    type: string
                  example: 'false'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfBuildsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
  /v2/actor-builds/{buildId}:
    get:
      tags:
      - Actor builds
      summary: Get build
      description: 'Gets an object that contains all the details about a specific build of an

        Actor.


        By passing the optional `waitForFinish` parameter the API endpoint will

        synchronously wait for the build to finish. This is useful to avoid periodic

        polling when waiting for an Actor build to finish.


        This endpoint does not require the authentication token. Instead, calls are authenticated using a hard-to-guess ID of the build. However,

        if you access the endpoint without the token, certain attributes, such as `usageUsd` and `usageTotalUsd`, will be hidden.'
      operationId: actorBuild_get
      security: []
      parameters:
      - $ref: '#/components/parameters/buildId'
      - $ref: '#/components/parameters/waitForFinishBuild'
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/Timeout'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/actor-builds/build-object/get-build
      - https://docs.apify.com/api/v2#/reference/actor-builds/get-build
      - https://docs.apify.com/api/v2#tag/Actor-buildsBuild-object/operation/actorBuild_get
      x-js-parent: BuildClient
      x-js-name: get
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/BuildClient#get
      x-py-parent: BuildClientAsync
      x-py-name: get
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/BuildClientAsync#get
    delete:
      tags:
      - Actor builds
      summary: Delete build
      description: 'Delete the build. The build that is the current default build for the Actor

        cannot be deleted.


        Only users with build permissions for the Actor can delete builds.'
      operationId: actorBuild_delete
      parameters:
      - $ref: '#/components/parameters/buildId'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/actor-builds/delete-build/delete-build
      - https://docs.apify.com/api/v2#/reference/actor-builds/delete-build
      - https://docs.apify.com/api/v2#tag/Actor-builds/operation/actorBuild_delete
      x-js-parent: BuildClient
      x-js-name: delete
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/BuildClient#delete
  /v2/actor-builds/{buildId}/abort:
    post:
      tags:
      - Actor builds
      summary: Abort build
      description: 'Aborts an Actor build and returns an object that contains all the details

        about the build.


        Only builds that are starting or running are aborted. For builds with status

        `FINISHED`, `FAILED`, `ABORTING` and `TIMED-OUT` this call does nothing.'
      operationId: actorBuild_abort_post
      parameters:
      - $ref: '#/components/parameters/buildId'
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/actor-builds/abort-build/abort-build
      - https://docs.apify.com/api/v2#/reference/actor-builds/abort-build
      - https://docs.apify.com/api/v2#tag/Actor-buildsAbort-build/operation/actorBuild_abort_post
      x-js-parent: BuildClient
      x-js-name: abort
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/BuildClient#abort
      x-py-parent: BuildClientAsync
      x-py-name: abort
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/BuildClientAsync#abort
  /v2/actor-builds/{buildId}/log:
    get:
      responses:
        '200':
          description: ''
          headers: {}
          content:
            text/plain:
              schema:
                type: string
                example: '2017-07-14T06:00:49.733Z Application started.

                  2017-07-14T06:00:49.741Z Input: { test: 123 }

                  2017-07-14T06:00:49.752Z Some useful debug information follows.

                  '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Actor builds
      summary: Get build's Log
      description: 'Retrieves Actor build''s logs.


        This endpoint is a shortcut for getting the build''s log. Same as Get log endpoint.'
      operationId: actorBuild_log_get
      parameters:
      - $ref: '#/components/parameters/buildId'
      - $ref: '#/components/parameters/stream'
      - $ref: '#/components/parameters/download'
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/actor-builds/build-log/get-log
      - https://docs.apify.com/api/v2#/reference/actor-builds/get-log
      - https://docs.apify.com/api/v2#tag/Actor-buildsBuild-log/operation/actorBuild_log_get
  /v2/actor-builds/{buildId}/openapi.json:
    get:
      tags:
      - Actor builds
      summary: Get OpenAPI definition
      description: 'Get the OpenAPI definition for Actor builds. Two similar endpoints are available:


        - First endpoint: Requires both `actorId` and `buildId`. Use `default` as the `buildId` to get the OpenAPI schema for the default Actor build.

        - Second endpoint: Requires only `buildId`.


        Get the OpenAPI definition for a specific Actor build.

        Authentication is based on the build''s unique ID. No authentication token is required.


        :::note


        You can also use the `/api/v2/actor-openapi-json-get` endpoint to get the OpenAPI definition for a build.


        :::'
      operationId: actorBuild_openapi_json_get
      security: []
      parameters:
      - $ref: '#/components/parameters/buildIdWithDefault'
      responses:
        '200':
          description: The OpenAPI specification document for the Actor build.
          headers: {}
          content:
            application/json:
              schema:
                type: object
                description: A standard OpenAPI 3.x JSON document.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-js-parent: BuildClient
      x-js-name: getOpenApiDefinition
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/BuildClient#getOpenApiDefinition
      x-py-parent: BuildClient
      x-py-name: get_open_api_definition
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/BuildClient#get_open_api_definition
components:
  schemas:
    ActorDefinition:
      title: ActorDefinition
      description: The definition of the Actor, the full specification of this field can be found in [Apify docs](https://docs.apify.com/platform/actors/development/actor-definition/actor-json)
      type: object
      properties:
        actorSpecification:
          type: integer
          const: 1
          description: The Actor specification version that this Actor follows. This property must be set to 1.
        name:
          type: string
          description: The name of the Actor.
        version:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)+$
          description: The version of the Actor, typically a dot-separated sequence of numbers (e.g., `0.1`, `1.0`, or `0.0.1`).
        buildTag:
          type: string
          description: The tag name to be applied to a successful build of the Actor. Defaults to 'latest' if not specified.
        environmentVariables:
          type: object
          additionalProperties:
            type: string
          description: A map of environment variables to be used during local development and deployment.
        dockerfile:
          type: string
          description: The path to the Dockerfile used for building the Actor on the platform.
        dockerContextDir:
          type: string
          description: The path to the directory used as the Docker context when building the Actor.
        readme:
          type:
          - string
          - 'null'
          description: The path to the README file for the Actor.
        input:
          type:
          - object
          - 'null'
          description: The input schema object, the full specification can be found in [Apify docs](https://docs.apify.com/platform/actors/development/actor-definition/input-schema)
        changelog:
          type:
          - string
          - 'null'
          description: The path to the CHANGELOG file displayed in the Actor's information tab.
        storages:
          type: object
          properties:
            dataset:
              type: object
              description: Defines the schema of items in your dataset, the full specification can be found in [Apify docs](https://docs.apify.com/platform/actors/development/actor-definition/dataset-schema)
        defaultMemoryMbytes:
          oneOf:
          - type: string
            examples:
            - get(input
            - startUrls.length
            - 1) * 1024
          - type: integer
            examples:
            - 1024
          description: Specifies the default amount of memory in megabytes to be used when the Actor is started. Can be an integer or a [dynamic memory expression](/actors/development/actor-definition/dynamic-actor-memory).
        minMemoryMbytes:
          type: integer
          minimum: 128
          description: Specifies the minimum amount of memory in megabytes required by the Actor.
        maxMemoryMbytes:
          type: integer
          minimum: 128
          description: Specifies the maximum amount of memory in megabytes required by the Actor.
        usesStandbyMode:
          type: boolean
          description: Specifies whether Standby mode is enabled for the Actor.
    ErrorResponse:
      title: ErrorResponse
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    RunOrigin:
      title: RunOrigin
      type: string
      enum:
      - DEVELOPMENT
      - WEB
      - API
      - SCHEDULER
      - TEST
      - WEBHOOK
      - ACTOR
      - CLI
      - CI
      - STANDBY
      - MCP
    VersionSourceType:
      title: VersionSourceType
      enum:
      - SOURCE_FILES
      - GIT_REPO
      - TARBALL
      - GITHUB_GIST
      - SOURCE_CODE
      type: string
    SourceCodeFile:
      title: SourceCodeFile
      type: object
      description: Represents a single file in the Actor's source code.
      required:
      - name
      properties:
        format:
          $ref: '#/components/schemas/SourceCodeFileFormat'
          description: Format of the file's content, `TEXT` for plain text and `BASE64` for encoded content.
        content:
          type: string
          examples:
          - console.log('This is the main.js file');
          description: The contents of the file. Interpreted based on the value of `format`.
        name:
          type: string
          examples:
          - src/main.js
          description: The path of the file relative to the Actor's root directory.
    BuildOptions:
      title: BuildOptions
      type: object
      properties:
        useCache:
          type:
          - boolean
          - 'null'
          examples:
          - false
        betaPackages:
          type:
          - boolean
          - 'null'
          examples:
          - false
        memoryMbytes:
          type:
          - integer
          - 'null'
          examples:
          - 1024
        diskMbytes:
          type:
          - integer
          - 'null'
          examples:
          - 2048
    ListOfBuildsResponse:
      title: ListOfBuildsResponse
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/ListOfBuilds'
    BuildListItem:
      title: BuildListItem
      required:
      - id
      - status
      - startedAt
      - usageTotalUsd
      - buildNumber
      type: object
      properties:
        id:
          type: string
          examples:
          - HG7ML7M8z78YcAPEB
        actId:
          type: string
          examples:
          - janedoe~my-actor
        userId:
          type: string
          examples:
          - klmdEpoiojmdEMlk3
        status:
          $ref: '#/components/schemas/ActorJobStatus'
        startedAt:
          type: string
          format: date-time
          examples:
          - '2019-11-30T07:34:24.202Z'
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
          examples:
          - '2019-12-12T09:30:12.202Z'
        usageTotalUsd:
          type: number
          examples:
          - 0.02
        buildNumber:
          type: string
          pattern: ^([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])(\.[1-9][0-9]{0,4})$
          examples:
          - 0.1.1
        buildNumberInt:
          type: integer
          examples:
          - 10000
        meta:
          $ref: '#/components/schemas/BuildMeta'
    PaginationResponse:
      title: PaginationResponse
      description: Common pagination fields for list responses.
      required:
      - total
      - offset
      - limit
      - desc
      - count
      type: object
      properties:
        total:
          type: integer
          description: The total number of items available across all pages.
          minimum: 0
          examples:
          - 1
        offset:
          type: integer
          description: The starting position for this page of results.
          minimum: 0
          examples:
          - 0
        limit:
          type: integer
          description: The maximum number of items returned per page.
          minimum: 1
          examples:
          - 1000
        desc:
          type: boolean
          description: Whether the results are sorted in descending order.
          examples:
          - false
        count:
          type: integer
          description: The number of items returned in this response.
          minimum: 0
          examples:
          - 1
    ListOfBuilds:
      title: ListOfBuilds
      allOf:
      - $ref: '#/components/schemas/PaginationResponse'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/BuildListItem'
    BuildResponse:
      title: BuildResponse
      description: Response containing Actor build data.
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Build'
    ActorJobStatus:
      title: ActorJobStatus
      type: string
      enum:
      - READY
      - RUNNING
      - SUCCEEDED
      - FAILED
      - TIMING-OUT
      - TIMED-OUT
      - ABORTING
      - ABORTED
      description: Status of an Actor job (run or build).
    BuildUsage:
      title: BuildUsage
      type: object
      properties:
        ACTOR_COMPUTE_UNITS:
          type:
          - number
          - 'null'
          examples:
          - 0.08
    ErrorType:
      title: ErrorType
      type: string
      description: Machine-processable error type identifier.
      enum:
      - 3d-secure-auth-failed
      - access-right-already-exists
      - action-not-found
      - actor-already-rented
      - actor-can-not-be-rented
      - actor-disabled
      - actor-is-not-rented
      - actor-memory-limit-exceeded
      - actor-name-exists-new-owner
      - actor-name-not-unique
      - actor-not-found
      - actor-not-github-actor
      - actor-not-public
      - actor-permission-level-not-supported-for-agentic-payments
      - actor-review-already-exists
      - actor-run-failed
      - actor-standby-not-supported-for-agentic-payments
      - actor-task-name-not-unique
      - agentic-payment-info-retrieval-error
      - agentic-payment-information-missing
      - agentic-payment-insufficient-amount
      - agentic-payment-provider-internal-error
      - agentic-payment-provider-unauthorized
      - airtable-webhook-deprecated
      - already-subscribed-to-paid-actor
      - apify-plan-required-to-use-paid-actor
      - apify-signup-not-allowed
      - auth-method-not-supported
      - authorization-server-not-found
      - auto-issue-date-invalid
      - background-check-required
      - billing-system-error
      - black-friday-plan-expired
      - braintree-error
      - braintree-not-linked
      - braintree-operation-timed-out
      - braintree-unsupported-currency
      - build-not-found
      - build-outdated
      - cannot-add-apify-events-to-ppe-actor
