          $ref: '#/components/schemas/UserPublicInfo'
    AvailableProxyGroups:
      title: AvailableProxyGroups
      description: 'A dictionary mapping proxy group names to the number of available proxies in each group.

        The keys are proxy group names (e.g., "RESIDENTIAL", "DATACENTER") and values are

        the count of available proxies.

        '
      type: object
      additionalProperties:
        type: integer
        description: The number of available proxies in this group.
      example:
        RESIDENTIAL: 1000
        DATACENTER: 500
        GOOGLE_SERP: 200
    ProxyGroup:
      title: ProxyGroup
      required:
      - name
      - description
      - availableCount
      type: object
      properties:
        name:
          type: string
          examples:
          - Group1
        description:
          type:
          - string
          - 'null'
          examples:
          - Group1 description
        availableCount:
          type: integer
          examples:
          - 10
    EffectivePlatformFeature:
      title: EffectivePlatformFeature
      required:
      - isEnabled
      - disabledReason
      - disabledReasonType
      - isTrial
      - trialExpirationAt
      type: object
      properties:
        isEnabled:
          type: boolean
          examples:
          - true
        disabledReason:
          type:
          - string
          - 'null'
          examples:
          - The "Selected public Actors for developers" feature is not enabled for your account. Please upgrade your plan or contact support@apify.com
        disabledReasonType:
          type:
          - string
          - 'null'
          examples:
          - DISABLED
        isTrial:
          type: boolean
          examples:
          - false
        trialExpirationAt:
          type:
          - string
          - 'null'
          format: date-time
          examples:
          - '2025-01-01T14:00:00.000Z'
    ErrorDetail:
      title: ErrorDetail
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ErrorType'
        message:
          type: string
          description: Human-readable error message describing what went wrong.
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            type:
              type: string
            message:
              type: string
    User:
      type: object
      description: An Apify user account.
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              example: wRsJZtadYvn4mBZmm
            username:
              type: string
              example: jsmith
            email:
              type: string
              format: email
              example: jsmith@example.com
            plan:
              type: string
              enum:
              - FREE
              - STARTER
              - SCALE
              - BUSINESS
              - ENTERPRISE
              example: STARTER
  responses:
    MethodNotAllowed:
      description: Method not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: method-not-allowed
              message: 'This API end-point can only be accessed using the following HTTP methods: OPTIONS,GET'
    Forbidden:
      description: Forbidden - insufficient permissions to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: insufficient-permissions
              message: You do not have permission to perform this action.
    BadRequest:
      description: Bad request - invalid input parameters or request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: invalid-input
              message: 'Invalid input: The request body contains invalid data.'
    NotFound:
      description: Not found - the requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: record-not-found
              message: The requested resource was not found.
    Unauthorized:
      description: Unauthorized - authentication required or invalid token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: invalid-token
              message: Authentication token is not valid.
    TooManyRequests:
      description: Too many requests - rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: rate-limit-exceeded
              message: You have exceeded the rate limit. Please try again later.
    Unauthorized_2:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    httpBearer:
      type: http
      scheme: bearer
      description: 'Bearer token provided in the `Authorization` header (e.g., `Authorization: Bearer your_token`—recommended). [More info](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Authorization).


        Use your API token to authenticate requests. You can find it on the [Integrations page](https://console.apify.com/account#/integrations) in Apify Console. This method is more secure than query parameters, as headers are not logged in browser history or server logs.


        :::danger Security


        Do not share your API token (or account password) with untrusted parties.


        :::


        _When is authentication required?_

        - _Required_ for private Actors, tasks, or resources (e.g., builds of private Actors).

        - _Required_ when using named formats for IDs (e.g., `username~store-name` for stores or `username~queue-name` for queues).

        - _Optional_ for public Actors or resources (e.g., builds of public Actors can be queried without a token).


        For more information, see our [integrations documentation](https://docs.apify.com/platform/integrations).'
    apiKey:
      type: apiKey
      name: token
      in: query
      description: 'API token provided as a query parameter (e.g., `?token=your_token`—less secure).


        Use your API token to authenticate requests. You can find it on the [Integrations page](https://console.apify.com/account#/integrations) in Apify Console.


        :::danger Security


        Do not share your API token (or account password) with untrusted parties.


        :::


        _When is authentication required?_

        - _Required_ for private Actors, tasks, or resources (e.g., builds of private Actors).

        - _Required_ when using named formats for IDs (e.g., `username~store-name` for stores or `username~queue-name` for queues).

        - _Optional_ for public Actors or resources (e.g., builds of public Actors can be queried without a token).


        For more information, see our [integrations documentation](https://docs.apify.com/platform/integrations).'
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token from Apify console Settings > Integrations.
