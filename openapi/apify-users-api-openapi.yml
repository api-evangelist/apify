openapi: 3.2.0
info:
  title: Apify Users API
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Users across 2 of this provider''s published API definitions: apify-openapi.json, apify-api.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.apify.com
  variables: {}
- url: https://api.apify.com/v2
  description: Apify Production API
tags:
- name: Users
  x-displayName: Get user data
  x-legacy-doc-urls:
  - '#/reference/users'
  - '#tag/Users'
  - '#/reference/users/public-data'
  - '#tag/UsersPublic-data'
  - '#/reference/users/private-data'
  - '#tag/UsersPrivate-data'
  - '#/reference/users/monthly-usage'
  - '#tag/UsersMonthly-usage'
  - '#/reference/users/account-and-usage-limits'
  - '#tag/UsersAccount-and-usage-limits'
  description: 'The API endpoints described in this section return information about

    user accounts.'
  x-trait: true
paths:
  /v2/users/{userId}:
    get:
      tags:
      - Users
      summary: Get public user data
      description: 'Returns public information about a specific user account, similar to what

        can be seen on public profile pages (e.g. https://apify.com/apify).


        This operation requires no authentication token.'
      operationId: user_get
      parameters:
      - name: userId
        in: path
        description: User ID or username.
        required: true
        style: simple
        schema:
          type: string
          example: HGzIk8z78YcAPEB
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublicInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/users/public-data/get-public-user-data
      - https://docs.apify.com/api/v2#/reference/users/get-public-user-data
      - https://docs.apify.com/api/v2#tag/UsersPublic-data/operation/user_get
      security:
      - httpBearer: []
      - apiKey: []
    servers:
    - url: https://api.apify.com
      variables: {}
  /v2/users/me:
    get:
      tags:
      - Users
      summary: Get private user data
      description: 'Returns information about the current user account, including both public

        and private information.


        The user account is identified by the provided authentication token.


        The fields `plan`, `email` and `profile` are omitted when this endpoint is accessed from Actor run.'
      operationId: users_me_get
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPrivateInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/users/private-data/get-private-user-data
      - https://docs.apify.com/api/v2#/reference/users/get-private-user-data
      - https://docs.apify.com/api/v2#tag/UsersPrivate-data/operation/users_me_get
      security:
      - httpBearer: []
      - apiKey: []
    servers:
    - url: https://api.apify.com
      variables: {}
  /users/me:
    get:
      operationId: getMe
      summary: Apify Get Current User
      description: Returns information about the authenticated user.
      tags:
      - Users
      responses:
        '200':
          description: Current user details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                GetMe200Example:
                  summary: Default getMe 200 response
                  x-microcks-default: true
                  value:
                    data:
                      id: wRsJZtadYvn4mBZmm
                      username: jsmith
                      email: jsmith@example.com
                      plan: STARTER
        '401':
          $ref: '#/components/responses/Unauthorized_2'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - bearerAuth: []
    servers:
    - url: https://api.apify.com/v2
      description: Apify Production API
components:
  schemas:
    UserPlan:
      title: UserPlan
      required:
      - availableProxyGroups
      type: object
      properties:
        id:
          type: string
          examples:
          - Personal
        description:
          type: string
          examples:
          - Cost-effective plan for freelancers, developers and students.
        isEnabled:
          type: boolean
          examples:
          - true
        monthlyBasePriceUsd:
          type: number
          examples:
          - 49
        monthlyUsageCreditsUsd:
          type: number
          examples:
          - 49
        usageDiscountPercent:
          type: number
          examples:
          - 0
        enabledPlatformFeatures:
          type: array
          items:
            type: string
          example:
          - ACTORS
          - STORAGE
          - PROXY_SERPS
          - SCHEDULER
          - WEBHOOKS
        maxMonthlyUsageUsd:
          type: number
          examples:
          - 9999
        maxActorMemoryGbytes:
          type: number
          examples:
          - 32
        maxMonthlyActorComputeUnits:
          type: number
          examples:
          - 1000
        maxMonthlyResidentialProxyGbytes:
          type: number
          examples:
          - 10
        maxMonthlyProxySerps:
          type: integer
          examples:
          - 30000
        maxMonthlyExternalDataTransferGbytes:
          type: number
          examples:
          - 1000
        maxActorCount:
          type: integer
          examples:
          - 100
        maxActorTaskCount:
          type: integer
          examples:
          - 1000
        dataRetentionDays:
          type: integer
          examples:
          - 14
        availableProxyGroups:
          $ref: '#/components/schemas/AvailableProxyGroups'
        teamAccountSeatCount:
          type: integer
          examples:
          - 1
        supportLevel:
          type: string
          examples:
          - COMMUNITY
        availableAddOns:
          type: array
          items:
            type: string
          examples:
          - []
        tier:
          type: string
          examples:
          - FREE
        apiRateLimitBoosts:
          type: integer
          examples:
          - 0
        maxScheduleCount:
          type: integer
          examples:
          - 100
        maxConcurrentActorRuns:
          type: integer
          examples:
          - 25
        planPricing:
          type: object
          description: Pricing details for this plan.
          additionalProperties: true
    ErrorResponse:
      title: ErrorResponse
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    UserPublicInfo:
      title: UserPublicInfo
      required:
      - username
      type: object
      properties:
        username:
          type: string
          examples:
          - d7b9MDYsbtX5L7XAj
        profile:
          $ref: '#/components/schemas/UserProfile'
    UserProfile:
      title: UserProfile
      type: object
      properties:
        bio:
          type:
          - string
          - 'null'
          examples:
          - I started web scraping in 1985 using Altair BASIC.
        readme:
          type:
          - string
          - 'null'
          description: Markdown README shown on the user's public profile page.
          examples:
          - '### Hello world 👋🏻

            I build web scrapers.'
        name:
          type: string
          examples:
          - Jane Doe
        pictureUrl:
          type:
          - string
          - 'null'
          format: uri
          examples:
          - https://apify.com/img/anonymous_user_picture.png
        githubUsername:
          type:
          - string
          - 'null'
          examples:
          - torvalds.
        websiteUrl:
          type:
          - string
          - 'null'
          format: uri
          examples:
          - http://www.example.com
        twitterUsername:
          type:
          - string
          - 'null'
          examples:
          - '@BillGates'
    EffectivePlatformFeatures:
      title: EffectivePlatformFeatures
      required:
      - ACTORS
      - STORAGE
      - SCHEDULER
      - PROXY
      - PROXY_EXTERNAL_ACCESS
      - PROXY_RESIDENTIAL
      - PROXY_SERPS
      - WEBHOOKS
      - ACTORS_PUBLIC_ALL
      - ACTORS_PUBLIC_DEVELOPER
      type: object
      properties:
        ACTORS:
          $ref: '#/components/schemas/EffectivePlatformFeature'
        STORAGE:
          $ref: '#/components/schemas/EffectivePlatformFeature'
        SCHEDULER:
          $ref: '#/components/schemas/EffectivePlatformFeature'
        PROXY:
          $ref: '#/components/schemas/EffectivePlatformFeature'
        PROXY_EXTERNAL_ACCESS:
          $ref: '#/components/schemas/EffectivePlatformFeature'
        PROXY_RESIDENTIAL:
          $ref: '#/components/schemas/EffectivePlatformFeature'
        PROXY_SERPS:
          $ref: '#/components/schemas/EffectivePlatformFeature'
        WEBHOOKS:
          $ref: '#/components/schemas/EffectivePlatformFeature'
        ACTORS_PUBLIC_ALL:
          $ref: '#/components/schemas/EffectivePlatformFeature'
        ACTORS_PUBLIC_DEVELOPER:
          $ref: '#/components/schemas/EffectivePlatformFeature'
    UserPrivateInfo:
      title: UserPrivateInfo
      required:
      - username
      type: object
      properties:
        id:
          type: string
          examples:
          - YiKoxjkaS9gjGTqhF
        username:
          type: string
          examples:
          - myusername
        profile:
          $ref: '#/components/schemas/UserProfile'
        email:
          type: string
          format: email
          examples:
          - bob@example.com
        proxy:
          $ref: '#/components/schemas/ProxyResource'
        plan:
          $ref: '#/components/schemas/UserPlan'
        effectivePlatformFeatures:
          $ref: '#/components/schemas/EffectivePlatformFeatures'
        createdAt:
          type: string
          format: date-time
          examples:
          - '2022-11-29T14:48:29.381Z'
        isPaying:
          type: boolean
          examples:
          - true
    ProxyResource:
      title: ProxyResource
      required:
      - password
      - groups
      type: object
      properties:
        password:
          type: string
          examples:
          - ad78knd9Jkjd86
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ProxyGroup'
