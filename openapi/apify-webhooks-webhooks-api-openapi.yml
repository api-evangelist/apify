openapi: 3.2.0
info:
  title: Apify Webhooks/Webhooks API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: 'The Apify API (version 2) provides programmatic access to the Apify

    platform. The API is organized

    around RESTful

    HTTP endpoints. You can download the complete OpenAPI schema of Apify API in the YAML or JSON formats. The source code is also available on GitHub. All requests and responses (including errors) are encoded in

    JSON format with UTF-8 encoding,

    with a few exceptions that are explicitly described in the reference. To access the API, we recommend using one of our API clients:


    Stable API clients:

    - For Node.js, we recommend the `apify-client` NPM

    package. - For Python, we recommend the `apify-client` PyPI

    package. Experimental API clients:

    - For Java, we recommend the `apify-client` Maven central component. - For Rust, we recommend the `apify-client` crate. - For .NET, we recommend the `apify-client` Nuget package. - For PHP, we recommend the `apify-client` Packagist package. - For Go, we recommend the `apify-client` package. The clients'' functions correspond to the API endpoints and have the same

    parameters. This simplifies development of apps that depend on the Apify

    platform. :::note Important Request Details


    - `Content-Type` header: For requests with a JSON body, you must include the `Content-Type: application/json` header. - Method override: You can override the HTTP method using the `method` query parameter. This is useful for clients that can only send `GET` requests. For example, to call a `POST` endpoint, append `?method=POST` to the URL of your `GET` request. :::


    ## Authentication


    **You can find your API token on the

    Integrations page in the

    Apify Console.**


    To use your token in a request, either:


    - Add the token to your request''s `Authorization` header as `Bearer `. E.g., `Authorization: Bearer xxxxxxx`. More info. (Recommended). - Add it as the `token` parameter to your request URL. (Less secure). Using your token in the request header is more secure than using it as a URL

    parameter because URLs are often stored

    in browser history and server logs. This creates a chance for someone

    unauthorized to access your API token. **Never share your API token or password with untrusted parties!**


    For more information, see our

    integrations documentation. ### Agentic payments


    AI agents can authenticate and pay for Actor runs without an Apify account

    using agentic payments. Instead of an API token, the request carries a

    payment credential that both authorizes and pays for the call. Apify supports

    the x402 protocol

    (`PAYMENT-SIGNATURE` header) and

    Skyfire

    (`skyfire-pay-id` header). ## Basic usage


    To run an Actor, send a POST request to the Run

    Actor endpoint using either the

    Actor ID code (e.g. `vKg4IjxZbEYTYeW8T`) or its name (e.g. `janedoe~my-actor`):


    `https://api.apify.com/v2/actors/[actor_id]/runs`


    If the Actor is not runnable anonymously, you will receive a 401 or 403

    response code. This means you need to add your secret API

    token to the request''s

    `Authorization` header (recommended) or as a

    URL query parameter `?token=[your_token]` (less secure). Optionally, you can include the query parameters described in the Run

    Actor section to customize your

    run. If you''re using Node.js, the best way to run an Actor is using the

    `Apify.call()` method from the Apify

    SDK. It

    runs the Actor using the account you are currently logged into (determined

    by the secret API token). The result is an Actor run

    object and its output (if

    any). A typical workflow is as follows:


    1. Run an Actor or task using the Run

    Actor or Run

    task API endpoints. 2. Monitor the Actor run by periodically polling its progress using the Get

    run API

    endpoint. 3. Fetch the results from the Get

    items API endpoint using the

    `defaultDatasetId`, which you receive in the Run request response. Additional data may be stored in a key-value store. You can fetch them from

    the Get record API endpoint

    using the `defaultKeyValueStoreId` and the store''s `key`. **Note**: Instead of periodic polling, you can also run your

    Actor or

    task

    synchronously.'
  contact: {}
  version: v2-2026-10-08T073338Z
servers:
- url: https://api.apify.com
  variables: {}
security:
- httpBearer: []
- apiKey: []
tags:
- name: Webhooks/Webhooks
  x-displayName: Webhooks
  x-parent-tag-name: Webhooks
  x-legacy-doc-urls:
  - '#/reference/webhooks'
  - '#tag/Webhooks'
  - '#/reference/webhooks/webhook-collection'
  - '#tag/WebhooksWebhook-collection'
  - '#/reference/webhooks/webhook-object'
  - '#tag/WebhooksWebhook-object'
  - '#/reference/webhooks/webhook-test'
  - '#tag/WebhooksWebhook-test'
  - '#/reference/webhooks/dispatches-collection'
  - '#tag/WebhooksDispatches-collection'
  description: 'This section describes API endpoints to manage webhooks.


    Webhooks provide an easy and reliable way to configure the Apify platform

    to carry out an action (e.g. a HTTP request to another service) when a certain

    system event occurs.

    For example, you can use webhooks to start another Actor when an Actor run finishes

    or fails.


    For more information see Webhooks documentation.'
paths:
  /v2/webhooks:
    get:
      tags:
      - Webhooks/Webhooks
      summary: Get list of webhooks
      description: 'Gets the list of webhooks that the user created.


        The endpoint supports pagination using the `limit` and `offset` parameters

        and it will not return more than 1000 records.

        By default, the records are sorted by the `createdAt` field in ascending

        order. To sort the records in descending order, use the `desc=1`

        parameter.'
      operationId: webhooks_get
      parameters:
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/descCreatedAt'
      responses:
        '200':
          description: ''
          headers:
            X-Apify-Pagination-Offset:
              description: The offset of the first item in the current page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '0'
            X-Apify-Pagination-Limit:
              description: The maximum number of items returned per page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '100'
            X-Apify-Pagination-Count:
              description: The number of items returned in the current page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '100'
            X-Apify-Pagination-Total:
              description: The total number of items available.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '10204'
            X-Apify-Pagination-Desc:
              description: Whether the items are sorted in descending order.
              content:
                text/plain:
                  schema:
                    type: string
                  example: 'false'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfWebhooksResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/webhooks/webhook-collection/get-list-of-webhooks
      - https://docs.apify.com/api/v2#/reference/webhooks/get-list-of-webhooks
      - https://docs.apify.com/api/v2#tag/WebhooksWebhook-collection/operation/webhooks_get
      x-js-parent: WebhookCollectionClient
      x-js-name: list
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/WebhookCollectionClient#list
      x-py-parent: WebhookCollectionClientAsync
      x-py-name: list
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/WebhookCollectionClientAsync#list
    post:
      tags:
      - Webhooks/Webhooks
      summary: Create webhook
      description: 'Creates a new webhook with settings provided by the webhook object passed as

        JSON in the payload.

        The response is the created webhook object.


        To avoid duplicating a webhook, use the `idempotencyKey` parameter in the

        request body.

        Multiple calls to create a webhook with the same `idempotencyKey` will only

        create the webhook with the first call and return the existing webhook on

        subsequent calls.

        Idempotency keys must be unique, so use a UUID or another random string with

        enough entropy.


        To assign the new webhook to an Actor or task, the request body must contain

        `requestUrl`, `eventTypes`, and `condition` properties.


        * `requestUrl` is the webhook''s target URL, to which data is sent as a POST

        request with a JSON payload.

        * `eventTypes` is a list of events that will trigger the webhook, e.g. when

        the Actor run succeeds.

        * `condition` should be an object containing the ID of the Actor or task to

        which the webhook will be assigned.

        * `payloadTemplate` is a JSON-like string, whose syntax is extended with the

        use of variables.

        * `headersTemplate` is a JSON-like string, whose syntax is extended with the

        use of variables. Following values will be re-written to defaults: "host",

        "Content-Type", "X-Apify-Webhook", "X-Apify-Webhook-Dispatch-Id",

        "X-Apify-Request-Origin"

        * `description` is an optional string.

        * `shouldInterpolateStrings` is a boolean indicating whether to interpolate

        variables contained inside strings in the `payloadTemplate`


        ```

        "isAdHoc" : false,

        "requestUrl" : "https://example.com",

        "eventTypes" : [

        "ACTOR.RUN.SUCCEEDED",

        "ACTOR.RUN.ABORTED"

        ],

        "condition" : {

        "actorId": "5sTMwDQywwsLzKRRh",

        "actorTaskId" : "W9bs9JE9v7wprjAnJ"

        },

        "payloadTemplate": "",

        "headersTemplate": "",

        "description": "my awesome webhook",

        "shouldInterpolateStrings": false,

        ```


        **Important**: The request must specify the `Content-Type: application/json`

        HTTP header.'
      operationId: webhooks_post
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
        required: true
      responses:
        '201':
          description: ''
          headers:
            Location:
              content:
                text/plain:
                  schema:
                    type: string
                  example: https://api.apify.com/v2/webhook/zdc3Pyhyz3m8vjDeM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/webhooks/webhook-collection/create-webhook
      - https://docs.apify.com/api/v2#/reference/webhooks/create-webhook
      - https://docs.apify.com/api/v2#tag/WebhooksWebhook-collection/operation/webhooks_post
      x-js-parent: WebhookCollectionClient
      x-js-name: create
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/WebhookCollectionClient#create
      x-py-parent: WebhookCollectionClientAsync
      x-py-name: create
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/WebhookCollectionClientAsync#create
  /v2/webhooks/{webhookId}:
    get:
      tags:
      - Webhooks/Webhooks
      summary: Get webhook
      description: Gets webhook object with all details.
      operationId: webhook_get
      parameters:
      - $ref: '#/components/parameters/webhookId'
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/webhooks/webhook-object/get-webhook
      - https://docs.apify.com/api/v2#/reference/webhooks/get-webhook
      - https://docs.apify.com/api/v2#tag/WebhooksWebhook-object/operation/webhook_get
      x-js-parent: WebhookClient
      x-js-name: get
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/WebhookClient#get
      x-py-parent: WebhookClientAsync
      x-py-name: get
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/WebhookClientAsync#get
    put:
      tags:
      - Webhooks/Webhooks
      summary: Update webhook
      description: 'Updates a webhook using values specified by a webhook object passed as JSON

        in the POST payload.

        If the object does not define a specific property, its value will not be

        updated.


        The response is the full webhook object as returned by the

        Get webhook endpoint.


        The request needs to specify the `Content-Type: application/json` HTTP

        header!


        When providing your API authentication token, we recommend using the

        request''s `Authorization` header, rather than the URL. (More

        info).'
      operationId: webhook_put
      parameters:
      - $ref: '#/components/parameters/webhookId'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/webhooks/webhook-object/update-webhook
      - https://docs.apify.com/api/v2#/reference/webhooks/update-webhook
      - https://docs.apify.com/api/v2#tag/WebhooksWebhook-object/operation/webhook_put
      x-js-parent: WebhookClient
      x-js-name: update
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/WebhookClient#update
      x-py-parent: WebhookClientAsync
      x-py-name: update
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/WebhookClientAsync#update
    delete:
      tags:
      - Webhooks/Webhooks
      summary: Delete webhook
      description: Deletes a webhook.
      operationId: webhook_delete
      parameters:
      - $ref: '#/components/parameters/webhookId'
      responses:
        '204':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
              example: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/webhooks/webhook-object/delete-webhook
      - https://docs.apify.com/api/v2#/reference/webhooks/delete-webhook
      - https://docs.apify.com/api/v2#tag/WebhooksWebhook-object/operation/webhook_delete
      x-js-parent: WebhookClient
      x-js-name: delete
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/WebhookClient#delete
  /v2/webhooks/{webhookId}/test:
    post:
      tags:
      - Webhooks/Webhooks
      summary: Test webhook
      description: Tests a webhook. Creates a webhook dispatch with a dummy payload.
      operationId: webhook_test_post
      parameters:
      - $ref: '#/components/parameters/webhookId'
      responses:
        '201':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDispatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/webhooks/webhook-test/test-webhook
      - https://docs.apify.com/api/v2#/reference/webhooks/test-webhook
      - https://docs.apify.com/api/v2#tag/WebhooksWebhook-test/operation/webhook_test_post
      x-js-parent: WebhookClient
      x-js-name: test
      x-js-doc-url: https://docs.apify.com/api/client/js/reference/class/WebhookClient#test
      x-py-parent: WebhookClientAsync
      x-py-name: test
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/WebhookClientAsync#test
  /v2/webhooks/{webhookId}/dispatches:
    get:
      tags:
      - Webhooks/Webhooks
      summary: Get collection
      description: Gets a given webhook's list of dispatches.
      operationId: webhook_webhookDispatches_get
      parameters:
      - $ref: '#/components/parameters/webhookId'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/descCreatedAt'
      responses:
        '200':
          description: ''
          headers:
            X-Apify-Pagination-Offset:
              description: The offset of the first item in the current page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '0'
            X-Apify-Pagination-Limit:
              description: The maximum number of items returned per page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '100'
            X-Apify-Pagination-Count:
              description: The number of items returned in the current page.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '100'
            X-Apify-Pagination-Total:
              description: The total number of items available.
              content:
                text/plain:
                  schema:
                    type: string
                  example: '10204'
            X-Apify-Pagination-Desc:
              description: Whether the items are sorted in descending order.
              content:
                text/plain:
                  schema:
                    type: string
                  example: 'false'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfWebhookDispatchesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/webhooks/dispatches-collection/get-collection
      - https://docs.apify.com/api/v2#/reference/webhooks/get-collection
      - https://docs.apify.com/api/v2#tag/WebhooksDispatches-collection/operation/webhook_dispatches_get
      x-py-parent: WebhookClientAsync
      x-py-name: dispatches
      x-py-doc-url: https://docs.apify.com/api/client/python/reference/class/WebhookClientAsync#dispatches
components:
  schemas:
    WebhookDispatchStatus:
      title: WebhookDispatchStatus
      type: string
      enum:
      - ACTIVE
      - SUCCEEDED
      - FAILED
      description: Status of the webhook dispatch indicating whether the HTTP request was successful.
    ListOfWebhooksResponse:
      title: ListOfWebhooksResponse
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ListOfWebhooks'
    ErrorResponse:
      title: ErrorResponse
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ListOfWebhookDispatches:
      title: ListOfWebhookDispatches
      allOf:
      - $ref: '#/components/schemas/PaginationResponse'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/WebhookDispatch'
    WebhookDispatchWebhookSummary:
      title: WebhookDispatchWebhookSummary
      description: A summary of the webhook that triggered this dispatch.
      type: object
      properties:
        actionType:
          type: string
          examples:
          - HTTP_REQUEST
        condition:
          $ref: '#/components/schemas/WebhookCondition'
        requestUrl:
          type:
          - string
          - 'null'
          format: uri
          description: URL of the HTTP request sent by the webhook. It is `null` for hook actions other than the conventional HTTP case (e.g. Slack or email notifications).
          examples:
          - https://example.com/webhook
        isAdHoc:
          type: boolean
          examples:
          - false
    CreateWebhookRequest:
      title: CreateWebhookRequest
      required:
      - eventTypes
      - condition
      - requestUrl
      type: object
      properties:
        isAdHoc:
          type:
          - boolean
          - 'null'
          examples:
          - false
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
          examples:
          - - ACTOR.RUN.SUCCEEDED
        condition:
          $ref: '#/components/schemas/WebhookCondition'
        idempotencyKey:
          type:
          - string
          - 'null'
          examples:
          - fdSJmdP3nfs7sfk3y
        ignoreSslErrors:
          type:
          - boolean
          - 'null'
          examples:
          - false
        doNotRetry:
          type:
          - boolean
          - 'null'
          examples:
          - false
        requestUrl:
          type: string
          examples:
          - http://example.com/
        payloadTemplate:
          type:
          - string
          - 'null'
          examples:
          - '{\n "userId": {{userId}}...'
        headersTemplate:
          type:
          - string
          - 'null'
          examples:
          - '{\n "Authorization": "Bearer ..."}'
        description:
          type:
          - string
          - 'null'
          examples:
          - this is webhook description
        shouldInterpolateStrings:
          type:
          - boolean
          - 'null'
          examples:
          - false
    WebhookCondition:
      title: WebhookCondition
      type: object
      properties:
        actorId:
          type:
          - string
          - 'null'
          examples:
          - hksJZtadYvn4mBuin
        actorTaskId:
          type:
          - string
          - 'null'
          examples:
          - asdLZtadYvn4mBZmm
        actorRunId:
          type:
          - string
          - 'null'
          examples:
          - hgdKZtadYvn4mBpoi
    WebhookDispatchResponse:
      title: WebhookDispatchResponse
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/WebhookDispatch'
    ListOfWebhooks:
      title: ListOfWebhooks
      allOf:
      - $ref: '#/components/schemas/PaginationResponse'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/WebhookListItem'
    ListOfWebhookDispatchesResponse:
      title: ListOfWebhookDispatchesResponse
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ListOfWebhookDispatches'
    WebhookResource:
      title: WebhookResource
      required:
