openapi: 3.2.0
info:
  title: Apify Last Actor task run's default key-value store API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: 'The Apify API (version 2) provides programmatic access to the Apify

    platform. The API is organized

    around RESTful

    HTTP endpoints. You can download the complete OpenAPI schema of Apify API in the YAML or JSON formats. The source code is also available on GitHub. All requests and responses (including errors) are encoded in

    JSON format with UTF-8 encoding,

    with a few exceptions that are explicitly described in the reference. To access the API, we recommend using one of our API clients:


    Stable API clients:

    - For Node.js, we recommend the `apify-client` NPM

    package. - For Python, we recommend the `apify-client` PyPI

    package. Experimental API clients:

    - For Java, we recommend the `apify-client` Maven central component. - For Rust, we recommend the `apify-client` crate. - For .NET, we recommend the `apify-client` Nuget package. - For PHP, we recommend the `apify-client` Packagist package. - For Go, we recommend the `apify-client` package. The clients'' functions correspond to the API endpoints and have the same

    parameters. This simplifies development of apps that depend on the Apify

    platform. :::note Important Request Details


    - `Content-Type` header: For requests with a JSON body, you must include the `Content-Type: application/json` header. - Method override: You can override the HTTP method using the `method` query parameter. This is useful for clients that can only send `GET` requests. For example, to call a `POST` endpoint, append `?method=POST` to the URL of your `GET` request. :::


    ## Authentication


    **You can find your API token on the

    Integrations page in the

    Apify Console.**


    To use your token in a request, either:


    - Add the token to your request''s `Authorization` header as `Bearer `. E.g., `Authorization: Bearer xxxxxxx`. More info. (Recommended). - Add it as the `token` parameter to your request URL. (Less secure). Using your token in the request header is more secure than using it as a URL

    parameter because URLs are often stored

    in browser history and server logs. This creates a chance for someone

    unauthorized to access your API token. **Never share your API token or password with untrusted parties!**


    For more information, see our

    integrations documentation. ### Agentic payments


    AI agents can authenticate and pay for Actor runs without an Apify account

    using agentic payments. Instead of an API token, the request carries a

    payment credential that both authorizes and pays for the call. Apify supports

    the x402 protocol

    (`PAYMENT-SIGNATURE` header) and

    Skyfire

    (`skyfire-pay-id` header). ## Basic usage


    To run an Actor, send a POST request to the Run

    Actor endpoint using either the

    Actor ID code (e.g. `vKg4IjxZbEYTYeW8T`) or its name (e.g. `janedoe~my-actor`):


    `https://api.apify.com/v2/actors/[actor_id]/runs`


    If the Actor is not runnable anonymously, you will receive a 401 or 403

    response code. This means you need to add your secret API

    token to the request''s

    `Authorization` header (recommended) or as a

    URL query parameter `?token=[your_token]` (less secure). Optionally, you can include the query parameters described in the Run

    Actor section to customize your

    run. If you''re using Node.js, the best way to run an Actor is using the

    `Apify.call()` method from the Apify

    SDK. It

    runs the Actor using the account you are currently logged into (determined

    by the secret API token). The result is an Actor run

    object and its output (if

    any). A typical workflow is as follows:


    1. Run an Actor or task using the Run

    Actor or Run

    task API endpoints. 2. Monitor the Actor run by periodically polling its progress using the Get

    run API

    endpoint. 3. Fetch the results from the Get

    items API endpoint using the

    `defaultDatasetId`, which you receive in the Run request response. Additional data may be stored in a key-value store. You can fetch them from

    the Get record API endpoint

    using the `defaultKeyValueStoreId` and the store''s `key`. **Note**: Instead of periodic polling, you can also run your

    Actor or

    task

    synchronously.'
  contact: {}
  version: v2-2026-10-08T073338Z
servers:
- url: https://api.apify.com
  variables: {}
security:
- httpBearer: []
- apiKey: []
tags:
- name: Last Actor task run's default key-value store
  x-displayName: Last Actor task run's default key-value store
  description: 'The API endpoints described in this section are convenience endpoints that provide access to Actor task''s last run''s default key-value store without the need to resolve the key-value store ID first.


    Subset of functionality described in: Key-value stores'
paths:
  /v2/actor-tasks/{actorTaskId}/runs/last/key-value-store:
    get:
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyValueStoreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Last Actor task run's default key-value store
      parameters:
      - $ref: '#/components/parameters/actorTaskId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
      summary: Get last task run's default store
      description: 'Gets an object that contains all the details about the default key-value store of the last Actor task run.


        This endpoint is a shortcut for getting the last task run''s `defaultKeyValueStoreId` and then using the

        Get store endpoint.'
      operationId: actorTask_runs_last_keyValueStore_get
    put:
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeyValueStoreRequest'
            example:
              name: new-store-name
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyValueStoreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Last Actor task run's default key-value store
      parameters:
      - $ref: '#/components/parameters/actorTaskId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
      summary: Update last task run's default store
      description: 'Updates the default key-value store associated with the last Actor task run.


        This endpoint is a shortcut for getting the last task run''s `defaultKeyValueStoreId` and then using the

        Update store endpoint.'
      operationId: actorTask_runs_last_keyValueStore_put
    delete:
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Last Actor task run's default key-value store
      parameters:
      - $ref: '#/components/parameters/actorTaskId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
      summary: Delete last task run's default store
      description: 'Deletes the default key-value store of the last Actor task run.


        This endpoint is a shortcut for getting the last task run''s `defaultKeyValueStoreId` and then using the

        Delete store endpoint.'
      operationId: actorTask_runs_last_keyValueStore_delete
  /v2/actor-tasks/{actorTaskId}/runs/last/key-value-store/keys:
    get:
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfKeysResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Last Actor task run's default key-value store
      summary: Get last task run's default store's list of keys
      description: 'Returns a list of keys for the default key-value store of the last Actor task run.


        This endpoint is a shortcut for getting the last task run''s `defaultKeyValueStoreId` and then using the

        Get list of keys endpoint.'
      operationId: actorTask_runs_last_keyValueStore_keys_get
      parameters:
      - $ref: '#/components/parameters/actorTaskId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
      - $ref: '#/components/parameters/exclusiveStartKey'
      - $ref: '#/components/parameters/limit-3'
      - $ref: '#/components/parameters/collectionKeys'
      - $ref: '#/components/parameters/prefixKeys'
      - $ref: '#/components/parameters/signature'
  /v2/actor-tasks/{actorTaskId}/runs/last/key-value-store/records:
    get:
      responses:
        '200':
          description: A ZIP archive containing the requested records.
          headers: {}
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Last Actor task run's default key-value store
      summary: Download last task run's default store's records
      description: 'Downloads all records from the default key-value store of the last Actor task run as a ZIP archive.


        This endpoint is a shortcut for getting the last task run''s `defaultKeyValueStoreId` and then using the

        Download records endpoint.'
      operationId: actorTask_runs_last_keyValueStore_records_get
      parameters:
      - $ref: '#/components/parameters/actorTaskId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
      - $ref: '#/components/parameters/collectionRecords'
      - $ref: '#/components/parameters/prefixRecords'
      - $ref: '#/components/parameters/signature'
  /v2/actor-tasks/{actorTaskId}/runs/last/key-value-store/records/{recordKey}:
    get:
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'
            '*/*':
              schema: {}
        '302':
          description: ''
          headers:
            Location:
              content:
                text/plain:
                  schema:
                    type: string
                  example: https://apifier-key-value-store-prod.s3.amazonaws.com/tqx6jeMia43gYY6eE/INPUT?AWSAccessKeyId=NKDOUN&Expires=1502720992&Signature=DKLVPI4lDDKC
          content: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Last Actor task run's default key-value store
      summary: Get last task run's default store's record
      description: 'Gets a value stored under a specific key in the default key-value store of the last Actor task run.


        This endpoint is a shortcut for getting the last task run''s `defaultKeyValueStoreId` and then using the

        Get record endpoint.'
      operationId: actorTask_runs_last_keyValueStore_record_get
      parameters:
      - $ref: '#/components/parameters/actorTaskId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
      - $ref: '#/components/parameters/recordKey'
      - $ref: '#/components/parameters/signature'
      - $ref: '#/components/parameters/attachment-2'
    put:
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutRecordRequest'
          '*/*':
            schema: {}
        required: true
      responses:
        '201':
          description: ''
          headers:
            Location:
              content:
                text/plain:
                  schema:
                    type: string
                  example: https://api.apify.com/v2/key-value-stores/WkzbQMuFYuamGv3YF/records/some-key
          content:
            application/json:
              schema:
                type: object
              example: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Last Actor task run's default key-value store
      summary: Store record in last task run's default store
      description: 'Stores a value under a specific key in the default key-value store of the last Actor task run.


        This endpoint is a shortcut for getting the last task run''s `defaultKeyValueStoreId` and then using the

        Store record endpoint.'
      operationId: actorTask_runs_last_keyValueStore_record_put
      parameters:
      - $ref: '#/components/parameters/actorTaskId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
      - $ref: '#/components/parameters/recordKey'
      - $ref: '#/components/parameters/Content-Encoding'
    post:
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutRecordRequest'
          '*/*':
            schema: {}
        required: true
      responses:
        '201':
          description: ''
          headers:
            Location:
              content:
                text/plain:
                  schema:
                    type: string
                  example: https://api.apify.com/v2/key-value-stores/WkzbQMuFYuamGv3YF/records/some-key
          content:
            application/json:
              schema:
                type: object
              example: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      tags:
      - Last Actor task run's default key-value store
      summary: Store record in last task run's default store (POST)
      description: 'Stores a value under a specific key in the default key-value store of the last Actor task run.


        This endpoint is a shortcut for getting the last task run''s `defaultKeyValueStoreId` and then using the

        Store record endpoint.'
      operationId: actorTask_runs_last_keyValueStore_record_post
      parameters:
      - $ref: '#/components/parameters/actorTaskId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
