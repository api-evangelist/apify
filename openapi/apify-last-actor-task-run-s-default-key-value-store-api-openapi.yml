        This endpoint is a shortcut for getting the last task run''s `defaultKeyValueStoreId` and then using the

        Delete record endpoint.'
      operationId: actorTask_runs_last_keyValueStore_record_delete
      parameters:
      - $ref: '#/components/parameters/actorTaskId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
      - $ref: '#/components/parameters/recordKey'
components:
  parameters:
    exclusiveStartKey:
      name: exclusiveStartKey
      in: query
      description: All keys up to this one (including) are skipped from the result.
      schema:
        type: string
        example: Ihnsp8YrvJ8102Kj
    status-2:
      name: status
      in: query
      description: Filter for the run status.
      style: form
      explode: true
      schema:
        type: string
        example: SUCCEEDED
    origin:
      name: origin
      in: query
      description: Filter for the run origin, i.e. the means by which the run was started.
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/RunOrigin'
    prefixRecords:
      name: prefix
      in: query
      description: 'If specified, only records whose key starts with the given prefix are included in the archive.

        '
      schema:
        type: string
        example: my-prefix/
    actorTaskId:
      name: actorTaskId
      in: path
      description: Task ID or a tilde-separated owner's username and task's name.
      required: true
      style: simple
      schema:
        type: string
        example: janedoe~my-task
    attachment-2:
      name: attachment
      in: query
      description: 'If `true` or `1`, the response will be served with `Content-Disposition: attachment` header,

        causing web browsers to offer downloading HTML records instead of displaying them.

        '
      required: false
      schema:
        type: boolean
        example: true
    recordKey:
      name: recordKey
      in: path
      description: Key of the record.
      required: true
      style: simple
      schema:
        type: string
        example: someKey
    collectionRecords:
      name: collection
      in: query
      description: 'If specified, only records belonging to a specific collection from the key-value store schema. The key-value store need to have a schema defined for this parameter to work.

        '
      schema:
        type: string
        example: my-collection
    prefixKeys:
      name: prefix
      in: query
      description: Limit the results to keys that start with a specific prefix.
      schema:
        type: string
        example: post-images-
    limit-3:
      name: limit
      in: query
      description: Number of keys to be returned.
      schema:
        type: number
        format: int32
        minimum: 1
        maximum: 1000
        default: 1000
        example: 100
    signature:
      name: signature
      in: query
      description: Signature used for the access.
      required: false
      style: form
      schema:
        type: string
        example: 2wTI46Bg8qWQrV7tavlPI
    Content-Encoding:
      name: Content-Encoding
      in: header
      description: Compression encoding of the request body.
      required: false
      style: simple
      schema:
        enum:
        - br
        - gzip
        - deflate
        - identity
        type: string
    collectionKeys:
      name: collection
      in: query
      description: Limit the results to keys that belong to a specific collection from the key-value store schema. The key-value store need to have a schema defined for this parameter to work.
      schema:
        type: string
        example: postImages
  schemas:
    KeyValueStoreStats:
      title: KeyValueStoreStats
      type: object
      properties:
        readCount:
          type: integer
          examples:
          - 9
        writeCount:
          type: integer
          examples:
          - 3
        deleteCount:
          type: integer
          examples:
          - 6
        listCount:
          type: integer
          examples:
          - 2
        s3StorageBytes:
          type: integer
          examples:
          - 18
        storageBytes:
          type: integer
          examples:
          - 457225
    ErrorResponse:
      title: ErrorResponse
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    RecordResponse:
      title: RecordResponse
      description: 'The response body contains the value of the record. The content type of the response

        is determined by the Content-Type header stored with the record.

        '
      type: object
      additionalProperties: true
      example:
        message: Hello, world!
        count: 42
    PutRecordRequest:
      title: PutRecordRequest
      description: 'The request body contains the value to store in the record. The content type

        should be specified in the Content-Type header.

        '
      type: object
      additionalProperties: true
      example:
        message: Hello, world!
        count: 42
    RunOrigin:
      title: RunOrigin
      type: string
      enum:
      - DEVELOPMENT
      - WEB
      - API
      - SCHEDULER
      - TEST
      - WEBHOOK
      - ACTOR
      - CLI
      - CI
      - STANDBY
      - MCP
    ListOfKeys:
      title: ListOfKeys
      type: object
      required:
      - items
      - count
      - limit
      - isTruncated
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KeyValueStoreKey'
          description: ''
        count:
          type: integer
          examples:
          - 2
        limit:
          type: integer
          examples:
          - 2
        exclusiveStartKey:
          type:
          - string
          - 'null'
          examples:
          - some-key
        isTruncated:
          type: boolean
          examples:
          - true
        nextExclusiveStartKey:
          type:
          - string
          - 'null'
          examples:
          - third-key
    KeyValueStoreKey:
      title: KeyValueStoreKey
      type: object
      required:
      - key
      - size
      - recordPublicUrl
      properties:
        key:
          type: string
          examples:
          - second-key
        size:
          type: integer
          examples:
          - 36
        recordPublicUrl:
          type: string
          format: uri
          description: A public link to access this record directly.
          examples:
          - https://api.apify.com/v2/key-value-stores/WkzbQMuFYuamGv3YF/records/some-key?signature=abc123
    KeyValueStoreResource:
      title: KeyValueStoreResource
      required:
      - id
      - createdAt
      - modifiedAt
      - accessedAt
      type: object
      properties:
        id:
          type: string
          examples:
          - WkzbQMuFYuamGv3YF
        name:
          type:
          - string
          - 'null'
          examples:
          - d7b9MDYsbtX5L7XAj
        userId:
          type:
          - string
          - 'null'
          examples:
          - BPWDBd7Z9c746JAnF
        username:
          type:
          - string
          - 'null'
          examples:
          - janedoe
        createdAt:
          type: string
          format: date-time
          examples:
          - '2019-12-12T07:34:14.202Z'
        modifiedAt:
          type: string
          format: date-time
          examples:
          - '2019-12-13T08:36:13.202Z'
        accessedAt:
          type: string
          format: date-time
          examples:
          - '2019-12-14T08:36:13.202Z'
        actId:
          type:
          - string
          - 'null'
          examples:
          - null
        actRunId:
          type:
          - string
          - 'null'
          examples:
          - null
        consoleUrl:
          type: string
          format: uri
          examples:
          - https://console.apify.com/storage/key-value-stores/27TmTznX9YPeAYhkC
        keysPublicUrl:
          type: string
          format: uri
          description: A public link to access keys of the key-value store directly.
          examples:
          - https://api.apify.com/v2/key-value-stores/WkzbQMuFYuamGv3YF/keys?signature=abc123
        recordsPublicUrl:
          type: string
          format: uri
          description: A public link to access records of the key-value store directly.
          examples:
