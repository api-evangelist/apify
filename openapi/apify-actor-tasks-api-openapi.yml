  /v2/actor-tasks/{actorTaskId}/runs/last:
    get:
      tags:
      - Actor tasks
      summary: Get last run
      description: 'This is not a single endpoint, but an entire group of endpoints that lets you to

        retrieve and manage the last run of given actor task or any of its default storages.

        All the endpoints require an authentication token.


        The base path represents the last actor task run object is:


        `/v2/actor-tasks/{actorTaskId}/runs/last{?token,status,origin}`


        Using the `status` query parameter you can ensure to only get a run with a certain status

        (e.g. `status=SUCCEEDED`). Similarly, the `origin` query parameter filters runs by the means

        by which they were started (e.g. `origin=API`). The output of this endpoint and other query

        parameters are the same as in the Run object endpoint.


        ##### Convenience endpoints for last Actor task run


        * Dataset


        * Key-value store


        * Request queue


        * Log'
      operationId: actorTask_runs_last_get
      parameters:
      - $ref: '#/components/parameters/actorTaskId'
      - $ref: '#/components/parameters/status-2'
      - $ref: '#/components/parameters/origin'
      - $ref: '#/components/parameters/waitForFinishRun'
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
      x-legacy-doc-urls:
      - https://docs.apify.com/api/v2#/reference/actor-tasks/last-run-object-and-its-storages
components:
  parameters:
    status-2:
      name: status
      in: query
      description: Filter for the run status.
      style: form
      explode: true
      schema:
        type: string
        example: SUCCEEDED
    omit:
      name: omit
      in: query
      description: A comma-separated list of fields which should be omitted from the items.
      style: form
      explode: true
      schema:
        type: string
        example: myValue,myOtherValue
    timeout:
      name: timeout
      in: query
      description: 'Optional timeout for the run, in seconds. By default, the run uses the timeout from its configuration.

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 60
    offset:
      name: offset
      in: query
      description: 'Number of items that should be skipped at the start. The default value is `0`.

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 0
    memory:
      name: memory
      in: query
      description: 'Memory limit for the run, in megabytes. You can set the amount of memory to a power of 2 with a minimum of 128.

        By default, the run uses the memory limit from its configuration. Don''t change this value unless the Actor''s

        documentation recommends it or you''re aware of the consequences.

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 256
    restartOnError:
      name: restartOnError
      in: query
      description: 'Determines whether the run will be restarted if it fails.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: false
    build:
      name: build
      in: query
      description: 'Specifies the Actor build to run. It can be either a build tag or build number.

        By default, the run uses the build from its configuration (typically `latest`).

        '
      style: form
      explode: true
      schema:
        type: string
        example: 0.1.234
    feedDescription:
      name: feedDescription
      in: query
      description: 'Overrides the auto-generated RSS channel `<description>` element.

        Only used when `format=rss`. If not provided, the description defaults to `Items in dataset with id "<datasetId>".`

        '
      style: form
      explode: true
      schema:
        type: string
        example: Scraped forum posts
    bom:
      name: bom
      in: query
      description: 'All text responses are encoded in UTF-8 encoding. By default, the

        `format=csv` files are prefixed with the UTF-8 Byte Order Mark (BOM), while `json`, `jsonl`, `xml`, `html` and `rss` files are not.


        If you want to override this default behavior, specify `bom=1` query parameter to include the BOM or `bom=0` to skip it.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: false
    origin:
      name: origin
      in: query
      description: Filter for the run origin, i.e. the means by which the run was started.
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/RunOrigin'
    outputFields:
      name: outputFields
      in: query
      description: 'A comma-separated list of output field names that positionally rename the fields specified in the `fields` parameter.

        For example, `?fields=headline,url&outputFields=title,link` renames `headline` to `title` and `url` to `link` in the output.

        The number of names in `outputFields` must match the number of names in `fields`.

        Requires the `fields` parameter to be specified as well.

        '
      style: form
      explode: true
      schema:
        type: string
        example: title,link
    fields:
      name: fields
      in: query
      description: 'A comma-separated list of fields which should be picked from the items, only these fields will remain in the resulting record objects.

        Note that the fields in the outputted items are sorted the same way as they are specified in the `fields` query parameter.

        You can use this feature to effectively fix the output format.

        '
      style: form
      explode: true
      schema:
        type: string
        example: myValue,myOtherValue
    descDataset:
      name: desc
      in: query
      description: 'By default, results are returned in the same order as they were stored.

        To reverse the order, set this parameter to `true` or `1`.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: true
    xmlRoot:
      name: xmlRoot
      in: query
      description: 'Overrides default root element name of `xml` output. By default the root element is `items`.

        '
      style: form
      explode: true
      schema:
        type: string
        example: items
    skipFailedPages:
      name: skipFailedPages
      in: query
      description: 'If `true` or `1` then, the all the items with errorInfo property will be skipped from the output.


        This feature is here to emulate functionality of API version 1 used for the legacy Apify Crawler product and it''s not recommended to use it in new integrations.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: false
    waitForFinishRun:
      name: waitForFinish
      in: query
      description: 'The maximum number of seconds the server waits for the run to finish. By

        default it is `0`, the maximum value is `60`. <!-- MAX_ACTOR_JOB_ASYNC_WAIT_SECS -->

        If the run finishes in time then the returned run object will have a terminal status (e.g. `SUCCEEDED`),

        otherwise it will have a transitional status (e.g. `RUNNING`).

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 60
    unwind:
      name: unwind
      in: query
      description: 'A comma-separated list of fields which should be unwound, in order which they should be processed. Each field should be either an array or an object.

        If the field is an array then every element of the array will become a separate record and merged with parent object.

        If the unwound field is an object then it is merged with the parent object.

        If the unwound field is missing or its value is neither an array nor an object and therefore cannot be merged with a parent object then the item gets preserved as it is.

        Note that the unwound items ignore the `desc` parameter.

        '
      style: form
      explode: true
      schema:
        type: string
        example: myValue,myOtherValue
    actorTaskId:
      name: actorTaskId
      in: path
      description: Task ID or a tilde-separated owner's username and task's name.
      required: true
      style: simple
      schema:
        type: string
        example: janedoe~my-task
    descCreatedAt:
      name: desc
      in: query
      description: 'If `true` or `1` then the objects are sorted by the `createdAt` field in

        descending order. By default, they are sorted in ascending order.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: true
    xmlRow:
      name: xmlRow
      in: query
      description: 'Overrides default element name that wraps each page or page function result object in `xml` output. By default the element name is `item`.

        '
      style: form
      explode: true
      schema:
        type: string
        example: item
    skipHeaderRow:
      name: skipHeaderRow
      in: query
      description: If `true` or `1` then header row in the `csv` format is skipped.
      style: form
      explode: true
      schema:
        type: boolean
        example: true
    maxItems:
      name: maxItems
      in: query
      required: false
      description: 'Specifies the maximum number of dataset items that will be charged for pay-per-result Actors.

        This does NOT guarantee that the Actor will return only this many items.

        It only ensures you won''t be charged for more than this number of items.

        Only works for pay-per-result Actors.

        Value can be accessed in the actor run using `ACTOR_MAX_PAID_DATASET_ITEMS` environment variable.

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 1000
    descStartedAt:
      name: desc
      in: query
      description: 'If `true` or `1` then the objects are sorted by the `startedAt` field in

        descending order. By default, they are sorted in ascending order.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: true
    status:
      name: status
      in: query
      description: 'Single status or comma-separated list of statuses, see ([available

        statuses](https://docs.apify.com/platform/actors/running/runs-and-builds#lifecycle)). Used to filter runs by the specified statuses only.

        '
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        example:
        - SUCCEEDED
    simplified:
      name: simplified
      in: query
      description: 'If `true` or `1` then, the endpoint applies the `fields=url,pageFunctionResult,errorInfo`

        and `unwind=pageFunctionResult` query parameters. This feature is used to emulate simplified results provided by the

        legacy Apify Crawler product and it''s not recommended to use it in new integrations.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: false
    webhooks:
      name: webhooks
      in: query
      description: 'Specifies optional webhooks associated with the Actor run, which can be used to receive a notification

        e.g. when the Actor finished or failed. The value is a Base64-encoded JSON array whose items follow

        the WebhookRepresentation schema. For more information, see

        [Webhooks documentation](https://docs.apify.com/platform/integrations/webhooks).

        '
      style: form
      explode: true
      schema:
        type: string
        contentEncoding: base64
        contentMediaType: application/json
        contentSchema:
          type: array
          items:
            $ref: '#/components/schemas/WebhookRepresentation'
        example: dGhpcyBpcyBqdXN0IGV4YW1wbGUK...
    limit-2:
      name: limit
      in: query
      description: Maximum number of items to return. By default there is no limit.
      style: form
      explode: true
      schema:
        type: number
        format: double
    attachment:
      name: attachment
      in: query
      description: 'If `true` or `1` then the response will define the `Content-Disposition:

        attachment` header, forcing a web browser to download the file rather

        than to display it. By default this header is not present.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: true
    skipEmpty:
      name: skipEmpty
      in: query
      description: 'If `true` or `1` then empty items are skipped from the output.


        Note that if used, the results might contain less items than the limit value.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: false
    format:
      name: format
      in: query
      description: 'Format of the results, possible values are: `json`, `jsonl`, `csv`, `html`, `xlsx`, `xml` and `rss`. The default value is `json`.

        '
      style: form
      explode: true
      schema:
        type: string
        example: json
    outputRecordKey:
      name: outputRecordKey
      in: query
      description: 'Key of the record from the run''s default key-value store to return in the

        response. Defaults to `OUTPUT`. Actors aren''t required to store a record

        under this key, so if it doesn''t exist the response contains no data.

        '
      style: form
      explode: true
      schema:
        type: string
        example: OUTPUT
    clean:
      name: clean
      in: query
      description: 'If `true` or `1` then the API endpoint returns only non-empty items and skips hidden fields (i.e. fields starting with the # character).

        The `clean` parameter is just a shortcut for `skipHidden=true` and `skipEmpty=true` parameters.

        Note that since some objects might be skipped from the output, that the result might contain less items than the `limit` value.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: false
    limit:
      name: limit
      in: query
      description: 'Maximum number of items to return. The default value as well as the maximum is `1000`.

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 1000
    view:
      name: view
      in: query
      description: 'Defines the view configuration for dataset items based on the schema definition.

        This parameter determines how the data will be filtered and presented.

        For complete specification details, see the [dataset schema documentation](/storage/dataset-schema).

        '
      schema:
        type: string
        example: overview
    feedTitle:
      name: feedTitle
      in: query
      description: 'Overrides the auto-generated RSS channel `<title>` element.

        Only used when `format=rss`. If not provided, the title defaults to `Dataset <label>`.

        '
      style: form
      explode: true
      schema:
        type: string
        example: Latest posts from r/pasta
    skipHidden:
      name: skipHidden
      in: query
      description: 'If `true` or `1` then hidden fields are skipped from the output, i.e. fields starting with the `#` character.

        '
      style: form
      explode: true
      schema:
        type: boolean
        example: false
    maxTotalChargeUsd:
      name: maxTotalChargeUsd
      in: query
      required: false
      description: 'Specifies the maximum total cost of the run.

        Use it to cap the total amount charged for all pricing models.

        You can access the maximum cost in your Actor

        by using the `ACTOR_MAX_TOTAL_CHARGE_USD` environment variable.

        '
      style: form
      explode: true
      schema:
        type: number
        format: double
        example: 5
    flatten:
      name: flatten
      in: query
      description: 'A comma-separated list of fields which should transform nested objects into flat structures.


        For example, with `flatten="foo"` the object `{"foo":{"bar": "hello"}}` is turned into `{"foo.bar": "hello"}`.


        The original object with properties is replaced with the flattened object.

        '
      style: form
      explode: true
      schema:
        type: string
        example: myValue
    delimiter:
      name: delimiter
      in: query
      description: 'A delimiter character for CSV files, only used if `format=csv`. You

        might need to URL-encode the character (e.g. use `%09` for tab or `%3B`

        for semicolon). The default delimiter is a simple comma (`,`).

        '
      style: form
      explode: true
      schema:
        type: string
        example: ;
  schemas:
    TieredPricingPerEventEntry:
      title: TieredPricingPerEventEntry
      description: A single tier's price-per-event entry.
      type: object
      required:
      - tieredEventPriceUsd
      properties:
        tieredEventPriceUsd:
          type: number
          description: Price per event in USD for this tier.
    RunMetamorphEvent:
      title: RunMetamorphEvent
      description: Information about a metamorph event that occurred during the run.
      type: object
      required:
      - createdAt
      - actorId
      - buildId
      properties:
        createdAt:
          type: string
          format: date-time
          description: Time when the metamorph occurred.
          examples:
          - '2019-11-30T07:39:24.202Z'
        actorId:
          type: string
          description: ID of the Actor that the run was metamorphed to.
          examples:
          - nspoEjklmnsF2oosD
        buildId:
          type: string
          description: ID of the build used for the metamorphed Actor.
          examples:
          - ME6oKecqy5kXDS4KQ
        inputKey:
          type:
          - string
          - 'null'
          description: Key of the input record in the key-value store.
          examples:
          - INPUT-METAMORPH-1
    PricePerDatasetItemActorPricingInfo:
      title: PricePerDatasetItemActorPricingInfo
      allOf:
      - $ref: '#/components/schemas/CommonActorPricingInfo'
      - type: object
        required:
        - pricingModel
        - unitName
        properties:
          pricingModel:
            type: string
            const: PRICE_PER_DATASET_ITEM
          unitName:
            type: string
            description: Name of the unit that is being charged
          pricePerUnitUsd:
            type: number
            description: 'Price per unit in USD. Mutually exclusive with `tieredPricing` - exactly one of the two is present

              on a pricing record.

              '
          tieredPricing:
            $ref: '#/components/schemas/TieredPricingPerDatasetItem'
    WebhookCondition:
      title: WebhookCondition
      type: object
      properties:
        actorId:
          type:
          - string
          - 'null'
          examples:
          - hksJZtadYvn4mBuin
        actorTaskId:
          type:
          - string
          - 'null'
          examples:
          - asdLZtadYvn4mBZmm
        actorRunId:
          type:
          - string
          - 'null'
          examples:
          - hgdKZtadYvn4mBpoi
    TaskResponse:
      title: TaskResponse
      description: Response containing Actor task data.
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Task'
      example:
        data:
          id: zdc3Pyhyz3m8vjDeM
          userId: wRsJZtadYvn4mBZmm
          actId: asADASadYvn4mBZmm
          name: my-task
          username: janedoe
          createdAt: '2018-10-26T07:23:14.855Z'
          modifiedAt: '2018-10-26T13:30:49.578Z'
          removedAt: null
          stats:
            totalRuns: 15
          options:
            build: latest
            timeoutSecs: 300
            memoryMbytes: 128
          input:
            hello: world
    Run:
      title: Run
      description: Represents an Actor run and its associated data.
      required:
      - id
      - actId
      - userId
      - startedAt
      - status
      - meta
      - stats
      - options
      - buildId
      - defaultKeyValueStoreId
      - defaultDatasetId
      - defaultRequestQueueId
      type: object
      properties:
        id:
          type: string
          examples:
          - HG7ML7M8z78YcAPEB
          description: Unique identifier of the Actor run.
        actId:
          type: string
          examples:
          - HDSasDasz78YcAPEB
          description: ID of the Actor that was run.
        userId:
          type: string
          examples:
          - 7sT5jcggjjA9fNcxF
          description: ID of the user who started the run.
        actorTaskId:
          type:
          - string
          - 'null'
          examples:
          - KJHSKHausidyaJKHs
          description: ID of the Actor task, if the run was started from a task.
        startedAt:
          type: string
          format: date-time
          examples:
          - '2019-11-30T07:34:24.202Z'
          description: Time when the Actor run started.
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
          examples:
          - '2019-12-12T09:30:12.202Z'
          description: Time when the Actor run finished.
        status:
          description: Current status of the Actor run.
          $ref: '#/components/schemas/ActorJobStatus'
        statusMessage:
          type:
          - string
          - 'null'
          examples:
          - Actor is running
          description: Detailed message about the run status.
        isStatusMessageTerminal:
          type:
          - boolean
          - 'null'
          examples:
          - false
          description: Whether the status message is terminal (final).
        meta:
          description: Metadata about the Actor run.
          $ref: '#/components/schemas/RunMeta'
        pricingInfo:
          description: Pricing information for the Actor.
          $ref: '#/components/schemas/ActorRunPricingInfo'
        stats:
          description: Statistics of the Actor run.
          $ref: '#/components/schemas/RunStats'
        chargedEventCounts:
          description: A map of charged event types to their counts. The keys are event type identifiers defined by the Actor's pricing model (pay-per-event), and the values are the number of times each event was charged during this run.
          type: object
          additionalProperties:
            type: integer
          example:
            actor-start: 1
            page-crawled: 150
            data-extracted: 75
        options:
          description: Configuration options for the Actor run.
          $ref: '#/components/schemas/RunOptions'
        buildId:
          type: string
          examples:
          - 7sT5jcggjjA9fNcxF
          description: ID of the Actor build used for this run.
        exitCode:
          type:
          - integer
          - 'null'
          examples:
          - 0
          description: Exit code of the Actor run process.
        generalAccess:
          description: General access level for the Actor run.
          anyOf:
          - $ref: '#/components/schemas/GeneralAccess'
          - type: 'null'
        defaultKeyValueStoreId:
          type: string
          examples:
          - eJNzqsbPiopwJcgGQ
          description: ID of the default key-value store for this run.
        defaultDatasetId:
          type: string
          examples:
          - wmKPijuyDnPZAPRMk
          description: ID of the default dataset for this run.
        defaultRequestQueueId:
          type: string
          examples:
          - FL35cSF7jrxr3BY39
          description: ID of the default request queue for this run.
        storageIds:
          type: object
          description: A map of aliased storage IDs associated with this run, grouped by storage type.
          properties:
            datasets:
              type: object
              description: Aliased dataset IDs for this run.
              properties:
                default:
                  type: string
                  description: ID of the default dataset for this run.
                  example: wmKPijuyDnPZAPRMk
              additionalProperties:
                type: string
            keyValueStores:
              type: object
              description: Aliased key-value store IDs for this run.
              properties:
                default:
                  type: string
                  description: ID of the default key-value store for this run.
                  example: eJNzqsbPiopwJcgGQ
              additionalProperties:
                type: string
            requestQueues:
              type: object
              description: Aliased request queue IDs for this run.
              properties:
                default:
                  type: string
                  description: ID of the default request queue for this run.
                  example: FL35cSF7jrxr3BY39
              additionalProperties:
                type: string
        buildNumber:
          type:
          - string
          - 'null'
          pattern: ^([0-9]|[1-9][0-9])\.([0-9]|[1-9][0-9])(\.[1-9][0-9]{0,4})$
          examples:
          - 0.0.36
          description: Build number of the Actor build used for this run.
        containerUrl:
          type: string
          format: uri
          examples:
          - https://g8kd8kbc5ge8.runs.apify.net
          description: URL of the container running the Actor.
        isContainerServerReady:
          type:
          - boolean
          - 'null'
          examples:
          - true
          description: Whether the container's HTTP server is ready to accept requests.
        gitBranchName:
          type:
          - string
          - 'null'
          examples:
          - master
          description: Name of the git branch used for the Actor build.
        usage:
          description: Resource usage statistics for the run.
          anyOf:
          - $ref: '#/components/schemas/RunUsage'
          - type: 'null'
        usageTotalUsd:
          type:
          - number
          - 'null'
          examples:
          - 0.2654
          description: 'Total cost in USD for this run. Represents what you actually pay. For run owners: includes platform usage (compute units) and/or event costs depending on the Actor''s pricing model. For run non-owners: only available for Pay-Per-Event Actors (event costs only). Requires authentication token to access.'
        usageUsd:
          description: Platform usage costs breakdown in USD. Only present if you own the run AND are paying for platform usage (Pay-Per-Usage, Rental, or Pay-Per-Event with usage costs like standby Actors). Not available for standard Pay-Per-Event Actors. Requires authentication token to access.
          anyOf:
          - $ref: '#/components/schemas/RunUsageUsd'
          - type: 'null'
        metamorphs:
          description: List of metamorph events that occurred during the run.
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/RunMetamorphEvent'
          - type: 'null'
        platformUsageBillingModel:
          type: string
          description: Indicates which party covers platform usage costs for this run.
          examples:
          - USER
    CreateTaskRequest:
      title: CreateTaskRequest
      required:
      - actId
      type: object
      properties:
        actId:
          type: string
          examples:
          - asADASadYvn4mBZmm
        name:
          type: string
          examples:
          - my-task
        options:
          anyOf:
          - $ref: '#/components/schemas/TaskOptions'
          - type: 'null'
        input:
          anyOf:
          - $ref: '#/components/schemas/TaskInput'
          - type: array
            items:
              $ref: '#/components/schemas/TaskInput'
          - type: 'null'
        title:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        actorStandby:
          anyOf:
          - $ref: '#/components/schemas/ActorStandby'
          - type: 'null'
        publicConfig:
          description: 'Configuration that controls how the published task appears on its public landing page.

            Editing this object requires write permission to the Actor that the task belongs to.

            '
          $ref: '#/components/schemas/TaskPublicConfig'
