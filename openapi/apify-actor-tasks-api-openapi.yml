    TaskPublicConfig:
      title: TaskPublicConfig
      type: object
      description: 'Public-facing configuration of a published task, used by the task''s public landing page.

        The task''s publication state is determined by `publishedAt` - a task is published when

        `publishedAt` is set and unpublished when it is `null`.

        '
      properties:
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: 'Time when the task was published, or `null` if the task isn''t published.

            This field is server-controlled. To publish or unpublish a task, use the

            [Update task](/api/v2/actor-task-put) endpoint and set `isPublic`.

            '
          examples:
          - '2025-06-16T09:20:45.777Z'
        seoTitle:
          type:
          - string
          - 'null'
          maxLength: 60
          description: 'Name of the Actor task to display by search engines such as Google. Defaults to the task

            title. At most 60 characters.

            '
          examples:
          - Scrape data from a website
        seoDescription:
          type:
          - string
          - 'null'
          maxLength: 160
          description: 'Description of the Actor task to display by search engines such as Google. Defaults to the

            task description. At most 160 characters.

            '
        inputSchemaFields:
          type:
          - array
          - 'null'
          description: Names of the task input fields displayed on the public task page.
          items:
            type: string
        datasetName:
          type:
          - string
          - 'null'
          description: 'Name of the dataset from the Actor''s dataset schema whose results are displayed. When

            `null`, the Actor''s default dataset is used. That is, the only dataset the Actor declares,

            or the one named `default` when it declares several.

            '
        datasetView:
          type:
          - string
          - 'null'
          description: 'Key of the dataset view from the Actor''s dataset schema used to display results. Must be

            one of the views declared on the resolved dataset. You can''t publish a task without it.

            '
    WebhookRepresentation:
      title: WebhookRepresentation
      description: 'Minimal representation of an ad-hoc webhook attached to a single Actor run or build via the

        `webhooks` query parameter. The query parameter value is a Base64-encoded JSON array whose

        items match this schema. Persistent webhook fields (e.g. `condition`) are not used here.

        '
      required:
      - eventTypes
      - requestUrl
      type: object
      properties:
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
          examples:
          - - ACTOR.RUN.SUCCEEDED
        requestUrl:
          type: string
          description: The URL to which the webhook sends its payload.
          examples:
          - http://example.com/
        payloadTemplate:
          type:
          - string
          - 'null'
          description: Optional template for the JSON payload sent by the webhook.
          examples:
          - '{\n "userId": {{userId}}...'
        headersTemplate:
          type:
          - string
          - 'null'
          description: Optional template for the HTTP headers sent by the webhook.
          examples:
          - '{\n "Authorization": "Bearer ..."}'
        shouldInterpolateStrings:
          type:
          - boolean
          - 'null'
          description: Flag to also interpolate `{{...}}` variables inside string values of the payload and headers templates.
          examples:
          - false
        idempotencyKey:
          type:
          - string
          - 'null'
          description: Key that prevents creating duplicate webhooks, e.g. when the run-starting request is retried.
          examples:
          - fdSJmdP3nfs7sfk3y
        ignoreSslErrors:
          type:
          - boolean
          - 'null'
          description: Flag to ignore SSL errors when the webhook sends the request.
          examples:
          - false
        doNotRetry:
          type:
          - boolean
          - 'null'
          description: Flag to skip retrying the webhook request on failure.
          examples:
          - false
    UpdateTaskRequest:
      title: UpdateTaskRequest
      type: object
      properties:
        name:
          type: string
          examples:
          - my-task
        options:
          anyOf:
          - $ref: '#/components/schemas/TaskOptions'
          - type: 'null'
        input:
          anyOf:
          - $ref: '#/components/schemas/TaskInput'
          - type: array
            items:
              $ref: '#/components/schemas/TaskInput'
          - type: 'null'
        title:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        actorStandby:
          anyOf:
          - $ref: '#/components/schemas/ActorStandby'
          - type: 'null'
        publicConfig:
          description: 'Configuration that controls how the published task appears on its public landing page.

            Editing this object requires write permission to the Actor that the task belongs to.


            The fields you send are merged into the stored configuration, so you only need to include

            the ones you''re changing. To clear a field, set it to `null`. Sending `publicConfig: null`

            is rejected, so the object as a whole can''t be cleared.

            '
          $ref: '#/components/schemas/TaskPublicConfig'
        isPublic:
          type: boolean
          description: 'Set to `true` to publish the task on its public landing page, or `false` to unpublish it.

            Sending the value the task already has does nothing.

            '
          examples:
          - true
    ActorStandby:
      title: ActorStandby
      type: object
      properties:
        isEnabled:
          type:
          - boolean
          - 'null'
          description: Whether standby mode is enabled for the Actor.
        desiredRequestsPerActorRun:
          type:
          - integer
          - 'null'
          description: Target number of concurrent HTTP requests a single run is configured to handle.
        maxRequestsPerActorRun:
          type:
          - integer
          - 'null'
          description: Maximum number of concurrent HTTP requests that can be routed to a single run.
        idleTimeoutSecs:
          type:
          - integer
          - 'null'
          description: In seconds, how long a run can stay idle without incoming requests before it's terminated.
        build:
          type:
          - string
          - 'null'
          description: Which build to run in standby mode. Either a build tag or a version number.
        memoryMbytes:
          type:
          - integer
          - 'null'
          description: In MB, the amount of memory allocated to the run.
        disableStandbyFieldsOverride:
          type:
          - boolean
          - 'null'
          description: If `true`, prevents the standby mode configuration from being overridden elsewhere.
        shouldPassActorInput:
          type:
          - boolean
          - 'null'
          description: Whether to pass the Actor's input to the standby run. If `false`, the standby runs start with no input.
    FreeActorPricingInfo:
      title: FreeActorPricingInfo
      allOf:
