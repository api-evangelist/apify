naftiko: 1.0.0-alpha2
info:
  label: Apify API — Actor Runs
  description: 'Apify API — Actor Runs. 3 operations. Lead operation: Apify Get Run. Self-contained Naftiko capability covering
    one Apify business surface.'
  tags:
  - Apify
  - Actor Runs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APIFY_API_KEY: APIFY_API_KEY
capability:
  consumes:
  - type: http
    namespace: apify-actor-runs
    baseUri: https://api.apify.com/v2
    description: Apify API — Actor Runs business capability. Self-contained, no shared references.
    resources:
    - name: actor-runs-runId
      path: /actor-runs/{runId}
      operations:
      - name: getrun
        method: GET
        description: Apify Get Run
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: runId
          in: path
          type: string
          description: Actor run ID.
          required: true
    - name: actor-runs-runId-abort
      path: /actor-runs/{runId}/abort
      operations:
      - name: abortrun
        method: POST
        description: Apify Abort Run
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: runId
          in: path
          type: string
          description: Actor run ID.
          required: true
    - name: acts-actorId-runs
      path: /acts/{actorId}/runs
      operations:
      - name: listactorruns
        method: GET
        description: Apify List Actor Runs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: actorId
          in: path
          type: string
          description: Actor ID or username~actorName.
          required: true
        - name: limit
          in: query
          type: integer
          description: Maximum number of results.
        - name: offset
          in: query
          type: integer
          description: Number of results to skip.
        - name: status
          in: query
          type: string
          description: Filter by run status.
    authentication:
      type: bearer
      token: '{{env.APIFY_API_KEY}}'
  exposes:
  - type: rest
    namespace: apify-actor-runs-rest
    port: 8080
    description: REST adapter for Apify API — Actor Runs. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/actor-runs/{runid}
      name: actor-runs-runid
      description: REST surface for actor-runs-runId.
      operations:
      - method: GET
        name: getrun
        description: Apify Get Run
        call: apify-actor-runs.getrun
        with:
          runId: rest.runId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/actor-runs/{runid}/abort
      name: actor-runs-runid-abort
      description: REST surface for actor-runs-runId-abort.
      operations:
      - method: POST
        name: abortrun
        description: Apify Abort Run
        call: apify-actor-runs.abortrun
        with:
          runId: rest.runId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/acts/{actorid}/runs
      name: acts-actorid-runs
      description: REST surface for acts-actorId-runs.
      operations:
      - method: GET
        name: listactorruns
        description: Apify List Actor Runs
        call: apify-actor-runs.listactorruns
        with:
          actorId: rest.actorId
          limit: rest.limit
          offset: rest.offset
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apify-actor-runs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apify API — Actor Runs. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: apify-get-run
      description: Apify Get Run
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apify-actor-runs.getrun
      with:
        runId: tools.runId
      outputParameters:
      - type: object
        mapping: $.
    - name: apify-abort-run
      description: Apify Abort Run
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: apify-actor-runs.abortrun
      with:
        runId: tools.runId
      outputParameters:
      - type: object
        mapping: $.
    - name: apify-list-actor-runs
      description: Apify List Actor Runs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apify-actor-runs.listactorruns
      with:
        actorId: tools.actorId
        limit: tools.limit
        offset: tools.offset
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
