naftiko: 1.0.0-alpha2
info:
  label: Apify API — Actors
  description: 'Apify API — Actors. 3 operations. Lead operation: Apify List Actors. Self-contained Naftiko capability covering
    one Apify business surface.'
  tags:
  - Apify
  - Actors
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APIFY_API_KEY: APIFY_API_KEY
capability:
  consumes:
  - type: http
    namespace: apify-actors
    baseUri: https://api.apify.com/v2
    description: Apify API — Actors business capability. Self-contained, no shared references.
    resources:
    - name: acts
      path: /acts
      operations:
      - name: listactors
        method: GET
        description: Apify List Actors
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: my
          in: query
          type: boolean
          description: If true, return only Actors owned by the user.
        - name: limit
          in: query
          type: integer
          description: Maximum number of results to return.
        - name: offset
          in: query
          type: integer
          description: Number of results to skip.
    - name: acts-actorId
      path: /acts/{actorId}
      operations:
      - name: getactor
        method: GET
        description: Apify Get Actor
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: actorId
          in: path
          type: string
          description: Actor ID or username~actorName.
          required: true
    - name: acts-actorId-runs
      path: /acts/{actorId}/runs
      operations:
      - name: runactor
        method: POST
        description: Apify Run Actor
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: actorId
          in: path
          type: string
          description: Actor ID or username~actorName.
          required: true
        - name: waitForFinish
          in: query
          type: integer
          description: Wait for run to finish (max 300 seconds). Returns run details when complete.
        - name: memory
          in: query
          type: integer
          description: Memory limit in MB (128-32768).
        - name: build
          in: query
          type: string
          description: Tag or number of the Actor build to run.
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.APIFY_API_KEY}}'
  exposes:
  - type: rest
    namespace: apify-actors-rest
    port: 8080
    description: REST adapter for Apify API — Actors. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/acts
      name: acts
      description: REST surface for acts.
      operations:
      - method: GET
        name: listactors
        description: Apify List Actors
        call: apify-actors.listactors
        with:
          my: rest.my
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/acts/{actorid}
      name: acts-actorid
      description: REST surface for acts-actorId.
      operations:
      - method: GET
        name: getactor
        description: Apify Get Actor
        call: apify-actors.getactor
        with:
          actorId: rest.actorId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/acts/{actorid}/runs
      name: acts-actorid-runs
      description: REST surface for acts-actorId-runs.
      operations:
      - method: POST
        name: runactor
        description: Apify Run Actor
        call: apify-actors.runactor
        with:
          actorId: rest.actorId
          waitForFinish: rest.waitForFinish
          memory: rest.memory
          build: rest.build
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apify-actors-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apify API — Actors. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: apify-list-actors
      description: Apify List Actors
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apify-actors.listactors
      with:
        my: tools.my
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
    - name: apify-get-actor
      description: Apify Get Actor
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apify-actors.getactor
      with:
        actorId: tools.actorId
      outputParameters:
      - type: object
        mapping: $.
    - name: apify-run-actor
      description: Apify Run Actor
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: apify-actors.runactor
      with:
        actorId: tools.actorId
        waitForFinish: tools.waitForFinish
        memory: tools.memory
        build: tools.build
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
