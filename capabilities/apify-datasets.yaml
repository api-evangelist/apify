naftiko: 1.0.0-alpha2
info:
  label: Apify API — Datasets
  description: 'Apify API — Datasets. 2 operations. Lead operation: Apify List Datasets. Self-contained Naftiko capability
    covering one Apify business surface.'
  tags:
  - Apify
  - Datasets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APIFY_API_KEY: APIFY_API_KEY
capability:
  consumes:
  - type: http
    namespace: apify-datasets
    baseUri: https://api.apify.com/v2
    description: Apify API — Datasets business capability. Self-contained, no shared references.
    resources:
    - name: datasets
      path: /datasets
      operations:
      - name: listdatasets
        method: GET
        description: Apify List Datasets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Maximum number of results.
        - name: offset
          in: query
          type: integer
          description: Number of results to skip.
    - name: datasets-datasetId-items
      path: /datasets/{datasetId}/items
      operations:
      - name: getdatasetitems
        method: GET
        description: Apify Get Dataset Items
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: datasetId
          in: path
          type: string
          description: Dataset ID.
          required: true
        - name: format
          in: query
          type: string
          description: Output format (json, csv, xml, html, rss, xlsx, jsonl).
        - name: limit
          in: query
          type: integer
          description: Maximum number of items.
        - name: offset
          in: query
          type: integer
          description: Number of items to skip.
        - name: fields
          in: query
          type: string
          description: Comma-separated list of fields to include.
    authentication:
      type: bearer
      token: '{{env.APIFY_API_KEY}}'
  exposes:
  - type: rest
    namespace: apify-datasets-rest
    port: 8080
    description: REST adapter for Apify API — Datasets. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/datasets
      name: datasets
      description: REST surface for datasets.
      operations:
      - method: GET
        name: listdatasets
        description: Apify List Datasets
        call: apify-datasets.listdatasets
        with:
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/datasets/{datasetid}/items
      name: datasets-datasetid-items
      description: REST surface for datasets-datasetId-items.
      operations:
      - method: GET
        name: getdatasetitems
        description: Apify Get Dataset Items
        call: apify-datasets.getdatasetitems
        with:
          datasetId: rest.datasetId
          format: rest.format
          limit: rest.limit
          offset: rest.offset
          fields: rest.fields
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apify-datasets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apify API — Datasets. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: apify-list-datasets
      description: Apify List Datasets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apify-datasets.listdatasets
      with:
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
    - name: apify-get-dataset-items
      description: Apify Get Dataset Items
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apify-datasets.getdatasetitems
      with:
        datasetId: tools.datasetId
        format: tools.format
        limit: tools.limit
        offset: tools.offset
        fields: tools.fields
      outputParameters:
      - type: object
        mapping: $.
